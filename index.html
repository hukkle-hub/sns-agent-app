<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>SNS 에이전트 운영 플랫폼</title>
<meta name="theme-color" content="var(--bg2)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="에이전트 플랫폼" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ 화면 톤 (v311) ══
   결재 화면의 그린톤이 눈에 편하고 밤에도 보기 좋아, 그 색을 앱 전체로 넓혔다.
   여기 한 곳만 고치면 모든 화면 색이 함께 바뀐다.

   그동안 색이 화면마다 따로 박혀 있어(var(--bg), #12211E …)
   결재 화면만 다른 앱처럼 보였다. 이제 이름으로 부른다. */
:root{
  --bg:      #12211E;   /* 바탕 — 깊은 초록 */
  --bg2:     #1A2E29;   /* 살짝 밝은 바탕 */
  --card:    #EDE9DF;   /* 종이 — 글이 놓이는 자리 */
  --card2:   #F4EFE2;   /* 밝은 종이 */
  --ink:     #1C2B27;   /* 종이 위 글자 */
  --ink2:    #6B7A74;   /* 흐린 글자 */
  --on-bg:   #EDE9DF;   /* 바탕 위 글자 */
  --on-bg2:  #A9C0B7;   /* 바탕 위 흐린 글자 */
  --line:    rgba(255,255,255,.13);
  --seal:    #B23A32;   /* 결재 도장 빨강 */
  --done:    #2E7D5B;   /* 끝남 */
  --wait:    #C9A227;   /* 기다림 */
  --idle:    #5B93B4;   /* 쉬는 중 */
  --accent:  #3E7A9B;   /* 누르는 것 */
}

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--ink)}
  #root{width:100%;max-width:820px;margin:0 auto;height:100vh;display:flex;flex-direction:column;box-sizing:border-box}
  .vtabs{display:flex;align-items:center;width:100%;box-sizing:border-box;gap:5px;padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .vtabs::-webkit-scrollbar{display:none}
  .vtab{flex:1 1 0;min-width:0;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:11px;letter-spacing:-.2px;color:var(--on-bg2);cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(30,55,100,.05)}
  .cc-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .cc-body{font-size:12.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;background:var(--card2);border:1px solid var(--bg);border-radius:8px;padding:9px 11px}
  .cc-toggle{cursor:pointer;user-select:none;align-items:center}
  .cc-sum{font-size:11px;color:#7a8698;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .cc-arrow{flex:none;color:var(--on-bg2);font-size:12px;transition:transform .18s ease;margin-left:6px}
  .cc-collapsed .cc-fold{display:none}
  .ccard:not(.cc-collapsed) .cc-arrow{transform:rotate(90deg)}
  .cc-fold{margin-top:8px}
  .cc-body:has(.sb-wrap){max-height:none;white-space:normal;background:transparent;border:none;padding:0}
  .sb-wrap{display:flex;flex-direction:column;gap:10px}
  .sb-hd{font-size:12px;font-weight:800;color:#3a4a63;margin-bottom:2px}
  .sb-card{display:flex;gap:10px;background:var(--card);border:1px solid #e4e9f2;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(30,50,90,.05)}
  .sb-frame{width:116px;flex:none;background:#e8edf5;border-right:1px solid #e4e9f2;aspect-ratio:5/4;position:relative}
  .sb-gen{position:absolute;right:5px;bottom:5px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .sb-gen:active{transform:scale(.9)}
  .sb-frame.sb-loading{animation:sbpulse 1s ease-in-out infinite}
  @keyframes sbpulse{0%,100%{opacity:1}50%{opacity:.5}}
  .sb-img{width:100%;height:100%;object-fit:cover;display:block}
  .sb-hint{font-size:9.5px;font-weight:500;color:#8a93a6;margin-left:6px}
  .sb-frame svg{display:block}
  .sb-info{flex:1;min-width:0;padding:9px 11px}
  .sb-cut{font-size:11px;font-weight:800;color:#1f5fa8;letter-spacing:.4px;margin-bottom:5px}
  .sb-cut .sb-title{color:#33415a;font-weight:600;margin-left:4px}
  .sb-row{font-size:11.5px;line-height:1.5;color:#3a4553;display:flex;gap:5px;margin-top:3px}
  .sb-row .sb-k{flex:none}
  .sb-cap{font-weight:700;color:#111}
  .sb-prompt{color:#7a869a;font-size:10.5px;font-style:italic}
  @media (max-width:479px){ .sb-frame{width:96px} }
  .blogbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .bb{background:var(--bg);color:var(--ink);border:none;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .bb-go{background:#e7f0ff;color:#2b5b9e}
  .cgroup{margin-bottom:18px;padding-bottom:12px;border-bottom:2px dashed #dbe2ee}
  .report{background:linear-gradient(180deg,#15203a,#101b2f);color:#e7eefb;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(30,45,90,.18)}
  .rep-top{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .rep-new{background:var(--done);color:#06140d;font-size:10px;padding:1px 7px;border-radius:999px}
  .rep-time{margin-left:auto;font-size:11px;color:#9fb2d6;font-weight:600}
  .rep-line{font-size:12.5px;color:#cdd9ef;margin-top:5px}
  .rep-line b{color:#7fd4ff}
  .rep-badge{display:inline-block;margin-top:8px;background:rgba(52,224,161,.16);color:var(--done);font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
  .vtab.on{background:#5ed4e21a;border-color:#5ed4e2;color:#5ed4e2}
/* 내 차례 개수. 0이면 숨긴다 — 할 게 없는 날까지 재촉하지 않도록. */
.vtab-n{margin-left:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:#c0392b;color:#fff;font-size:9.5px;font-weight:800;line-height:16px;text-align:center}
.vtab-n[hidden]{display:none}
  .vtab-gear{flex:0 0 46px;min-width:46px;font-size:17px;padding:8px 0}
  .vsubtabs{display:flex;gap:6px;padding:6px 12px;background:var(--card2);border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .vsubtabs::-webkit-scrollbar{display:none}
  .vsub{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 15px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s}
  .vsub.on{background:#5ed4e21a;border-color:#5ed4e2;color:#0e8aa0;font-weight:700}
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--on-bg2);padding:5px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
  .topbar b{color:var(--done)}
  .memobtn{background:var(--card);border:1px solid var(--line);border-radius:7px;color:var(--ink2);font-size:9.5px;padding:3px 9px;cursor:pointer;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:4px}
  .dock-toggle{display:none}
  .memobtn:hover{border-color:var(--done);color:var(--done)}
  #view{flex:1;min-height:0;display:flex;flex-direction:column}

  .c-hd{padding:11px 16px 9px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#ffffff,#ffffff)}
  .agentbar-bottom{border-top:1px solid var(--line);background:#fbfcfe;padding:8px 12px 5px;flex-shrink:0}
  .agentbar-bottom .agents{overflow-x:auto;flex-wrap:nowrap;gap:6px}
  .c-logo{display:flex;align-items:center;gap:8px;font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;color:var(--ink);margin-bottom:9px}
  .agents{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}
  .agents::-webkit-scrollbar{height:0}
  .ag{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;width:48px;opacity:1;transition:all .25s;cursor:pointer;border-radius:10px;padding:3px 1px}
  .ag:hover{background:rgba(94,212,226,.12)}
  .ag.busy{background:rgba(52,224,161,.16)}
  .ag.busy .nm{color:#1aa251;font-weight:700}
  .ag .nm{font-size:7px;color:var(--ink2);text-align:center;line-height:1.1}
  .c-log{flex:1;overflow-y:auto;padding:16px}
  .empty{text-align:center;color:var(--ink2);padding:30px 18px;font-size:12px;line-height:1.9}
  .msg{margin-bottom:14px;animation:sl .3s ease}
  .op{display:flex;justify-content:flex-end}
  .opb{background:#2b5b9e;border:1px solid #2b5b9e;border-radius:13px 13px 4px 13px;padding:10px 13px;font-size:12.5px;max-width:80%;color:#ffffff}
  .route{display:flex;align-items:center;gap:7px;font-size:10.5px;color:#a08a4e;margin:3px 0 10px;padding-left:3px;flex-wrap:wrap}
  .amsg{display:flex;gap:10px;align-items:flex-start}
  .abody{flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px 13px 13px 13px;padding:11px 14px;min-width:0}
  .aname{font-size:9.5px;font-weight:700;margin-bottom:6px}
  .atext{font-size:12.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .pubrow{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pubbtn{background:#e9faf3;color:#0f9d6c;border:1px solid #bdeeda;border-radius:8px;font-size:10.5px;padding:6px 11px;cursor:pointer;font-family:'JetBrains Mono',monospace;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.pubbtn.tool{background:var(--card);color:var(--ink2);border-color:var(--line)}.pubbtn.all{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pubbtn.off{background:var(--card);color:var(--ink2);border-color:var(--line);cursor:default}
  .pubmsg{font-size:10.5px;color:var(--done);background:#e9f7f0;border:1px solid var(--done)33;border-radius:8px;padding:7px 11px}
  .pubmsg.warn{color:#ffd84d;background:#fff7e0;border-color:#ffd84d33}
  /* mobile */
  .m-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(700px 380px at 50% 0%,#e8eef8,var(--bg) 70%);padding:14px 10px;min-height:0}
  .phone{width:370px;max-width:100%;height:100%;max-height:720px;background:var(--bg2);border:1px solid var(--line);border-radius:40px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5);position:relative}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:100px;height:22px;background:#000;border-radius:99px;z-index:5}
  .m-hd{padding:30px 16px 9px;border-bottom:1px solid var(--line);flex-shrink:0}
  .m-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
  .m-log{flex:1;overflow-y:auto;padding:12px 13px}
  /* kakao */
  .k-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:#9bbbd4}
  .k-hd{background:#a3c2da;padding:12px 14px;display:flex;align-items:center;gap:9px;flex-shrink:0;border-bottom:1px solid #8fb0ca}
  .k-title{font-weight:700;font-size:14px;color:#1a2733}
  .k-sub{font-size:9.5px;color:#3a4d5e}
  .k-log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:11px}
  .k-row{display:flex;gap:7px;max-width:84%;animation:sl .3s ease}
  .k-row.me{align-self:flex-end;flex-direction:row-reverse}
  .k-prof{width:34px;height:34px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#fff}
  .k-bubblewrap{display:flex;flex-direction:column;gap:3px}
  .k-name{font-size:10px;color:#33485c;margin-left:2px}
  .k-bubble{background:var(--card);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:12.5px;color:#1a1a1a;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .k-row.me .k-bubble{background:#fee500;border-radius:14px 4px 14px 14px}
  .k-meta{font-size:8.5px;color:#5a7286;align-self:flex-end;margin:0 2px}
  /* settings */
  .s-wrap{flex:1;overflow-y:auto;background:var(--bg2);padding:18px 16px 30px}
  .pj-new{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .pj-in{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;margin-bottom:7px}
  .pj-ta{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;min-height:56px;resize:vertical}
  .pj-row{display:flex;gap:7px;margin-top:7px;align-items:center}
  .pj-sel,.pj-sel2{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;background:#fff}
  .pj-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
  .pj-h{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);margin-bottom:5px}
  .pj-badge{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--ink2);white-space:nowrap}
  .pj-badge.on{background:#e2f6ec;color:#12a150}
  .pj-badge.await{background:#fff2dd;color:#c67c1a}
  .pj-goal{font-size:12px;color:var(--ink2);line-height:1.5;margin-bottom:5px}
  .pj-meta{font-size:10.5px;color:var(--on-bg2);margin-bottom:8px}
  .pj-live{display:flex;align-items:center;gap:7px;background:#eef7f1;border:1px solid #cfe9db;border-radius:9px;padding:7px 10px;margin-bottom:8px}
  .pj-live-dot{width:8px;height:8px;border-radius:50%;background:#12a150;flex:none;animation:pjpulse 1.1s ease-in-out infinite}

function directDept(instruction){

    var hit=nms.some(function(nm){return t.indexOf(nm)>=0;}) || t.indexOf(AGENTS[id].no+" ")>=0 || t.indexOf(AGENTS[id].no+"번")>=0;
    if(!hit) hit=toks.some(function(tok){return t.indexOf(tok)>=0;});
    if(hit) hits.push(id);
  });
  hits.sort(function(a,b){ return dpos(t,a)-dpos(t,b); });
  return hits;
}

SPEECH.token=0;
async function studioSay(text, dept){

  try{
    var chunks=chunkForTts(text);
    if(!chunks.length) return;
    var next=ttsFetch(chunks[0], dept);
    for(var i=0;i<chunks.length;i++){
      var url;
      try{ url=await next; }catch(e){ if(tok===SPEECH.token) ttsFailNotice(e); return; }
      if(tok!==SPEECH.token) return; // 다른 재생이 시작됨/정지됨
      if(i+1<chunks.length) next=ttsFetch(chunks[i+1], dept); // 재생과 동시에 다음 조각 생성
      await playUrl(url, tok);

function splitSentences(text){

  var parts=t.split(/([.!?。…]+)/), out=[], cur="";
  for(var i=0;i<parts.length;i++){ cur+=parts[i]; if(/[.!?。…]/.test(parts[i])){ if(cur.trim()) out.push(cur.trim()); cur=""; } }
  if(cur.trim()) out.push(cur.trim());

  var into = ((mins-base)%cycle+cycle)%cycle;

function migrateLegacyDepts(d){
  if(!d||typeof d!=="object") return d;
  var MAP={engagement:"creation",growth:"monetization"};
  function fix(x){ return MAP[x]||x; }
  if(Array.isArray(d.messages)) d.messages.forEach(function(m){
    if(!m) return;
    if(m.deptId) m.deptId=fix(m.deptId);
    if(m._replyTo) m._replyTo=fix(m._replyTo);
    if(m.dept) m.dept=fix(m.dept);
    if(Array.isArray(m.depts)) m.depts=m.depts.map(fix);
  });
  ["deptMemory","deptExp","deptKnowledge","deptDirective","deptClips","lastTrainAt","leaderDailyDirective"].forEach(function(k){
    var o=d[k]; if(!o||typeof o!=="object") return;
    Object.keys(MAP).forEach(function(old){
      if(o[old]===undefined) return;
      var nw=MAP[old];
      if(Array.isArray(o[old])) o[nw]=(o[nw]||[]).concat(o[old]);
      else if(typeof o[old]==="number") o[nw]=Math.max(o[nw]||0, o[old]);
      else if(o[nw]===undefined) o[nw]=o[old];
      delete o[old];
    });
  });
  if(Array.isArray(d.meetingAlways)) d.meetingAlways=d.meetingAlways.map(fix).filter(function(v,i,a){return a.indexOf(v)===i;});
  if(Array.isArray(d.meetings)) d.meetings.forEach(function(mt){ if(mt&&Array.isArray(mt.depts)) mt.depts=mt.depts.map(fix); });
  return d;
}

var backupTimer=null;
function startAutoBackup(){
  if(backupTimer){ clearInterval(backupTimer); backupTimer=null; }
  // 자동백업 기본 켜짐(하루 1회 = 1440분). 사용자가 STATE.autoBackup을 지정하면 그 값 사용.
  var mins = (STATE.autoBackup>0) ? STATE.autoBackup : 1440;
  backupTimer=setInterval(function(){ saveAutoBackup(); }, mins*60000);
  // 앱 열 때마다 '마지막 정상' 스냅샷을 브라우저에 별도 보관(덮어쓰기 사고 대비)
  try{ keepSafetySnapshot(); }catch(e){}
}
// 브라우저에 '마지막 정상 상태'를 별도 키로 보관 — 서버가 비어도 여기서 복구 가능
function keepSafetySnapshot(){
  try{
    var snap = stateSnapshot();
    // 의미 있는 데이터가 있을 때만 보관(빈 상태로 덮지 않음)
    var hasContent = (STATE.messages&&STATE.messages.length>3) || (STATE.meetings&&STATE.meetings.length) ||
                     (STATE.deptExp && Object.values(STATE.deptExp).reduce(function(a,v){return a+(+v||0);},0)>60) ||
                     (STATE.deptKnowledge && Object.keys(STATE.deptKnowledge).length);
    if(hasContent){ localStorage.setItem("sns_safety_snapshot", JSON.stringify({ at:Date.now(), data:snap })); }
  }catch(e){}
}
function saveAutoBackup(){
  if(!STATE.messages.length && !STATE.meetings.length) return;
  keepSafetySnapshot();
  // 복원 가능한 JSON 백업 파일 다운로드(진짜 백업)
  try{
    var json = backupJson();
    var blob = new Blob([json], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = backupName();
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }catch(e){}
}
// ===== 웹(클라우드) 백업·복원 — 기기 간 수동 동기화 =====
function applySnapshot(d){
  if(!d || typeof d!=="object") return false;
  var skip={ v:1, savedAt:1 };
  Object.keys(d).forEach(function(k){ if(!skip[k] && d[k]!==undefined) STATE[k]=d[k]; });
  if(STATE.meetingRooms) STATE.meetingRooms=STATE.meetingRooms.slice(0,5);
  return true;
}
async function cloudBackupSave(){
  if(!useBackend()) throw new Error("백엔드 연결이 필요해요.");
  try{ await pushState(); }catch(e){}
  await wakeServer(50000);
  var snap = stateSnapshot();
  var r=await fetch(backendOrigin()+"/api/cloud-backup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ data: snap })});
  var d=await r.json();
  // 덮어쓰기 보호: 기존 백업보다 내용이 크게 적으면 서버가 막는다 → 사용자에게 확인
  if(r.status===409 && d && d.기존백업){
    var msg = "⚠️ 덮어쓰기 보호\n\n이 기기의 데이터가 기존 백업보다 훨씬 적어요.\n"
      + "기존 백업: "+(d.기존백업.저장시각||"?")+" (내용량 "+(d.기존백업.점수||0)+")\n"
      + "이번 백업: 내용량 "+((d.이번백업&&d.이번백업.점수)||0)+"\n\n"
      + "그대로 저장하면 다른 기기에서 저장한 백업이 사라집니다.\n정말 덮어쓸까요?";
    if(!confirm(msg)) throw new Error("덮어쓰기를 취소했어요. (기존 백업은 그대로 있습니다)");
    var r2=await fetch(backendOrigin()+"/api/cloud-backup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ data: snap, force:true })});
    var d2=await r2.json(); if(d2.error) throw new Error(d2.error);
    return d2.at;
  }
  if(d.error) throw new Error(d.error);
  return d.at;
}

async function callClaude(system, user){
  var useBackend = !!(STATE.backendUrl && STATE.backendUrl.trim());
  var url = useBackend ? STATE.backendUrl.trim() : "https://api.anthropic.com/v1/messages";
  var body = useBackend
    ? JSON.stringify({ system:system, user:user })
    : JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1200, system:system, messages:[{role:"user",content:user}] });
  var res = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:body });
  var raw = await res.text();
  var data;
  try{ data = JSON.parse(raw); }
  catch(e){
    throw new Error(useBackend
      ? "백엔드 응답 오류 — 백엔드 URL/서버 상태를 확인하세요"
      : "미리보기 밖에서는 직접 호출이 안 됩니다 → ⚙️설정 > AI 백엔드 URL을 입력하세요");
  }
  if(data && typeof data.text === "string") return data.text.trim();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}

function useBackend(){ return !!(STATE.backendUrl && STATE.backendUrl.trim()); }
function backendOrigin(){ try{ return new URL(STATE.backendUrl.trim()).origin; }catch(e){ return STATE.backendUrl.trim().replace(/\/api\/.*$/,"").replace(/\/$/,""); } }
function buildHistory(skipText){
  var out=[];
  var msgs=(STATE.messages||[]);
  for(var k=Math.max(0,msgs.length-18); k<msgs.length; k++){
    var m=msgs[k]; if(!m||!m.text) continue;
    var t=String(m.text).trim(); if(!t) continue;
    if(m.role==="op"){ if(skipText && t===String(skipText).trim()) continue; out.push("클라이언트: "+t.slice(0,500)); }
    else if(m.role==="agent"){ var a=AGENTS[m.deptId]; var nm=(typeof DEPT_MEMBERS!=="undefined"&&DEPT_MEMBERS[m.deptId])?(" "+DEPT_MEMBERS[m.deptId]):""; out.push((a?a.no+" "+a.kr+nm:m.deptId||"부서")+": "+t.slice(0,320)); }
    else if(m.role==="plan"){ out.push("👑 총괄: "+t.slice(0,300)); }
    else if(m.role==="opinion"){ var ao=AGENTS[m.deptId]; out.push((ao?ao.no+" "+ao.kr:"부서")+" 의견: "+t.slice(0,200)); }
  }
  var h=out.join("\n");
  if(h.length>2800) h="…"+h.slice(-2800);
  return h;
}

  return d;
}

// 지시 작업 폴링 — 앱을 닫았다 와도 STATE.pendingJobs로 재추적
var IPOLLS={};
function pollInstruct(jobId){
  if(IPOLLS[jobId] || !useBackend()) return;
  IPOLLS[jobId]={ started:Date.now() };
  (function tick(){
    var p=IPOLLS[jobId]; if(!p) return;
    if(Date.now()-p.started > 30*60000){ delete IPOLLS[jobId]; return; } // 30분 안전 정지(완료분은 sync로 수신)
    fetch(backendOrigin()+"/api/instruct/"+jobId).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.error){ // 작업을 못 찾음(서버 재배포 등) → 몇 번 후 정리
        p.miss=(p.miss||0)+1;
        if(p.miss>=3){
          delete IPOLLS[jobId];
          STATE.pendingJobs=(STATE.pendingJobs||[]).filter(function(x){return x!==jobId;});
          STATE.messages=STATE.messages.filter(function(ms){ return ms._waitJob!==jobId; });
          saveState(); render();
          return;
        }
        setTimeout(tick, 5000); return;
      }
      if(j && !j.error && j.status==="running"){
        // 진행 중 — '현재 작업 내용'으로 자리표시 갱신
        var pm=STATE.messages.filter(function(ms){return ms._waitJob===jobId;})[0];
        if(pm){
          var body=(j.progress||"부서들이 작업 중…");
          var doneN=(j.results||[]).length;
          if(doneN) body += "  ·  완료 "+doneN+"건";
          var newText=body+"\n(앱을 닫거나 화면을 꺼도 서버에서 계속 진행됩니다)";
          if(pm.text!==newText){ pm.title="⏳ 수행 중…"; pm.text=newText; saveState(); if(STATE.view==="console"||STATE.view==="mobile") render(); }
        }
        setTimeout(tick, 4000); return;
      }
      if(j && !j.error && j.status!=="running"){
        delete IPOLLS[jobId];
        STATE.pendingJobs=(STATE.pendingJobs||[]).filter(function(x){return x!==jobId;});
        // 자리표시 메시지 제거
        STATE.messages=STATE.messages.filter(function(ms){ return ms._waitJob!==jobId; });
        if(j.status==="error"){
          STATE.messages.push({ role:"plan", title:"⚠️ 수행 실패", text:"지시 수행이 중단됐어요: "+(j.error||"원인 미상")+"\n다시 시도해 주세요.", depts:[] });
        } else if(STATE.seenJobIds.indexOf(j.id)<0){
          STATE.seenJobIds.push(j.id);
          pushJobMessages(j);
          if(STATE.voiceAuto && j.results && j.results.length){ try{ var lr=j.results[j.results.length-1]; var ls=document.querySelectorAll(".vn-stand"); speak(lr.text, lr.dept, ls[ls.length-1]); }catch(e){} }
        }
        saveState(); render();
        try{ syncBackend(); }catch(e){}
        return;
      }
      setTimeout(tick, 4000);
    }).catch(function(){ setTimeout(tick, 6000); });
  })();
}
function resumePendingJobs(){
  (STATE.pendingJobs||[]).forEach(function(id){ pollInstruct(id); });
  // 고아 placeholder 정리: pendingJobs에 없지만 메시지에 남은 '수행 중'도 폴링해 완료/에러 시 자동 제거
  (STATE.messages||[]).forEach(function(m){
    if(m && m._waitJob && (STATE.pendingJobs||[]).indexOf(m._waitJob)<0){
      if(useBackend()) pollInstruct(m._waitJob);
      else { m.title="⚠️ 수행 중단"; m.text="백엔드 연결이 끊겨 진행 상태를 확인할 수 없어요. 취소 후 다시 시도해 주세요."; }
    }
  });
}
function pushJobMessages(j){
  if(j.deliberate){
    STATE.messages.push({ role:"route", depts:(j.candidates||j.depts||[]), phase:"opinion", time:nowTime() });
    (j.opinions||[]).forEach(function(o){ STATE.messages.push({ role:"opinion", deptId:o.dept, text:o.text, time:nowTime() }); });
    if(j.discussion) STATE.messages.push({ role:"debate", text:j.discussion, time:nowTime() });
    STATE.messages.push({ role:"plan", text:j.plan||"", depts:j.depts||[], title:"👑 총괄 최종 결정", time:nowTime() });
    (j.results||[]).forEach(function(r,ri){ STATE.messages.push({ role:"agent", deptId:r.dept, text:r.text, time:nowTime(), at:Date.now(), _new:(ri===j.results.length-1), _jid:j.id, _inst:(j.instruction||"") }); });
  } else if(j.plan){
    STATE.messages.push({ role:"plan", text:j.plan, depts:j.depts||[], title:"👑 총괄 기획·분담", time:nowTime() });
    (j.results||[]).forEach(function(r,ri){ STATE.messages.push({ role:"agent", deptId:r.dept, text:r.text, time:nowTime(), at:Date.now(), _new:(ri===j.results.length-1), _jid:j.id, _inst:(j.instruction||"") }); });
  } else {
    STATE.messages.push({ role:"route", depts:j.depts||[], direct:!!j.direct, time:nowTime() });
    (j.results||[]).forEach(function(r,ri){ STATE.messages.push({ role:"agent", deptId:r.dept, text:r.text, time:nowTime(), at:Date.now(), _new:(ri===j.results.length-1), _jid:j.id, _inst:(j.instruction||"") }); });
  }
}
function applyJob(j){
  if(!j || STATE.seenJobIds.indexOf(j.id)>=0) return false;
  STATE.seenJobIds.push(j.id);
  STATE.messages.push({ role:"op", text:j.instruction, via:j.source, time:nowTime() });
  pushJobMessages(j);
  return true;
}
async function syncBackend(full){
  if(!useBackend()) return {jobs:0,meetings:0,collections:0};
  try{ resumePendingJobs(); }catch(e){}
  var cnt={jobs:0,meetings:0,collections:0};
  try{
    var since = full ? 0 : (STATE.lastSync||0);
    var r = await fetch(backendOrigin()+"/api/sync?since="+since);
    var d = await r.json();
    var added=false;
    (d.jobs||[]).forEach(function(j){ if(j.type==="instruct" && applyJob(j)){ added=true; cnt.jobs++; } });
    if(d.deptMemory && typeof d.deptMemory==="object"){
      // 덮어쓰지 않고 병합: 부서별로 항목이 더 많은 쪽(누적 보존)을 유지
      STATE.deptMemory = STATE.deptMemory || {};
      Object.keys(d.deptMemory).forEach(function(dep){
        var serverArr=d.deptMemory[dep]||[], localArr=STATE.deptMemory[dep]||[];
        if(serverArr.length >= localArr.length) STATE.deptMemory[dep]=serverArr;
      });
    }
    if(d.clientProfile && typeof d.clientProfile==="object"){
      if((d.clientProfile.at||0) >= ((STATE.clientProfile&&STATE.clientProfile.at)||0)) STATE.clientProfile=d.clientProfile;
    }
    if(Array.isArray(d.briefings) && d.briefings.length){
      STATE.briefings = STATE.briefings || [];
      var seen={}; STATE.briefings.forEach(function(b){ seen[b.at]=1; });
      d.briefings.forEach(function(b){ if(!seen[b.at]) STATE.briefings.push(b); });
      STATE.briefings.sort(function(a,b){ return (a.at||0)-(b.at||0); });
      if(STATE.briefings.length>30) STATE.briefings=STATE.briefings.slice(-30);
    }
    if(Array.isArray(d.leadDirectives) && d.leadDirectives.length){
      STATE.leadDirectives = STATE.leadDirectives || [];
      var seenL={}; STATE.leadDirectives.forEach(function(x){ seenL[x.at+":"+x.dept]=1; });
      d.leadDirectives.forEach(function(x){ if(!seenL[x.at+":"+x.dept]) STATE.leadDirectives.push(x); });
      STATE.leadDirectives.sort(function(a,b){ return (a.at||0)-(b.at||0); });
      if(STATE.leadDirectives.length>60) STATE.leadDirectives=STATE.leadDirectives.slice(-60);
    }
    if(Array.isArray(d.projects)) STATE.projects=d.projects;
    if(d.crew&&typeof d.crew==="object") STATE.crew=d.crew;
    if(d.crewExp&&typeof d.crewExp==="object") STATE.crewExp=d.crewExp;
    if(d.leaderDailyDirective && typeof d.leaderDailyDirective==="object") STATE.leaderDailyDirective=d.leaderDailyDirective;
    if(d.lastTrainAt && typeof d.lastTrainAt==="object") STATE.lastTrainAt=d.lastTrainAt;
    if(typeof d.lastTrainRoundAt==="number") STATE.lastTrainRoundAt=d.lastTrainRoundAt;
    if(d.deptKnowledge && typeof d.deptKnowledge==="object"){
      STATE.deptKnowledge = STATE.deptKnowledge || {};
      Object.keys(d.deptKnowledge).forEach(function(dep){
        var sv=d.deptKnowledge[dep]||{}, lo=STATE.deptKnowledge[dep]||{};
        if((sv.at||0) >= (lo.at||0)) STATE.deptKnowledge[dep]=sv;
      });
    }
    if(d.exp && typeof d.exp==="object"){
      // 경험치는 큰 값 유지(절대 줄지 않게)
      STATE.deptExp = STATE.deptExp || {};
      Object.keys(d.exp).forEach(function(dep){ STATE.deptExp[dep]=Math.max(STATE.deptExp[dep]||0, d.exp[dep]||0); });
    }
    if(Array.isArray(d.collections) && d.collections.length){
      var cids = STATE.collections.map(x=>x.id);
      d.collections.forEach(function(c){ if(cids.indexOf(c.id)<0){ STATE.collections.push(c); added=true; cnt.collections++; } });
    }
    if(Array.isArray(d.meetings) && d.meetings.length){
      d.meetings.forEach(function(m){
        var idx=-1; STATE.meetings.forEach(function(x,k){ if(x.id===m.id) idx=k; });
        if(idx<0){ STATE.meetings.push(m); cnt.meetings++; }
        else {
          var loc=STATE.meetings[idx];
          // 서버 쪽이 더 진행됐으면 갱신 (실시간/완료 반영)
          if((m.status==="done"&&loc.status!=="done") || (m.transcript||[]).length>(loc.transcript||[]).length){
            m.rating=loc.rating||m.rating; m.feedback=loc.feedback||m.feedback; m.actions=loc.actions||m.actions;
            STATE.meetings[idx]=m;
          }
        }
      });
    }
    if(Array.isArray(d.pubInbox)){
      var prevN = (STATE.pubInbox||[]).length;
      STATE.pubInbox = d.pubInbox;
      if(d.pubInbox.length > prevN) added = true;   // 새 발행함 항목 오면 다시 그림
    }
    if(d.analytics && typeof d.analytics==="object") STATE.analytics = d.analytics;
    if(d.analyticsInsight && typeof d.analyticsInsight==="object" && d.analyticsInsight.text) STATE.analyticsInsight = d.analyticsInsight;
    if(d.bestTimes && typeof d.bestTimes==="object") STATE.bestTimes = d.bestTimes;
    if(Array.isArray(d.characters)) STATE.characters = d.characters;
    if(Array.isArray(d.blogArchive)) STATE.blogArchive = d.blogArchive;
    STATE.lastSync = d.updatedAt || Date.now();
    saveState();
    if(added) render();
  }catch(e){ /* 오프라인 등은 조용히 무시 */ }
  return cnt;
}

// 총괄: 1개 이상 부서 배정 (다중 분배)
async function route(instruction){
  const list = Object.keys(AGENTS).map(id => id+" = "+AGENTS[id].no+" "+AGENTS[id].kr).join("\n");
  const sys = "너는 SNS 자동화 회사의 총괄 대리인이다. 클라이언트님의 지시를 처리할 부서를 1개 이상 고른다. 복합 작업(예: 기획+제작+발행)이면 필요한 부서를 순서대로 모두 고른다. 부서 id(영문 키)만 콤마로 구분해 출력하라. 다른 말 금지. 예: strategy,creation,publishing";
  const out = await callClaude(sys, "부서:\n"+list+"\n\n지시: "+instruction);
  const ids = Object.keys(AGENTS); const low = out.toLowerCase();
  var picked = ids.filter(id => low.includes(id));
  // 출현 순서 정렬
  picked.sort((a,b)=> low.indexOf(a)-low.indexOf(b));
  return picked.length ? picked : ["strategy"];
}
async function work(deptId, instruction, context){

var pendingAttach = []; // [{kind:'image'|'video', dataUrl, media_type, data(base64), name}]
function fileToImageRefs(file){
  return new Promise(function(resolve){
    if(file.type.indexOf("image/")===0){
      var img=new Image();
      img.onload=function(){
        var max=1024, w=img.width, h=img.height;
        if(w>max||h>max){ if(w>=h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        var durl=c.toDataURL("image/jpeg",0.82);
        resolve({ kind:"image", dataUrl:durl, media_type:"image/jpeg", data:durl.split(",")[1], name:file.name });
      };
      img.onerror=function(){ resolve(null); };
      img.src=URL.createObjectURL(file);
    } else if(file.type.indexOf("video/")===0){
      // 영상은 대표 프레임 1장을 캡처해 참고
      var v=document.createElement("video"); v.muted=true; v.playsInline=true;
      v.onloadeddata=function(){ try{ v.currentTime=Math.min(0.5, (v.duration||1)/2); }catch(e){ cap(); } };
      v.onseeked=cap;
      v.onerror=function(){ resolve(null); };
      function cap(){
        var max=1024, w=v.videoWidth||640, h=v.videoHeight||360;
        if(w>max||h>max){ if(w>=h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(v,0,0,w,h);
        var durl=c.toDataURL("image/jpeg",0.82);
        // 썸네일 + 실제 mp4 전체(업로드용)를 함께 보관
        var fr=new FileReader();
        fr.onload=function(){ resolve({ kind:"video", dataUrl:durl, media_type:"image/jpeg", data:durl.split(",")[1], full:fr.result, name:file.name }); };
        fr.onerror=function(){ resolve({ kind:"video", dataUrl:durl, media_type:"image/jpeg", data:durl.split(",")[1], name:file.name }); };
        fr.readAsDataURL(file);
      }
      v.src=URL.createObjectURL(file);
    } else resolve(null);
  });
}
async function addAttachments(files){
  for(var i=0;i<files.length && pendingAttach.length<5;i++){
    var ref=await fileToImageRefs(files[i]);
    if(ref) pendingAttach.push(ref);
  }
  renderAttachBar();
}

  }).join("");

async function submit(text, via){
  text = (text||"").trim();
  if((!text && !pendingAttach.length) || STATE.busy) return;
  // '이어 대화' 타깃: 특정 부서 답변에 이어서 → 그 부서로 후속 전달(맥락 유지)
  var _replyT = STATE.replyTarget; STATE.replyTarget = null;

  if(text && /자율\s*(수행|지시)/.test(text)){
    var dps=directDept(text);
    STATE.messages.push({ role:"op", text:text, via:via, time:nowTime() });

      render(); return;
    }
    var dd=dps[0], aa=AGENTS[dd], mm=(typeof DEPT_MEMBERS!=="undefined"?DEPT_MEMBERS[dd]:"")||"";
    var body=text.replace(/자율\s*(수행|지시)/g," ");
    [aa.no+"번", aa.no, mm, aa.kr].concat(aa.kr.split(/[·\/\s]/)).forEach(function(tok){ if(tok&&tok.length>=1) body=body.split(tok).join(" "); });
    body=body.replace(/^[\s:：,\-]+/,"").replace(/\s+/g," ").trim();
    var clear=(body==="")||/^(해제|중지|끄기|취소|삭제|그만)/.test(body);
    if(!STATE.deptDirective) STATE.deptDirective={};
    if(clear){ delete STATE.deptDirective[dd]; } else { STATE.deptDirective[dd]=body; }
    saveState(); if(useBackend()) pushState();
    STATE.messages.push({ role:"plan", title:"🤖 자율수행 지시", text: clear
        ? (aa.no+" "+aa.kr+" 자율수행 지시를 해제했어요. 기본(트렌드 학습·반응 수집)으로 돌아갑니다.")
        : (aa.no+" "+aa.kr+"에 자율수행 지시를 등록했어요:\n\u201c"+body+"\u201d\n주기마다 이 부서가 자동으로 수행해요. (설정 › 자율수행 주기 ON, 백엔드 연결 필요)"),
      depts:[dd] });
    render(); return;
  }
  var atts = pendingAttach.slice();
  pendingAttach = []; renderAttachBar();
  // 첨부된 mp4를 백엔드에 업로드해 공개 URL로 보관(재생·발행 가능). 저장소 없으면 썸네일만 유지.
  if(useBackend()){
    for(var ai=0; ai<atts.length; ai++){
      var a=atts[ai];
      if(a.kind==="video" && a.full && !a.url){
        try{
          var ur=await fetch(backendOrigin()+"/api/upload-video",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ data:a.full, mime:"video/mp4" }) });
          var ud=await ur.json(); if(ud && ud.url) a.url=ud.url;
        }catch(e){}
        a.full=null;
      }
    }
  }
  STATE.busy = true;
  var _opMsg={ role:"op", text:text, via:via, time:nowTime(), atts: atts.map(function(a){ return { dataUrl:a.dataUrl, kind:a.kind, url:a.url||null, name:a.name||null }; }) };
  // 이어 대화면 그 부서로 직접 전달되도록 백엔드 지시를 가공(화면 표시는 입력 그대로)
  var _backendText=text;
  if(_replyT && AGENTS[_replyT.dept] && text){
    var _nm=(typeof DEPT_MEMBERS!=="undefined"&&DEPT_MEMBERS[_replyT.dept])?DEPT_MEMBERS[_replyT.dept]:AGENTS[_replyT.dept].kr;
    _backendText=_nm+"("+AGENTS[_replyT.dept].kr+") 이어서 — 앞서 네가 한 답변에 이어 아래 운영자 메시지에 답하라. 처음부터 다시 하지 말고 직전 맥락을 기억해 연결하라.\n\n운영자: "+text;
    _opMsg._replyTo=_replyT.dept;
  }
  STATE.messages.push(_opMsg);
  /* v259: 서버 응답을 기다리는 동안 화면이 멈춘 것처럼 보이던 구간을 메운다.
     instructBackend() 는 서버가 잠들어 있으면 50초 넘게 걸릴 수 있는데,
     기존에는 그게 끝난 뒤에야 '수행 중'이 떴다. 먼저 띄우고 나중에 갱신한다. */
  var _ack = { role:"plan", title:"⏳ 접수했어요", depts:[], _ack:true, _startedAt:Date.now(),
    text:"내용을 확인하고 담당 부서를 배정하는 중이에요…" };
  STATE.messages.push(_ack);
  render();
  var _ackTimer = setTimeout(function(){
    if(_ack._ack){ _ack.text = "서버를 깨우는 중이에요. 처음 요청은 1분 가까이 걸릴 수 있어요…"; render(); }
  }, 6000);
  var _dropAck = function(){
    clearTimeout(_ackTimer);
    if(_ack._ack) STATE.messages = STATE.messages.filter(function(m){ return m!==_ack; });
  };
  try {
    if(useBackend()){
      // 백엔드가 작업을 받아 백그라운드에서 수행 → 앱을 닫아도 진행, 폴링으로 결과 수신
      var start = await instructBackend(_backendText, via, atts);
      if(start && start.status==="running" && start.id){
        clearTimeout(_ackTimer);
        delete _ack._ack;
        _ack.title = "⏳ 수행 중…";
        _ack.text  = "부서들이 답하고 있어요. 곧 결과가 도착해요. (다른 앱을 보거나 화면을 꺼도 서버에서 계속 진행됩니다)";
        _ack._waitJob = start.id; _ack._inst = text; _ack._startedAt = Date.now();
        STATE.pendingJobs=STATE.pendingJobs||[]; if(STATE.pendingJobs.indexOf(start.id)<0) STATE.pendingJobs.push(start.id);
        saveState(); render();
        pollInstruct(start.id);
      } else if(start && start.id){ // 구버전 백엔드(동기 응답) 호환
        _dropAck();
        if(STATE.seenJobIds.indexOf(start.id)<0){ STATE.seenJobIds.push(start.id); pushJobMessages(start); }
        render();
        if(STATE.voiceAuto && start.results && start.results.length){ var lr=start.results[start.results.length-1]; var ls=document.querySelectorAll(".vn-stand"); speak(lr.text, lr.dept, ls[ls.length-1]); }
        await syncBackend();
      }
    } else {
    _dropAck();
    var direct = directDept(text);
    var depts = direct.length ? direct : await route(text);
    STATE.messages.push({ role:"route", depts:depts, direct:direct.length>0, time:nowTime() });
    render();
    var prev = "";
    var exchanges = [];
    for(var i=0;i<depts.length;i++){
      var d = depts[i];
      STATE.busyDept = d; render();
      var result = await work(d, text, prev);
      var msg = { role:"agent", deptId:d, text:result || "(응답을 생성하지 못했습니다)", time:nowTime() };
      STATE.messages.push(msg);
      prev = result;
      exchanges.push({ dept:d, text:result });
      // 부서별 학습 메모리 누적
      if(!STATE.deptMemory[d]) STATE.deptMemory[d] = [];
      STATE.deptMemory[d].push({ time:nowTime(), instruction:text, note:(result && result.length>140 ? result.slice(0,140)+"…" : result) });
      // 발행 부서 + 자동 발행이면 연결 플랫폼에 발행 (근무 시간에만)
      if(d==="publishing" && STATE.autoPublish){
        var ws = workStatus();
        var cps = connectedPlatforms();
        if(ws.state!=="work"){ STATE.messages.push({ role:"publish", warn:true, text:"현재 "+ws.label+" — 자동 발행은 근무 시간에 실행됩니다. (수동 발행은 가능)" }); }
        else if(cps.length) await doPublish(cps.map(p=>p.name), result, true);
        else STATE.messages.push({ role:"publish", warn:true, text:"자동 발행 ON이나 연결된 플랫폼이 없습니다. 설정에서 연결하세요." });
      }
      render();
    }
    // 다중 부서 협업이면 회의록으로 저장
    if(depts.length>1){
      STATE.meetings.push({ time:nowTime(), date:new Date().toLocaleString("ko-KR"), instruction:text, depts:depts.slice(), exchanges:exchanges });
    }
    }
  } catch(err){
    _dropAck();
    STATE.messages.push({ role:"error", text:String(err && err.message || err), time:nowTime() });
  } finally {
    clearTimeout(_ackTimer);
    STATE.busy = false; STATE.busyDept = null; render();
    saveState();
  }
}

async function doPublish(platformNames, content, auto, mediaUrl, inst){
  var pubInst = inst || "";
  var tag = auto ? "자동 발행" : "발행";
  // 발행 전 감사·법무 — 미리보기(로컬)에서만. 백엔드 모드는 서버가 점검.
  if(STATE.safety && STATE.safety.audit && !useBackend()){
    var atext = (typeof content==="string") ? content : ((content&&content.description)||"");
    if(atext){
      try{
        var verdict = await work("ops", "다음 콘텐츠가 저작권·광고법·플랫폼 정책·명예훼손·개인정보 위반 소지가 있는지 점검하라. 첫 줄에 PASS 또는 BLOCK, 둘째 줄에 한 줄 이유. 명백·심각한 위반만 BLOCK:\n\n"+atext.slice(0,1500));
        if(/^\s*BLOCK/i.test(verdict)){
          STATE.messages.push({ role:"publish", warn:true, text:"⛔ 감사·법무 차단 — "+verdict.replace(/^\s*BLOCK\s*/i,"").slice(0,140) });
          logAct("audit", "감사·법무 차단", false, verdict.replace(/^\s*BLOCK\s*/i,"").slice(0,140), inst||"");
          return;
        }
        STATE.messages.push({ role:"publish", text:"✔ 감사·법무 통과 — 발행 진행" });
      }catch(e){ /* 감사 오류 시 통과로 진행 */ }
    }
  }
  if(useBackend()){
    try{
      var text = (typeof content==="string") ? content : ((content&&content.description)||"");
      var title = (text.split("\n")[0]||"").slice(0,80);
      var mu = mediaUrl||"";
      var payload = { platforms:platformNames, content:{ title:title, description:text, caption:text, mediaUrl:mu, mediaType:/\.(mp4|mov)(\?|$)/i.test(mu)?"video":"image", tags:[] } };
      var r = await fetch(backendOrigin()+"/api/publish", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
      var d = await r.json();
      (d.results||[]).forEach(function(res){
        if(res.pending){
          STATE.messages.push({ role:"publish", text:"⏳ "+res.platform+": "+(res.note||"승인 대기") });
          logAct("publish", res.platform+" 발행", "pending", res.note||"승인 대기", pubInst);
        } else {
          STATE.messages.push({ role:"publish", warn:!res.ok, text:res.platform+": "+(res.ok ? ("발행 완료"+(res.url?" · "+res.url:"")) : ("실패 — "+(res.note||""))) });
          logAct("publish", res.platform+" 발행", res.ok, res.ok?(res.url||"발행 완료"):(res.note||"실패"), pubInst);
        }
      });
      if(!d.results){ STATE.messages.push({ role:"publish", warn:true, text:"발행 응답 오류" }); logAct("publish", "발행", false, "응답 오류", pubInst); }
    }catch(e){ STATE.messages.push({ role:"publish", warn:true, text:"발행 요청 실패 — "+(e.message||e) }); logAct("publish", "발행", false, "요청 실패: "+(e.message||e), pubInst); }
  } else {
    STATE.messages.push({ role:"publish", text:tag+" 요청 → "+platformNames.join(", ")+(mediaUrl?(" · 미디어:"+mediaUrl):"")+"  ·  (백엔드 연결 시 실제 업로드)" });
  }
}

function storyboardHtml(text){
  if(!text) return null;
  var t=String(text);
  // 컷 구분: "장면 N", "컷 N", "#N", "S#N", "씬 N", 또는 표의 각 행
  var scenes=[];
  // 1) 표 형식(| 장면 | 카메라 | ...): 행 단위로 파싱
  var tableRows=t.split(/\n/).filter(function(l){ return /^\s*\|.*\|\s*$/.test(l); });
  var hasSceneTable = tableRows.length>=2 && /장면|컷|scene|카메라|자막|나레이션|프롬프트/i.test(tableRows[0]);
  // 2) 블록 형식: "장면/컷 N" 헤더로 분할
  var blocks=t.split(/\n(?=\s*(?:장면|컷|씬|Scene|S#|Cut)\s*[#\d])/i);
  if(blocks.length>=2){
    blocks.forEach(function(b){
      if(!/(?:장면|컷|씬|Scene|Cut)/i.test(b)) return;
      var get=function(re){ var m=b.match(re); return m?m[1].trim():""; };
      var titleM=b.match(/(?:장면|컷|씬|Scene|Cut)\s*#?\s*(\d+)?\s*[:：\-]?\s*([^\n]*)/i);
      scenes.push({
        no: (titleM&&titleM[1])||"",
        title: (titleM&&titleM[2]||"").replace(/\|/g,"").trim(),
        camera: get(/(?:카메라|앵글|샷|촬영)\s*[:：|]\s*([^\n|]+)/i),
        caption: get(/(?:자막|캡션|타이틀)\s*[:：|]\s*([^\n|]+)/i),
        narration: get(/(?:나레이션|내레이션|보이스|대사)\s*[:：|]\s*([^\n|]+)/i),
        prompt: get(/(?:프롬프트|prompt|AI\s*프롬프트)\s*[:：|]\s*([^\n]+)/i),
        desc: get(/(?:장면|묘사|설명|내용)\s*[:：|]\s*([^\n|]+)/i)
      });
    });
  }
  // 표 형식이면 표에서 추출
  if(!scenes.length && hasSceneTable){
    var head=tableRows[0].split("|").map(function(s){return s.trim();});
    var colIdx=function(names){ for(var i=0;i<head.length;i++){ for(var j=0;j<names.length;j++){ if(head[i].indexOf(names[j])>=0) return i; } } return -1; };
    var ci={ scene:colIdx(["장면","컷","씬","scene"]), cam:colIdx(["카메라","앵글","샷"]), cap:colIdx(["자막","캡션"]), nar:colIdx(["나레이션","내레이션"]), pr:colIdx(["프롬프트","prompt"]) };
    tableRows.slice(1).forEach(function(row,idx){
      if(/^[\s|:\-]+$/.test(row)) return; // 구분선 제외
      var c=row.split("|").map(function(s){return s.trim();});
      var pick=function(i){ return i>=0&&c[i]?c[i].replace(/`/g,"").trim():""; };
      scenes.push({ no:String(idx+1), title:pick(ci.scene), camera:pick(ci.cam), caption:pick(ci.cap), narration:pick(ci.nar), prompt:pick(ci.pr), desc:"" });
    });
  }
  if(scenes.length<1) return null; // 스토리보드 아님 → 텍스트로
  // 카드 렌더
  var cards=scenes.map(function(s,i){
    var n=s.no||String(i+1);
    var pr=(s.prompt||s.title||s.desc||"").replace(/"/g,"'");
    var sbid="sb_"+Math.abs(hashStr((pr||"")+n))+"_"+i;
    return '<div class="sb-card">'
      + '<div class="sb-frame" id="'+sbid+'">'+sbSketch(s, n)
      +   (pr?'<button class="sb-gen" data-sbgen="'+escapeHtml(pr)+'" data-sbslot="'+sbid+'" title="이 컷 AI 이미지 만들기">🎨</button>':'')
      + '</div>'
      + '<div class="sb-info">'
      +   '<div class="sb-cut">CUT '+escapeHtml(n)+(s.title?' <span class="sb-title">'+escapeHtml(s.title)+'</span>':'')+'</div>'
      +   (s.camera?'<div class="sb-row"><span class="sb-k">🎥</span>'+escapeHtml(s.camera)+'</div>':'')
      +   (s.caption?'<div class="sb-row sb-cap"><span class="sb-k">💬</span>'+escapeHtml(s.caption)+'</div>':'')
      +   (s.narration?'<div class="sb-row"><span class="sb-k">🎙️</span>'+escapeHtml(s.narration)+'</div>':'')
      +   (s.prompt?'<div class="sb-row sb-prompt"><span class="sb-k">🤖</span>'+escapeHtml(s.prompt)+'</div>':'')
      + '</div></div>';
  }).join("");
  return '<div class="sb-wrap"><div class="sb-hd">🎬 스토리보드 · '+scenes.length+'컷 <span class="sb-hint">🎨 눌러 컷별 AI 이미지 생성</span></div>'+cards+'</div>';
}
function hashStr(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return h; }

    + '</svg>';
}

function logAct(kind, label, ok, note, inst, ref){
  STATE.activityLog = STATE.activityLog || [];
  STATE.activityLog.push({ at:Date.now(), time:nowTime(), kind:kind, label:label, ok:(ok==="pending"?"pending":!!ok), note:(note||""), inst:(inst||""), ref:(ref||"") });
  if(STATE.activityLog.length > 200) STATE.activityLog = STATE.activityLog.slice(-200);
  saveState();
}
var ACT_ICON={ publish:"📤", image:"🎨", video:"🎬", clip:"🎥", audit:"🛡" };
function resBadge(x){
  if(x.ok==="pending") return ' <span class="res-b" style="background:#fff3d6;color:#9a7400">⏳ 승인 대기</span>';
  if(!x.ok) return ' <span class="res-b fail">❌ 실패</span>';
  var url=(String(x.note||"").match(/https?:\/\/[^\s]+/)||[])[0]||"";
  return ' <span class="res-b ok res-go" data-resurl="'+escapeHtml(url)+'" data-reskind="'+escapeHtml(x.kind||"")+'" data-resref="'+escapeHtml(x.ref||"")+'" data-resinst="'+escapeHtml(x.inst||"")+'" title="이 성공 결과로 이동">✅ 성공 →</span>';
}
// 콘텐츠 탭에서 특정 카드로 스크롤 + 하이라이트
function scrollToContent(cid){
  if(!cid) return;
  var tries=0;
  (function go(){
    var card=document.querySelector('.ccard[data-cid="'+cid+'"]');
    if(card){
      try{ card.scrollIntoView({behavior:"smooth", block:"center"}); }catch(e){ try{ card.scrollIntoView(); }catch(_){} }
      card.classList.add("ccard-hl"); setTimeout(function(){ try{ card.classList.remove("ccard-hl"); }catch(_){} }, 2200);
    } else if(tries++<10){ setTimeout(go, 120); }
  })();

/* ===== v254 통합 인증 =====
   비밀번호는 백엔드 환경변수 한 곳에만 둔다. 이 앱은 백엔드에 물어보고 토큰만 보관한다.
   관제탑 iframe 안에서는 URL 해시로 토큰을 받아 다시 묻지 않는다. */
var AUTH = {
  key: "hukkle_auth_token",
  getToken: function(){ try{ return localStorage.getItem(this.key) || ""; }catch(_){ return ""; } },
  setToken: function(v){ try{ v ? localStorage.setItem(this.key, v) : localStorage.removeItem(this.key); }catch(_){ } },

  absorbFromHash: function(){
    try{
      var m = /(?:^|[#&])token=([^&]+)/.exec(location.hash || "");
      if(m && m[1]){
        this.setToken(decodeURIComponent(m[1]));
        history.replaceState(null, "", location.pathname + location.search);
        return true;
      }
    }catch(_){ }
    return false;
  },

  headers: function(){
    var t = this.getToken();
    return t ? { "Authorization": "Bearer " + t } : {};
  },

  login: async function(pw){
    var r = await fetch(backendOrigin() + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    });
    var d = await r.json().catch(function(){ return {}; });
    if(d && d.ok && d.token){ this.setToken(d.token); return { ok:true, warning:d.warning }; }
    return { ok:false, error:(d && d.error) || "로그인 실패" };
  },

  check: async function(){
    try{
      var r = await fetch(backendOrigin() + "/api/auth-check", { headers: this.headers() });
      return await r.json();
    }catch(_){ return { ok:true, required:false, offline:true }; }
  },

  logout: function(){ this.setToken(""); location.reload(); }
};

(function initAuth(){

    if(!(typeof useBackend === "function" && useBackend())) return;

  };
  if(document.readyState === "loading"){

async function apiFetch(path, opts, onWait){
  if(!useBackend()) throw new Error("백엔드 연결이 설정되지 않았어요");
  var url = (String(path).charAt(0)==="/") ? (backendOrigin()+path) : path;
  var lastErr;
  for(var attempt=0; attempt<4; attempt++){
    var freshAwake = STATE._srv && STATE._srv.awake && (Date.now()-(STATE._srv.at||0) < 45000);
    if(!freshAwake){
      if(onWait){ try{ onWait(attempt); }catch(_){ } }
      await wakeServer(70000);
    }
    try{
      var _o = Object.assign({}, opts||{});
      _o.headers = Object.assign({}, _o.headers||{}, AUTH.headers());
      var r = await fetch(url, _o);
      if(r.status === 401){ AUTH.setToken(""); showLoginGate(); }
      STATE._srv = { awake:true, keepAlive:(STATE._srv&&STATE._srv.keepAlive), at:Date.now() };
      return r;
    }catch(e){
      lastErr = e;
      STATE._srv = { awake:false, at:Date.now() };   // 실패 → 다음 시도에서 다시 깨움
      if(onWait){ try{ onWait(attempt+1); }catch(_){ } }
      await new Promise(function(res){ setTimeout(res, 2000*(attempt+1)); });
    }
  }
  throw (lastErr || new Error("서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요."));
}
async function wakeServer(maxWaitMs){
  if(!useBackend()) return false;
  var deadline=Date.now()+(maxWaitMs||50000);
  while(Date.now()<deadline){
    try{
      var ctl = ("AbortController" in window) ? new AbortController() : null;
      if(ctl) setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 8000);
      var r=await fetch(backendOrigin()+"/api/ping", ctl?{signal:ctl.signal}:{});
      if(r && r.ok){ try{ var pj=await r.json(); STATE._srv={ awake:true, keepAlive:!!(pj&&pj.keepAlive), at:Date.now() }; }catch(e){ STATE._srv={ awake:true, keepAlive:STATE._srv&&STATE._srv.keepAlive, at:Date.now() }; } return true; }
    }catch(e){}
    await new Promise(function(res){ setTimeout(res, 3000); });
  }
  return false;
}

  if(!ms) return "";
  var d=Date.now()-ms;
  if(d<60000) return "방금";
  if(d<3600000) return Math.floor(d/60000)+"분 전";
  if(d<86400000) return Math.floor(d/3600000)+"시간 전";
  return Math.floor(d/86400000)+"일 전";
}

function cycleStart(v, btn, stat){
  if(btn){ btn.disabled=true; btn.textContent="⏳ 시작하는 중…"; }
  if(stat) stat.innerHTML='<span style="color:#0e7a52">서버 깨우는 중…</span>';
  apiFetch("/api/cycle/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({},v,{appUrl:location.href.split("#")[0]}))},
    function(){ if(stat) stat.innerHTML='<span style="color:#0e7a52">⏳ 서버 깨우는 중…</span>'; })
    .then(function(r){ return r.json(); }).then(function(d){
      if(!d.ok) throw new Error(d.error||"시작 실패");
      if(btn){ btn.disabled=false; btn.textContent=btn.id==="cyNlNow"?"▶ 지금 실행":"▶ 지금 실행"; }
      if(stat) stat.innerHTML='<span style="color:#0e7a52">✓ 사이클 시작됨 — 진행 상황을 표시합니다.</span>';
      trackJob("cycle", d.jobId, v.topic||""); pollCycle(d.jobId);
    }).catch(function(err){ if(btn){ btn.disabled=false; btn.textContent="▶ 지금 실행"; } if(stat) stat.innerHTML='<span style="color:#c0392b">실패: '+esc(err.message||String(err))+'</span>'; });
}

  apiFetch("/api/cycle/reserve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)})
    .then(function(r){ return r.json(); }).then(function(d){
      if(btn) btn.disabled=false; if(!d.ok) throw new Error(d.error||"등록 실패");

}

// ═══ 🎬 쇼츠 렌더 엔진 — 선언형 스펙을 Canvas로 그린다 ═══
// AI는 스펙만 만들고, 그리는 건 이 고정 엔진이 한다. 같은 스펙이면 항상 같은 영상.

function shEase(t){ return t<0 ? 0 : t>1 ? 1 : (1 - Math.pow(1-t, 3)); }   // easeOutCubic

// 요소 하나의 애니메이션 상태 (0~1 진행도 → 투명도·이동·크기)
function shAnimState(el, tInScene){
  var delay = +el.delay || 0;
  var dur   = +el.dur || 0.6;
  var p     = shEase((tInScene - delay) / Math.max(0.01, dur));
  var a = { alpha:1, dx:0, dy:0, scale:1, clip:1, chars:1 };
  if(tInScene < delay){ a.alpha = 0; a.clip = 0; a.chars = 0; return a; }
  switch(String(el.anim||"")){
    case "fade":       a.alpha = p; break;
    case "fadeUp":     a.alpha = p; a.dy = (1-p) * 60; break;
    case "fadeDown":   a.alpha = p; a.dy = -(1-p) * 60; break;
    case "slideL":     a.alpha = p; a.dx = (1-p) * 160; break;
    case "slideR":     a.alpha = p; a.dx = -(1-p) * 160; break;
    case "zoomIn":     a.alpha = p; a.scale = 0.7 + 0.3*p; break;
    case "zoomOut":    a.alpha = p; a.scale = 1.3 - 0.3*p; break;
    case "pop":        a.alpha = p; a.scale = p < 1 ? (0.6 + 0.5*p + 0.1*Math.sin(p*Math.PI)) : 1; break;
    case "growX":      a.clip = p; break;
    case "typewriter": a.chars = p; break;
    case "countUp":    a.chars = p; break;
    default:           a.alpha = 1;
  }
  return a;
}

// 텍스트 줄바꿈
function shWrap(ctx, text, maxW){
  if(!maxW) return [text];
  var out=[], line="";
  var chars = String(text).split("");
  for(var i=0;i<chars.length;i++){
    var test = line + chars[i];
    if(ctx.measureText(test).width > maxW && line){ out.push(line); line = chars[i]; }
    else line = test;
  }
  if(line) out.push(line);
  return out;
}

function shDrawElement(ctx, el, tInScene, FONT){
  var a = shAnimState(el, tInScene);
  if(a.alpha <= 0.001 && a.clip <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, a.alpha));

  var x = (+el.x||0) + a.dx;
  var y = (+el.y||0) + a.dy;

  if(a.scale !== 1){
    ctx.translate(x, y);
    ctx.scale(a.scale, a.scale);
    ctx.translate(-x, -y);
  }

  var type = String(el.type||"");
  if(type === "text"){
    var size = +el.size || 60;
    var weight = +el.weight || 700;
    ctx.font = weight + " " + size + "px " + (FONT || "sans-serif");
    ctx.fillStyle = el.color || "#111";
    ctx.textAlign = el.align || "center";
    ctx.textBaseline = "middle";
    var txt = String(el.text || "");
    if(el.anim === "typewriter") txt = txt.slice(0, Math.max(1, Math.round(txt.length * a.chars)));
    if(el.anim === "countUp"){
      var num = parseFloat(txt.replace(/[^\d.]/g, ""));
      if(!isNaN(num)) txt = txt.replace(/[\d.]+/, String(Math.round(num * a.chars)));
    }
    var lines = shWrap(ctx, txt, +el.maxWidth || 0);
    var lh = size * 1.25;
    var y0 = y - (lines.length - 1) * lh / 2;
    lines.forEach(function(ln, i){ ctx.fillText(ln, x, y0 + i*lh); });
  }
  else if(type === "rect"){
    var w = (+el.w||0) * (el.anim === "growX" ? a.clip : 1);
    var h = +el.h || 0;
    var r = Math.min(+el.radius||0, w/2, h/2);
    ctx.fillStyle = el.color || "#111";
    ctx.beginPath();
    if(r > 0 && ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }
  else if(type === "circle"){
    ctx.fillStyle = el.color || "#111";
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0,(+el.r||0) * (el.anim==="growX" ? a.clip : 1)), 0, Math.PI*2);
    ctx.fill();
  }
  else if(type === "line"){
    var x2 = +el.x2 || x, y2 = +el.y2 || y;
    if(el.anim === "growX"){ x2 = x + (x2 - x) * a.clip; y2 = y + (y2 - y) * a.clip; }
    ctx.strokeStyle = el.color || "#111";
    ctx.lineWidth = +el.width || 3;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
  }
  else if(type === "bar"){
    var bw = +el.w||0, bh = +el.h||0;
    var pct = Math.max(0, Math.min(100, +el.pct||0)) / 100;
    var rr = Math.min(bh/2, 999);
    ctx.fillStyle = el.bg || "#e6ebf2";
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x, y, bw, bh, rr); else ctx.rect(x, y, bw, bh);
    ctx.fill();
    ctx.fillStyle = el.color || "#22b07a";
    var fw = bw * pct * (el.anim==="growX" ? a.clip : 1);
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x, y, fw, bh, rr); else ctx.rect(x, y, fw, bh);
    ctx.fill();
    if(el.label){
      ctx.font = "700 " + Math.round(bh*0.62) + "px " + (FONT || "sans-serif");
      ctx.fillStyle = el.labelColor || "#2b3543";
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(String(el.label), x + bw + 16, y + bh/2);
    }
  }
  ctx.restore();
}

// 전체 스펙을 시각 t(초)에 그린다
function shRenderAt(ctx, spec, t, FONT){
  var meta = spec.meta || {};
  var W = +meta.w || 1080, H = +meta.h || 1920;
  var scenes = spec.scenes || [];

  // 현재 장면 찾기
  var acc = 0, cur = null, prev = null, tIn = 0;
  for(var i=0;i<scenes.length;i++){
    var d = +scenes[i].dur || 0;
    if(t < acc + d || i === scenes.length-1){ cur = scenes[i]; prev = scenes[i-1] || null; tIn = t - acc; break; }
    acc += d;
  }
  if(!cur) return;
  if(tIn < 0) tIn = 0;

  // 배경
  ctx.fillStyle = cur.bg || meta.bg || "#ffffff";
  ctx.fillRect(0, 0, W, H);

  // 장면 전환 (fade in from previous bg)
  var TR = 0.35;
  if(prev && cur.transition === "fade" && tIn < TR){
    ctx.save();
    ctx.globalAlpha = 1 - (tIn / TR);
    ctx.fillStyle = prev.bg || meta.bg || "#ffffff";
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  (cur.elements||[]).forEach(function(el){ shDrawElement(ctx, el, tIn, FONT); });
}

function shTotalDur(spec){
  return (spec.scenes||[]).reduce(function(a,s){ return a + (+s.dur||0); }, 0);
}


// ═══ 플레이어 + 녹화기 ═══
var _shPlay = { raf:0, t0:0, playing:false, rec:null, chunks:[], recStart:0 };
var SH_FONT = "'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif";

function shStop(){
  if(_shPlay.raf) cancelAnimationFrame(_shPlay.raf);
  _shPlay.raf = 0; _shPlay.playing = false;
}
function shSeek(cv, spec, t){
  var ctx = cv.getContext("2d");
  shRenderAt(ctx, spec, t, SH_FONT);
}
function shPlay(cv, spec, onTick, onEnd){
  shStop();
  var total = shTotalDur(spec);
  var ctx = cv.getContext("2d");
  _shPlay.playing = true;
  _shPlay.t0 = performance.now();
  function loop(now){
    if(!_shPlay.playing) return;
    var t = (now - _shPlay.t0) / 1000;
    if(t >= total){
      shRenderAt(ctx, spec, total - 0.001, SH_FONT);
      _shPlay.playing = false;
      if(onTick) onTick(total, total);
      if(onEnd) onEnd();
      return;
    }
    shRenderAt(ctx, spec, t, SH_FONT);
    if(onTick) onTick(t, total);
    _shPlay.raf = requestAnimationFrame(loop);
  }
  _shPlay.raf = requestAnimationFrame(loop);
}

// 🎥 녹화 — canvas.captureStream + MediaRecorder (브라우저 표준, 서버 안 씀)
function shRecord(cv, spec, title, onTick, onDone, onErr){
  if(!cv.captureStream){ onErr && onErr("이 브라우저는 화면 녹화를 지원하지 않아요 (크롬을 써주세요)"); return; }
  var mimes = ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4"];
  var mime = mimes.filter(function(m){ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } })[0];
  if(!mime){ onErr && onErr("이 브라우저가 녹화 형식을 지원하지 않아요"); return; }

  var fps = (spec.meta && +spec.meta.fps) || 30;
  var stream, rec;
  try{
    stream = cv.captureStream(fps);
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  }catch(e){ onErr && onErr("녹화를 시작하지 못했어요: " + (e.message||e)); return; }

  var chunks = [];
  rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onerror = function(e){ shStop(); onErr && onErr("녹화 중 오류: " + (e.error && e.error.name || "unknown")); };
  rec.onstop = function(){
    var ext = mime.indexOf("mp4") >= 0 ? "mp4" : "webm";
    var blob = new Blob(chunks, { type: mime.split(";")[0] });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = String(title || "shorts").replace(/[^\w가-힣]+/g, "_").slice(0, 40) + "." + ext;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(_){} }, 8000);
    onDone && onDone(Math.round(blob.size/1024), ext);
  };

  rec.start(200);
  shPlay(cv, spec, onTick, function(){
    setTimeout(function(){ try{ rec.stop(); }catch(_){} }, 300);   // 마지막 프레임까지 확보
  });
}

// ═══════════ 👑 v230: 오세라 최종 검수 표시 ═══════════
// 원칙: 모든 완성본은 오세라의 검수를 통과해야 내보낼 수 있다. 평가는 언제나 100점 만점.
// v241: 5축 배점 채점은 폐기됨(오세라는 명세 검증관). 요구 항목은 /api/specs로 관리.
function oseraMinLocal(){ var v=+(STATE.oseraMin||80); return (v>=50&&v<=95)?v:80; }
function oseraOK(o){ return !o || (o.score >= (o.min||oseraMinLocal())); }
function oseraBadge(o){
  if(!o || typeof o.score==="undefined") return "";
  var c = oseraOK(o) ? "#0e7a52" : "#c0392b";
  return ' <b style="color:'+c+'">👑'+o.score+'%</b>';
}
function oseraCard(o){
  if(!o || typeof o.score==="undefined") return "";
  var pass=oseraOK(o), min=(o.min||oseraMinLocal());
  var bg = pass ? "#eafaf3" : "#fdeeee", fg = pass ? "#0e7a52" : "#a03028";
  var checks = (o.checks && o.checks.length) ? o.checks : null;
  var rows = "";
  if(checks){
    rows = checks.map(function(c){
      var mark = c.pass ? '<span style="color:#0e7a52">✅</span>' : '<span style="color:#c0392b">❌</span>';
      var badge = (c.by==="기계") ? '<span style="font-size:9px;background:#e8eef7;color:#4a6da8;border-radius:4px;padding:1px 4px;margin-left:3px">기계</span>' : '';
      return '<div style="display:flex;gap:5px;align-items:flex-start;margin-top:3px;font-size:11px;line-height:1.45">'
        +mark
        +'<span style="flex:1;min-width:0"><b style="font-weight:'+(c.must?700:500)+';color:'+(c.pass?"#3a4452":"#a03028")+'">'+(c.must?'':'')+esc(c.label)+'</b>'+badge
        +(c.why?('<div style="color:#8a94a6;font-size:10px;margin-top:1px">'+esc(c.why)+'</div>'):'')
        +'</span></div>';
    }).join("");
  }
  return '<div style="background:'+bg+';border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:11.5px;line-height:1.55;color:#3a4452">'
    +'<div style="display:flex;align-items:center;gap:6px">'
      +'<b style="font-size:13.5px;color:'+fg+'">👑 오세라 검증 — 요구 이행률 '+o.score+'%</b>'
      +'<span style="margin-left:auto;font-size:11px;font-weight:700;color:'+fg+'">'+(pass?"✅ 통과":"⚠️ 미충족")+' (기준 '+min+'%)</span>'
    +'</div>'
    + (o.totalCount!=null ? ('<div style="font-size:10.5px;color:#5a6472;margin-top:2px">요구 '+o.totalCount+'개 중 <b>'+o.passedCount+'개 충족</b>'
        + (o.mustFailed>0 ? (' · <b style="color:#c0392b">필수 '+o.mustFailed+'개 미충족</b>') : '')
        + ((o.tries>0)?(' · 보완 '+o.tries+'회'):'') + '</div>') : '')
    + (rows ? ('<div style="margin-top:6px;border-top:1px solid rgba(0,0,0,.06);padding-top:5px">'+rows+'</div>') : '')
    + (o.fix?('<div style="margin-top:6px;color:#8a94a6;font-size:10.5px">보완 지시: '+esc(o.fix)+'</div>'):'')
    +'</div>';
}

// 내보내기(복사·저장·발행) 직전 관문 — 미달이면 경고하고 확인을 받는다
function oseraAllowExport(o, what){
  if(oseraOK(o)) return true;
  return confirm("👑 오세라 검증 — 요구 미충족\n\n이행률: "+o.score+"% (기준 "+(o.min||oseraMinLocal())+"%)\n"
    + ((o.totalCount!=null)?("요구 "+o.totalCount+"개 중 "+o.passedCount+"개 충족"+(o.mustFailed>0?(", 필수 "+o.mustFailed+"개 미충족"):"")+"\n"):"")
    + (o.issues&&o.issues.length?("\n미충족:\n· "+o.issues.slice(0,3).join("\n· ")+"\n"):"")
    + "\n결과물은 만들어졌습니다. 요구를 다 못 채웠을 뿐이에요.\n그래도 "+(what||"내보내기")+" 하시겠어요?");
}

// ═══════════ v229: 전역 작업 감시기 ═══════════
// 문제였던 것: 백그라운드 작업 6종(선순환·디자인·상품페이지·영상·재활용·학습)이 각자 폴링을 하는데,
// 폴링은 '버튼을 누른 그 순간'에만 시작됐다. 탭을 옮기거나 앱을 나갔다 오면 화면이 진행 상황을 잊었다.
// → 작업 id를 STATE에 저장하고, 어느 탭에 있든 도는 단일 감시기가 상태를 추적한다.
//   실패하면 '어느 단계에서 · 왜 · 어떻게 고치는지'를 그대로 보여준다.
var JOB_TYPES = {
  cycle:     { label:"🔄 선순환",      status:"/api/cycle/status",        retry:null,                view:"content"  },
  design:    { label:"🎨 디자인",      status:"/api/design/status",       retry:"/api/design/retry", view:"design"   },
  page:      { label:"🛍️ 상품페이지",  status:"/api/product-page/status", retry:null,                view:"content"  },
  video:     { label:"🎬 영상 기획",   status:"/api/video/status",        retry:null,                view:"content"  },
  repurpose: { label:"♻️ 콘텐츠 재활용", status:"/api/repurpose/status",  retry:null,                view:"content"  },
  learn:     { label:"📚 학습",        status:"/api/learn/status",        retry:null,                view:"learn"    },
  shorts:    { label:"🎬 쇼츠",        status:"/api/shorts/status",       retry:"/api/shorts/retry", view:"shorts"   }
};
var _jobWatchTimer=null;

function jobsReg(){ if(!STATE.jobs) STATE.jobs={}; return STATE.jobs; }
function trackJob(type, id, title){
  if(!JOB_TYPES[type] || !id) return;
  var r=jobsReg();
  r[type]={ id:String(id), title:String(title||""), step:"", status:"queued", at:Date.now() };
  saveState(); startJobWatcher(); renderJobBar();
}
function untrackJob(type){ var r=jobsReg(); delete r[type]; saveState(); renderJobBar(); }
function failedJobs(){ if(!STATE.jobFails) STATE.jobFails=[]; return STATE.jobFails; }

function startJobWatcher(){
  if(_jobWatchTimer) return;
  _jobWatchTimer=setInterval(tickJobWatcher, 5000);
  tickJobWatcher();
}
function tickJobWatcher(){
  var r=jobsReg(); var keys=Object.keys(r);
  if(!keys.length){ if(_jobWatchTimer){ clearInterval(_jobWatchTimer); _jobWatchTimer=null; } renderJobBar(); return; }
  if(!useBackend()) return;
  keys.forEach(function(type){
    var j=r[type], spec=JOB_TYPES[type]; if(!j||!spec) return;
    apiFetch(spec.status+"?id="+encodeURIComponent(j.id)).then(function(res){ return res.json(); }).then(function(d){
      if(!d || (!d.ok && !d.status)) return;
      if(d.status==="running"||d.status==="queued"){
        j.step=d.step||""; j.status=d.status;
        j.steps=(d.steps||[]).slice(-40); j.startedAt=d.startedAt||j.at;
        saveState(); renderJobBar();
      } else {
        // 끝났다 — 성공이든 실패든 등록에서 빼고, 실패면 상세를 남긴다
        delete r[type];
        if(d.status==="error"||d.status==="failed"){
          var f={ type:type, label:spec.label, title:j.title, id:j.id,
                  steps:(d.steps||j.steps||[]).slice(-40),
                  startedAt:d.startedAt||j.startedAt||0,
                  step:d.failStep||j.step||"(단계 기록 없음)",
                  error:d.error||"원인 미상", ko:d.errorKo||"", fix:d.errorFix||"", raw:d.errorRaw||"",
                  at:d.failedAt||Date.now() };
          var fl=failedJobs(); fl.unshift(f); if(fl.length>8) fl.length=8;
        }
        saveState(); renderJobBar();
        try{ if(STATE.view==="content"||STATE.view==="design"||STATE.view==="learn") render(); }catch(_){}
      }
    }).catch(function(){});
  });
}

function renderJobBar(){
  var bar=document.getElementById("jobbar"); if(!bar) return;
  var r=jobsReg(), fl=failedJobs();
  var running=Object.keys(r).map(function(t){ return { t:t, j:r[t] }; });
  if(!running.length && !fl.length){ bar.style.display="none"; bar.innerHTML=""; return; }
  bar.style.display="block";
  var h="";
  running.forEach(function(x){
    var spec=JOB_TYPES[x.t]||{label:x.t};
    var n=(x.j.steps||[]).length;
    h+='<div class="jb-row jb-run">'
      +'<span class="jb-spin">⏳</span><b class="jb-go" data-jbview="'+esc(spec.view||"")+'" style="cursor:pointer">'+esc(spec.label)+'</b>'
      +'<span class="jb-step">'+esc(x.j.step||"진행 중")+(function(){
          var ss=(x.j.steps||[]); var L=ss[ss.length-1];
          if(!L || L.done || !L.eta) return '';
          var left=L.eta-(Date.now()-L.at);
          return left>3000 ? ' <span style="font-weight:400;color:#5a8f7a">· 약 '+fmtDur(left)+' 남음</span>' : '';
        })()+'</span>'
      +(n?('<button class="jb-btn" style="background:#0e7a52" data-jbtl="'+esc(x.t)+'">📋 진행 내역 '+n+'</button>'):'')
      +'</div>';
  });
  fl.forEach(function(f,i){
    h+='<div class="jb-row jb-fail">'
      +'<span>⚠️</span><b>'+esc(f.label)+' 실패</b>'
      +'<span class="jb-step">'+esc(f.ko||"오류")+'</span>'
      +'<button class="jb-btn" data-jbdetail="'+i+'">원인 보기</button>'
      +'<button class="jb-x" data-jbdismiss="'+i+'">✕</button></div>';
  });
  bar.innerHTML=h;
  bar.querySelectorAll("[data-jbdetail]").forEach(function(b){ b.addEventListener("click", function(){ showJobFailure(+b.getAttribute("data-jbdetail")); }); });
  bar.querySelectorAll("[data-jbdismiss]").forEach(function(b){ b.addEventListener("click", function(){ var fl2=failedJobs(); fl2.splice(+b.getAttribute("data-jbdismiss"),1); saveState(); renderJobBar(); }); });

// 📋 v243: 작업 진행 내역 — 무슨 일이 언제, 몇 초 걸려 일어났는지 전부 보여준다
function fmtDur(ms){
  if(!ms || ms<0) return "";
  var sec=Math.round(ms/1000);
  if(sec<60) return sec+"초";
  var m=Math.floor(sec/60), s2=sec%60;
  return m+"분"+(s2?(" "+s2+"초"):"");
}
function showTimeline(label, title, steps, startedAt, isFail){
  steps = steps||[];
  var m=document.createElement("div");
  m.style.cssText="position:fixed;inset:0;background:rgba(20,30,45,.55);z-index:10000;display:flex;align-items:flex-end;justify-content:center";
  var total = steps.length ? ((steps[steps.length-1].done || Date.now()) - (startedAt || steps[0].at)) : 0;
  var rows = steps.map(function(x,i){
    var last=(i===steps.length-1);
    var dur = x.done ? (x.done - x.at) : (last && !isFail ? (Date.now()-x.at) : 0);
    var running = last && !x.done && !isFail;
    var failed = !!x.failed;
    var dot = failed ? '<span style="color:#c0392b">✕</span>'
            : running ? '<span class="jb-spin" style="color:#0e7a52">⏳</span>'
            : '<span style="color:#0e7a52">✓</span>';
    var etaTxt = "";
    if(x.eta){
      if(running){
        var left = x.eta - dur;
        etaTxt = (left > 3000)
          ? (' · <b style="color:#0e7a52">약 '+fmtDur(left)+' 남음</b> <span style="color:#c0c6d0">(평소 '+fmtDur(x.eta)+')</span>')
          : ' · <b style="color:#b57b1a">평소보다 오래 걸리는 중</b> <span style="color:#c0c6d0">(평소 '+fmtDur(x.eta)+')</span>';
      } else if(x.done){
        var diff = dur - x.eta;
        var slow = (diff > x.eta*0.5) && (diff > 20000);
        etaTxt = ' <span style="color:'+(slow?"#b57b1a":"#c0c6d0")+'">(평소 '+fmtDur(x.eta)+(slow?' · 이번엔 느림':'')+')</span>';
      }
    } else if(running){
      etaTxt = ' · <span style="color:#c0c6d0">예상 시간 학습 중 (2회 이상 돌면 표시)</span>';
    }
    var bar = "";
    if(running && x.eta){
      var pct = Math.min(99, Math.round(dur / x.eta * 100));
      bar = '<div style="height:4px;background:#e6ebf2;border-radius:2px;overflow:hidden;margin-top:4px">'
          + '<div style="height:4px;width:'+pct+'%;background:'+(pct>=99?"#e0a92b":"#22b07a")+'"></div></div>';
    }
    return '<div style="display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f2f5f9">'
      +'<span style="width:16px;text-align:center;font-size:12px">'+dot+'</span>'
      +'<span style="flex:1;min-width:0">'
        +'<div style="font-size:12px;line-height:1.5;color:'+(failed?"#a03028":(running?"#0e7a52":"#2b3543"))+';font-weight:'+(running||failed?700:500)+'">'+esc(x.text)+'</div>'
        +'<div style="font-size:10px;color:#9aa4b2;margin-top:1px">'
          + new Date(x.at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})
          + (dur? (' · '+fmtDur(dur)) : '')
          + etaTxt
          + (failed? ' · <b style="color:#c0392b">여기서 중단됨</b>' : '')
        +'</div>'
        + bar
      +'</span></div>';
  }).join("");
  m.innerHTML='<div style="background:var(--card);width:100%;max-width:640px;max-height:86vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column">'
    +'<div style="display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #eef1f6">'
      +'<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px;color:var(--ink)">📋 진행 내역 — '+esc(label)+'</div>'
      +(title?('<div style="font-size:11px;color:#8a94a6;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(title)+'</div>'):'')
      +'</div>'
      +'<button id="tlClose" style="border:none;background:var(--bg);border-radius:9px;width:32px;height:32px;font-size:16px;cursor:pointer">✕</button></div>'
    +'<div style="padding:6px 16px;background:var(--card2);font-size:11px;color:#5a6472;border-bottom:1px solid #eef1f6">'
      +'단계 <b>'+steps.length+'개</b>'+(total?(' · 경과 <b>'+fmtDur(total)+'</b>'):'')
      +(function(){
         var lastS = steps[steps.length-1];
         if(isFail || !lastS || lastS.done || !lastS.eta) return '';
         var left = lastS.eta - (Date.now()-lastS.at);
         return left>3000 ? ' · 이 단계 <b style="color:#0e7a52">약 '+fmtDur(left)+' 남음</b>' : '';
       })()
      +(isFail?' · <b style="color:#c0392b">실패로 종료</b>':'')+'</div>'
    +'<div style="padding:8px 16px 16px;overflow:auto;flex:1">'+(rows||'<div class="note" style="color:#9aa4b2">아직 기록된 단계가 없어요.</div>')+'</div>'
    +'<div style="border-top:1px solid #eef1f6;padding:12px 16px;background:#fafbfd">'
      +'<button id="tlCopy" class="cbtn" style="width:100%;justify-content:center;padding:11px">📋 진행 내역 복사</button></div>'
    +'</div>';
  document.body.appendChild(m);
  m.querySelector("#tlClose").addEventListener("click", function(){ try{ m.remove(); }catch(_){} });
  m.querySelector("#tlCopy").addEventListener("click", function(){
    var txt="["+label+"] "+(title||"")+"\n"
      + steps.map(function(x,i){
          var d = x.done ? fmtDur(x.done-x.at) : "";
          return (i+1)+". "+new Date(x.at).toLocaleTimeString("ko-KR")+"  "+x.text+(d?("  ("+d+")"):"")+(x.failed?"  ← 여기서 중단":"");
        }).join("\n");
    copyText(txt, m.querySelector("#tlCopy"));
  });
}

function pollCycle(id){
  if(_cyPollTimer){ clearInterval(_cyPollTimer); _cyPollTimer=null; }
  _cyPollTimer=setInterval(function(){
    if(!document.getElementById("cyList")){ clearInterval(_cyPollTimer); _cyPollTimer=null; return; }   // 뷰 벗어남 → 정리
    var stat=document.getElementById("cyStat"), runBtn=document.getElementById("cyRun");
    apiFetch("/api/cycle/status?id="+encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(d){
      if(!d.ok) return;
      if(d.status==="running"||d.status==="queued"){
        if(stat) stat.innerHTML='<span style="color:#0e7a52">⏳ '+esc(d.step||"진행 중")+'… <span style="color:#8a94a6">(앱을 나가도 계속 진행돼요)</span></span>';
        if(runBtn){ runBtn.disabled=true; runBtn.textContent="⏳ "+(d.step||"진행 중"); }
      } else {
        clearInterval(_cyPollTimer); _cyPollTimer=null;
        if(runBtn){ runBtn.disabled=false; runBtn.textContent="▶ 지금 실행"; }
        if(d.status==="done"){ if(stat) stat.innerHTML='<span style="color:#0e7a52">✅ 완료! 아래 결과에서 확인하세요.'+(d.warn?(' ('+esc(d.warn)+')'):'')+'</span>'; }
        else if(stat) stat.innerHTML='<span style="color:#c0392b">실패: '+esc(d.error||"오류")+'</span>';
        loadCycleList();
      }
    }).catch(function(){});
  }, 3500);
}
