function shForm(){
  var f=STATE.shorts||{};
  return { topic:(document.getElementById("shTopic")||{}).value||"",
           ratio:f.ratio||"9:16", seconds:+f.seconds||20,
           memo:(document.getElementById("shMemo")||{}).value||"" };
}

function bindShorts(){
  document.querySelectorAll('[data-shr]').forEach(function(c){ c.addEventListener("click", function(){
    STATE.shorts.ratio=c.getAttribute("data-shr"); saveState();
    document.querySelectorAll('[data-shr]').forEach(function(x){ x.classList.toggle("on", x===c); });
  }); });
  document.querySelectorAll('[data-shs]').forEach(function(c){ c.addEventListener("click", function(){
    STATE.shorts.seconds=+c.getAttribute("data-shs"); saveState();
    document.querySelectorAll('[data-shs]').forEach(function(x){ x.classList.toggle("on", x===c); });
  }); });
  var t=document.getElementById("shTopic"), m=document.getElementById("shMemo");
  if(t) t.addEventListener("input", function(){ STATE.shorts.topic=t.value; saveState(); });
  if(m) m.addEventListener("input", function(){ STATE.shorts.memo=m.value; saveState(); });

  var run=document.getElementById("shRun"), stat=document.getElementById("shStat");
  if(run) run.addEventListener("click", async function(){
    var v=shForm();
    if(!v.topic.trim()){ if(stat) stat.innerHTML='<span style="color:#c0392b">무엇에 대한 영상인지 입력하세요.</span>'; return; }
    if(!useBackend()){ if(stat) stat.innerHTML='<span style="color:#c0392b">AI 백엔드 연결이 필요해요.</span>'; return; }
    run.disabled=true; run.textContent="⏳ 시작하는 중…";
    if(stat) stat.innerHTML='<span style="color:#0e7a52">서버 깨우는 중…</span>';
    try{ await wakeServer(50000);
      var r=await fetch(backendOrigin()+"/api/shorts/start",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(Object.assign({}, v, { appUrl: location.href.split("#")[0] }))});
      var d=await r.json(); if(d.error) throw new Error(d.error);
      trackJob("shorts", d.jobId, v.topic);
      pollShorts(d.jobId);
      loadShortsList();
      if(stat) stat.innerHTML='<span style="color:#0e7a52">✓ 시작됨 — 앱을 나가도 계속 진행돼요.</span>';
    }catch(e){
      run.disabled=false; run.textContent="🎬 만들기";
      if(stat) stat.innerHTML='<span style="color:#c0392b">실패: '+esc(e.message||String(e))+'</span>';
    }
  });
}

function pollShorts(id){
  if(_shPollTimer){ clearInterval(_shPollTimer); _shPollTimer=null; }
  _shPollTimer=setInterval(function(){
    if(!document.getElementById("shList")){ clearInterval(_shPollTimer); _shPollTimer=null; return; }
    var stat=document.getElementById("shStat"), run=document.getElementById("shRun");
    apiFetch("/api/shorts/status?id="+encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(d){
      if(!d.ok) return;
      if(d.status==="running"||d.status==="queued"){
        if(stat) stat.innerHTML='<span style="color:#0e7a52">⏳ '+esc(d.step||"진행 중")+'… <span style="color:#8a94a6">(앱을 나가도 계속 진행돼요)</span></span>';
        if(run){ run.disabled=true; run.textContent="⏳ "+(d.step||"진행 중").slice(0,24); }
      } else {
        clearInterval(_shPollTimer); _shPollTimer=null;
        if(run){ run.disabled=false; run.textContent="🎬 만들기"; }
        if(stat) stat.innerHTML = (d.status==="done")
          ? '<span style="color:#0e7a52">✅ 완성 — 아래에서 ▶ 재생하고 ⏺ 녹화하세요.</span>'
          : '<span style="color:#c0392b">실패: '+esc(d.errorKo||d.error||"")+'</span>';
        loadShortsList();
      }
    }).catch(function(){});
  }, 3500);
}

function loadShortsList(){
  var box=document.getElementById("shList"); if(!box) return;
  if(!useBackend()){ box.innerHTML='<div class="note" style="color:#9aa4b2">AI 백엔드 연결 후 사용 가능</div>'; return; }
  apiFetch("/api/shorts/list").then(function(r){ return r.json(); }).then(function(d){
    var jobs=(d&&d.jobs)||[];
    if(!jobs.length){ box.innerHTML='<div class="note" style="color:#9aa4b2">아직 만든 쇼츠가 없어요.</div>'; return; }
    box.innerHTML=jobs.map(function(j){
      var st = j.status==="done" ? '<span style="color:#0e7a52;font-weight:700">완료</span>'
             : (j.status==="error"||j.status==="failed") ? '<span style="color:#c0392b;font-weight:700">실패</span>'
             : '<span style="color:#b57b1a;font-weight:700">⏳ '+esc(j.step||"진행 중")+'</span>';
      var meta = j.check ? (j.check.scenes+"장면 · "+j.check.total+"초") : (j.seconds+"초");
      return '<div style="background:var(--card);border:1px solid #e2e8f2;border-radius:11px;padding:11px 12px;margin-bottom:8px">'
        +'<div style="min-width:0"><div style="font-weight:700;font-size:13px;color:#2b3543">'+esc(j.topic)+'</div>'
        +'<div style="font-size:11px;color:#8a94a6;margin-top:2px">'+esc(j.ratio)+' · '+esc(meta)+(j.osera&&j.osera.score!=null?(' · 👑 '+j.osera.score+'%'):'')+'</div></div>'
        +'<div style="margin-top:6px;font-size:11.5px;line-height:1.5">'+st+'</div>'
        +(j.error?('<div style="font-size:11.5px;color:#c0392b;margin-top:6px;background:#fdeeee;border-radius:7px;padding:6px 8px;line-height:1.5">'+esc(j.errorKo?(j.errorKo+" — "+j.error):j.error)+(j.errorFix?('<br><b>해결:</b> '+esc(j.errorFix)):'')+'</div>'):'')
        +'<div style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap">'
          +(j.hasSpec?('<button class="shOpen" data-id="'+j.id+'" style="border:none;background:#e8f7f1;color:#0e7a52;border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit">▶ 재생 · 녹화</button>'):'')
          +((j.status==="error"||j.status==="failed")?('<button class="shRetry" data-id="'+j.id+'" style="border:none;background:#eef4ff;color:#2f6fe0;border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit">🔄 다시 시도</button>'):'')
          +'<button class="shTl" data-id="'+j.id+'" style="border:none;background:#eef4ff;color:#2f6fe0;border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit">📋 진행 내역</button>'
          +'<button class="shDel" data-id="'+j.id+'" style="border:none;background:#fdecec;color:#c0392b;border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit">🗑 삭제</button>'
        +'</div></div>';
    }).join("");

    var active=jobs.filter(function(j){ return j.status==="running"||j.status==="queued"; });
    if(active.length){
      if(!_shPollTimer) pollShorts(active[0].id);
      if(!_shListTimer) _shListTimer=setInterval(function(){
        if(!document.getElementById("shList")){ clearInterval(_shListTimer); _shListTimer=null; return; }
        loadShortsList();
      }, 7000);
    } else if(_shListTimer){ clearInterval(_shListTimer); _shListTimer=null; }

    box.querySelectorAll(".shOpen").forEach(function(b){ b.addEventListener("click", function(){ openShortsPlayer(b.getAttribute("data-id")); }); });
    box.querySelectorAll(".shDel").forEach(function(b){ b.addEventListener("click", function(){
      if(!confirm("이 쇼츠를 지울까요?")) return;
      try{ var r2=jobsReg(); if(r2.shorts && r2.shorts.id===b.getAttribute("data-id")) untrackJob("shorts"); }catch(_){}
      apiFetch("/api/shorts/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.getAttribute("data-id")})})
        .then(function(){ loadShortsList(); }).catch(function(){ alert("삭제 실패"); });
    }); });
    box.querySelectorAll(".shRetry").forEach(function(b){ b.addEventListener("click", function(){
      b.disabled=true; b.textContent="⏳ 다시 시작하는 중…";
      apiFetch("/api/shorts/retry",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.getAttribute("data-id"), appUrl:location.href.split("#")[0]})})
        .then(function(r){ return r.json(); }).then(function(x){
          if(!x.ok) throw new Error(x.error||"재시작 실패");
          trackJob("shorts", x.jobId, ""); pollShorts(x.jobId); loadShortsList();
        }).catch(function(e){ b.disabled=false; b.textContent="🔄 다시 시도"; alert("다시 시도 실패: "+(e.message||e)); });
    }); });
    box.querySelectorAll(".shTl").forEach(function(b){ b.addEventListener("click", function(){
      var id=b.getAttribute("data-id");
      apiFetch("/api/shorts/status?id="+encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(d2){
        if(!d2.ok){ alert("진행 내역을 불러오지 못했어요."); return; }
        showTimeline("쇼츠", d2.topic||"", d2.steps||[], d2.startedAt||0, (d2.status==="error"||d2.status==="failed"));
      }).catch(function(){ alert("진행 내역을 불러오지 못했어요."); });
    }); });
  }).catch(function(){ box.innerHTML='<div class="note" style="color:#c0392b">목록을 불러오지 못했어요.</div>'; });
}

function openShortsPlayer(id){
  apiFetch("/api/shorts/get?id="+encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(d){
    if(!d.ok){ alert(d.error||"불러오지 못했어요."); return; }
    var spec=d.spec, W=(spec.meta&&spec.meta.w)||1080, H=(spec.meta&&spec.meta.h)||1920;
    var total=shTotalDur(spec);
    _shCur=d;

    var m=document.createElement("div");
    m.style.cssText="position:fixed;inset:0;z-index:100000;background:#0f1218;display:flex;flex-direction:column";
    m.innerHTML='<div style="flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 11px;background:#1b2330;color:#fff">'
        +'<b style="font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🎬 '+esc(d.topic)+'</b>'
        +'<span style="font-size:11px;color:#8a94a6">'+esc(d.ratio)+' · '+total.toFixed(1)+'초</span>'
        +'<button id="shClose" style="border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:800;background:#3a4557;color:#fff;cursor:pointer;font-family:inherit">✕</button>'
      +'</div>'
      +'<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden">'
        +'<canvas id="shCv" width="'+W+'" height="'+H+'" style="max-width:100%;max-height:100%;background:var(--card);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.4)"></canvas>'
      +'</div>'
      +'<div style="flex-shrink:0;padding:10px 12px 14px;background:#1b2330">'
        +'<div style="height:5px;background:#33405a;border-radius:3px;overflow:hidden;margin-bottom:9px"><div id="shBar" style="height:5px;width:0;background:#22b07a"></div></div>'
        +'<div id="shMsg" style="font-size:11px;color:#8fa0b8;min-height:14px;margin-bottom:8px;text-align:center"></div>'
        +'<div style="display:flex;gap:8px">'
          +'<button id="shPlayBtn" class="cbtn" style="flex:1;justify-content:center;padding:12px;background:#2b3a52;color:#fff;border:none">▶ 재생</button>'
          +'<button id="shRecBtn" class="cbtn conn" style="flex:2;justify-content:center;padding:12px">⏺ 녹화 · 영상 저장</button>'
        +'</div>'
        +'<div style="font-size:10.5px;color:#6d7f98;margin-top:7px;line-height:1.5;text-align:center">녹화는 <b>실시간</b>이라 '+Math.ceil(total)+'초 걸려요. 그동안 화면을 끄지 마세요.<br>WebM으로 저장됩니다 — 유튜브·쇼츠는 그대로 업로드돼요.</div>'
      +'</div>';
    document.body.appendChild(m);

    var cv=m.querySelector("#shCv"), bar=m.querySelector("#shBar"), msg=m.querySelector("#shMsg");
    var pb=m.querySelector("#shPlayBtn"), rb=m.querySelector("#shRecBtn");
    shSeek(cv, spec, 0);

    function tick(t, tot){
      if(bar) bar.style.width = Math.min(100, t/tot*100) + "%";
    }
    function close(){ shStop(); try{ m.remove(); }catch(_){} }
    m.querySelector("#shClose").addEventListener("click", close);

    pb.addEventListener("click", function(){
      if(_shPlay.playing){ shStop(); pb.textContent="▶ 재생"; return; }
      pb.textContent="⏸ 정지";
      shPlay(cv, spec, tick, function(){ pb.textContent="▶ 재생"; });
    });

    rb.addEventListener("click", function(){
      if(_shPlay.playing) shStop();
      rb.disabled=true; pb.disabled=true;
      rb.textContent="⏺ 녹화 중…";
      if(msg) msg.innerHTML='<span style="color:#e0a92b">⏺ 녹화 중 — 화면을 끄지 마세요</span>';
      shRecord(cv, spec, d.topic,
        function(t,tot){ tick(t,tot); rb.textContent="⏺ 녹화 중… "+Math.ceil(tot-t)+"초"; },
        function(kb, ext){
          rb.disabled=false; pb.disabled=false; rb.textContent="⏺ 녹화 · 영상 저장";
          if(msg) msg.innerHTML='<span style="color:#22b07a">✅ 저장 완료 — '+kb.toLocaleString()+'KB ('+ext.toUpperCase()+')</span>';
        },
        function(err){
          rb.disabled=false; pb.disabled=false; rb.textContent="⏺ 녹화 · 영상 저장";
          if(msg) msg.innerHTML='<span style="color:#e0645a">'+esc(err)+'</span>';
        });
    });
  }).catch(function(e){ alert("불러오지 못했어요: "+(e.message||e)); });
}

      files.forEach(function(f){
        if(f.size > 4*1024*1024){ alert("'"+f.name+"' 가 너무 커요 (4MB 이하)"); return; }
        var rd=new FileReader();
        rd.onload=function(){
          // 긴 변 1400px로 줄여 전송량·토큰을 아낀다

/* 완성된 HTML 한 장은 통째로는 못 다룬다. 사람이 알아볼 덩어리로 자른다.
   <style> 는 따로 떼고, 본문은 <section>·<header> 같은 큰 칸 단위로 나눈다. */
function dsCut(html){
  var src=String(html||""), parts=[];
  src.replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, function(all, css){
    parts.push({ name:"CSS", body:css.trim() }); return all;
  });
  var body=src.replace(/<style[^>]*>[\s\S]*?<\/style>/gi,"");
  var re=/<(section|header|footer|nav|main|article)\b[^>]*>[\s\S]*?<\/\1>/gi, m, hit=[];
  while((m=re.exec(body))!==null){
    var cls=(m[0].match(/class="([^"]{0,40})"/)||[])[1]||"";
    hit.push({ name:"<"+m[1]+">"+(cls?" ."+cls.split(" ")[0]:""), body:m[0] });
  }
  if(hit.length) parts=parts.concat(hit);
  else if(body.trim()) parts.push({ name:"HTML", body:body.trim() });
  if(!parts.length) parts=[{ name:"전체", body:src }];
  return parts;
}

            }).catch(function(){});
          }, 3000);
        }).catch(function(err){ m.querySelector("#dsFbOnce").disabled=false; m.querySelector("#dsFbKeep").disabled=false; if(fs) fs.innerHTML='<span style="color:#c0392b">'+esc(err.message||String(err))+'</span>'; });
    }
    m.querySelector("#dsFbOnce").addEventListener("click", function(){ sendFb(false); });
    m.querySelector("#dsFbKeep").addEventListener("click", function(){ sendFb(true); });
  }).catch(function(){});
}

var LEARN_OPEN = {};
function groupLearn(){
  var root = document.querySelector("#view > div");
  if (!root || root.dataset.grouped) return;
  var kids = Array.prototype.slice.call(root.children);
  var title = kids.shift();                       // 맨 위 제목은 그대로 둔다
  var active = kids.shift();                      // 진행 중 표시도 그대로
  var buckets = {}, rest = [];
  LEARN_GROUPS.forEach(function(g){ buckets[g.key] = []; });

  kids.forEach(function(el){
    var t = (el.textContent||"").slice(0, 120);
    var hit = null;
    for (var i=0;i<LEARN_GROUPS.length;i++){
      var g = LEARN_GROUPS[i];
      for (var k=0;k<g.has.length;k++){ if (t.indexOf(g.has[k]) >= 0){ hit = g.key; break; } }
      if (hit) break;
    }
    if (hit) buckets[hit].push(el); else rest.push(el);
  });

  root.innerHTML = "";
  if (title)  root.appendChild(title);
  if (active) root.appendChild(active);

  LEARN_GROUPS.forEach(function(g){
    var items = buckets[g.key];
    if (!items.length) return;
    var open = (LEARN_OPEN[g.key] != null) ? LEARN_OPEN[g.key] : !!g.open;
    var wrap = document.createElement("div");
    wrap.style.cssText = "margin-bottom:10px";
    var head = document.createElement("div");
    head.style.cssText = "display:flex;align-items:center;gap:7px;cursor:pointer;"
      + "padding:11px 13px;border-radius:10px;background:var(--card2);"
      + "border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--ink)";
    head.innerHTML = '<span>'+g.name+'</span>'
      + (g.who ? '<span style="font-weight:600;font-size:10.5px;color:#8a94a6">'+g.who+'</span>' : "")
      + '<span style="margin-left:auto;font-weight:600;font-size:10.5px;color:#8a94a6">'
      + items.length + '</span>'
      + '<span style="opacity:.5">'+(open?"▴":"▾")+'</span>';
    var body = document.createElement("div");
    body.style.cssText = "padding-top:9px";
    body.hidden = !open;
    items.forEach(function(el){ body.appendChild(el); });
    head.addEventListener("click", function(){
      body.hidden = !body.hidden;
      LEARN_OPEN[g.key] = !body.hidden;
      head.lastChild.textContent = body.hidden ? "▾" : "▴";
    });
    wrap.appendChild(head); wrap.appendChild(body);
    root.appendChild(wrap);
  });
  rest.forEach(function(el){ root.appendChild(el); });   // 못 알아본 것은 아래에 그대로
  root.dataset.grouped = "1";
}

function pollVideo(jobId, btn, oldTxt, out){
  var tries=0;

    if(STATE.view!=="learn"){ clearInterval(t); return; }
    try{
      var r=await fetch(backendOrigin()+"/api/video/status?id="+encodeURIComponent(jobId));

      if(d.status==="running" && d.step){ out.innerHTML='<span style="color:#1668c7">⏳ '+esc(d.step)+'… <span style="color:#8a94a6">(앱 닫아도 진행)</span></span>'; if(btn){ var _s=String(d.step); btn.textContent="⏳ "+(_s.length>18?_s.slice(0,18)+"…":_s+"…"); } }

function pollLearnTab(jobId, btn, oldTxt, onDone){
  var tries=0, lastStep="";
  var t=setInterval(async function(){
    tries++; if(tries>150){ clearInterval(t); return; }        // 12분까지 화면 갱신
    if(STATE.view!=="learn"){ clearInterval(t); return; }      // 탭 벗어나도 서버는 계속 진행
    try{
      var r=await fetch(backendOrigin()+"/api/learn/status?id="+encodeURIComponent(jobId));
      var d=await r.json(); if(!d || d.error) return;
      var st=document.getElementById("lnStat");
      if(d.status==="running" && d.step && d.step!==lastStep){
        lastStep=d.step;
        if(st) st.innerHTML='<span style="color:#1668c7">⏳ '+esc(d.step)+'…  <span style="color:#8a94a6">(앱을 닫아도 계속 진행돼요)</span></span>';
        if(btn){ var _s=String(d.step); btn.textContent="⏳ "+(_s.length>20?_s.slice(0,20)+"…":_s+"…"); }
      }
      if(d.status==="done"){
        clearInterval(t);
        var who = (d.autoDepts && d.autoDepts.length) ? (" — 배운 부서: "+d.autoDepts.join(", ")) : (d.analyzed?(" — "+d.analyzed+"개 분석"):"");
        if(st) st.innerHTML='<span style="color:#0e7a52">✔ 학습 완료'+esc(who)+'! 품질 공식이 갱신됐어요.</span>';
        var res=document.getElementById("lnResult");
        if(res){
          if(d.kind==="deep" && d.result){
            res.innerHTML=deepResultHtml(d.result);
            var ex=String(d.result.example||"");
            var fr=document.getElementById("lnExFrame"); if(fr){ try{ fr.srcdoc=prepPreviewHtml(ex); }catch(_){} }
            var op=document.getElementById("lnExOpen");
            if(op) op.addEventListener("click", function(){ openHtml(ex, "학습 예시"); });
          } else {
            res.innerHTML='<div style="background:#f7fbff;border:1px solid #d9e8fb;border-radius:10px;padding:11px 13px"><div style="font-size:11.5px;font-weight:800;color:#1668c7;margin-bottom:5px">🧠 새로 배운 품질 공식</div><div style="font-size:12px;color:#1c2838;line-height:1.65;white-space:pre-wrap;max-height:320px;overflow:auto">'+esc(d.knowledge||"")+'</div></div>';
          }
        }
        if(btn){ btn.disabled=false; btn.textContent=oldTxt; }
        if(onDone) try{ onDone(); }catch(_){}
        setTimeout(function(){ try{ loadProposals(); }catch(_){} }, 1500);   // 팀장이 변경 승인을 요청했을 수 있음
      } else if(d.status==="error"){
        clearInterval(t);
        if(st) st.innerHTML='<span style="color:#c0392b">학습 실패: '+esc(d.error||"원인 미상")+'</span>';
        if(btn){ btn.disabled=false; btn.textContent=oldTxt; }
      }
    }catch(_){}
  }, 5000);
}

// 작업 상태 주기 확인(모달 열려 있는 동안만 — 닫아도 서버는 계속 진행)
function pollPageJob(jobId, ov, name){
  var tries=0;
  var t=setInterval(async function(){
    tries++;
    if(tries>60){ clearInterval(t); return; }
    if(ov && !document.body.contains(ov)){ clearInterval(t); return; }
    try{
      var r=await fetch(backendOrigin()+"/api/product-page/status?id="+encodeURIComponent(jobId));
      var d=await r.json(); if(!d || d.error) return;
      var st=ov?ov.querySelector("#pdStat"):null, btn=ov?ov.querySelector("#pdRun"):null;
      if(d.status==="running" && d.step){ if(st) st.innerHTML='<span style="color:#1668c7">⏳ '+esc(d.step)+'… <span style="color:#8a94a6">(앱 닫아도 진행)</span></span>'; if(btn){ var _s=String(d.step); btn.textContent="⏳ "+(_s.length>18?_s.slice(0,18)+"…":_s+"…"); } }
      if(d.status==="done"){
        clearInterval(t);
        savePageJobToContent(jobId, d.html||"", d.product||name, !!d.appliedFormula);
        if(ov && ov.querySelector("#pdResult")){ ov.querySelector("#pdResult").innerHTML=productResultHtml(d); bindProductResult(ov, d.html||"", d.product||name); }
        if(st) st.innerHTML='<span style="color:#0e7a52">✔ 완성'+(d.appliedFormula?" (학습된 품질 공식 적용됨)":"")+' — 콘텐츠 탭에도 저장됐어요.</span>';
        if(btn){ btn.disabled=false; btn.textContent="🛍️ 상품페이지 만들기"; }
      } else if(d.status==="error"){
        clearInterval(t);
        if(st) st.innerHTML='<span style="color:#c0392b">실패: '+esc(d.error||"원인 미상")+'</span>';
        if(btn){ btn.disabled=false; btn.textContent="🛍️ 상품페이지 만들기"; }
      }
    }catch(_){}
  }, 5000);
}
// 완성 결과를 콘텐츠 탭(STATE.messages)에 저장 — 중복 방지
function savePageJobToContent(jobId, html, name, applied){
  try{
    STATE.messages = STATE.messages || [];
    var exists = STATE.messages.some(function(m){ return m._pageJobId && String(m._pageJobId)===String(jobId); });
    if(exists) return false;
    STATE.messages.push({
      role:"agent", deptId:"monetization", _forceContent:true,
      _pageJobId:String(jobId), _productHtml:html||"", _productName:name||"상품페이지",
      text:"🛍️ 상품페이지: "+(name||"")+(applied?" (학습 공식 적용)":""),
      at:Date.now(), time:(new Date()).toLocaleString("ko-KR")
    });
    saveState();
    return true;
  }catch(_){ return false; }
}
// 앱 열 때/주기적으로: 백그라운드에서 완성된 결과를 받아와 콘텐츠 탭에 채움
async function syncPageJobs(){
  if(!useBackend()) return 0;
  try{
    var r=await fetch(backendOrigin()+"/api/product-page/list");
    var d=await r.json(); if(!d || !d.jobs) return 0;
    var added=0;
    for(var i=0;i<d.jobs.length;i++){
      var j=d.jobs[i];
      if(j.status!=="done" || !j.hasHtml) continue;
      var have=(STATE.messages||[]).some(function(m){ return m._pageJobId && String(m._pageJobId)===String(j.id); });
      if(have) continue;
      try{
        var r2=await fetch(backendOrigin()+"/api/product-page/status?id="+encodeURIComponent(j.id));
        var d2=await r2.json();
        if(d2 && d2.status==="done" && d2.html){ if(savePageJobToContent(j.id, d2.html, d2.product, d2.appliedFormula)) added++; }
      }catch(_){}
    }
    if(added){ try{ render(); }catch(_){} }
    return added;
  }catch(_){ return 0; }
}

/* v264: 날짜별 접기·삭제.
   기존 메시지에는 날짜가 없고 "오전 3:45" 같은 시각만 있었다.
   한 번만 마이그레이션해서 이전 것은 '이전 대화'로 묶고, 이후 것부터 날짜를 기록한다. */
var CONSOLE_RECENT = 12;

function stampMessages(){
  /* v271: 여기서 saveState() 를 부르면 매 렌더마다 상태 전체가 직렬화된다.
     타이핑 중 렌더가 잦아 버벅임의 원인이 됐다.
     날짜 도장은 메모리에만 찍고, 저장은 원래 저장 시점에 함께 나간다. */
  if(!STATE._tsMigrated){
    STATE.messages.forEach(function(m){ if(m.ts===undefined) m.ts=null; });
    STATE._tsMigrated = true;
  } else {
    STATE.messages.forEach(function(m){ if(m.ts===undefined) m.ts=Date.now(); });
  }
}

function dayKey(ts){
  if(!ts) return "old";
  var d=new Date(ts);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function dayLabel(key){
  if(key==="old") return "이전 대화";
  var t=new Date(), y=new Date(Date.now()-86400000);
  if(key===dayKey(t.getTime())) return "오늘";
  if(key===dayKey(y.getTime())) return "어제";
  var p=key.split("-");
  return p[0].slice(2)+"."+p[1]+"."+p[2];
}

function groupByDay(list){
  var order=[], map={};
  list.forEach(function(m){
    var k=dayKey(m.ts);
    if(!map[k]){ map[k]=[]; order.push(k); }
    map[k].push(m);
  });
  // '이전 대화'는 항상 맨 위
  order.sort(function(a,b){ return a==="old"?-1:(b==="old"?1:(a<b?-1:1)); });
  return order.map(function(k){ return { key:k, label:dayLabel(k), items:map[k] }; });
}

function dayHeader(g, open, n){
  return '<div style="display:flex;align-items:center;gap:8px;margin:16px 2px 8px">'
    + '<button class="dayfold" data-day="'+g.key+'" style="font-size:11.5px;padding:5px 12px;'
    + 'border:1px solid #dfe4ec;background:var(--card);border-radius:20px;color:var(--ink2);cursor:pointer">'
    + (open?"▾":"▸")+' '+g.label+' · '+n+'개</button>'

    + '<button class="daydel" data-day="'+g.key+'" title="이 날짜 대화 삭제" '
    + 'style="font-size:11px;padding:5px 9px;border:1px solid #f3dede;background:var(--card);'
    + 'border-radius:8px;color:#c0392b;cursor:pointer">삭제</button></div>';
}

function consoleMessages(){

    // 최신 날짜는 기본 펼침, 나머지는 기본 접힘

function fillConsoleScheds(){

  fetch(backendOrigin()+"/api/meeting-schedules").then(function(r){return r.json();}).then(function(list){
    MEET_SCHEDULES=list||[];
    if(!MEET_SCHEDULES.length){ el.innerHTML='<div class="note">예약된 회의가 없어요. 회의 탭에서 룸 주기를 정해 예약하세요.</div>'; return; }

        +(sc.continueLast?'<span class="mbadge">이어가기</span>':'')
        +'<span class="cttopic">'+escapeHtml(sc.topic)+'</span></div>';
    }).join("");

// 결론에서 액션 항목 파싱 → 체크리스트
function parseActions(text){
  var out=[], lines=String(text||"").split(/\n/), inAct=false;
  lines.forEach(function(ln){
    var t=ln.trim();
    if(/^액션\s*[:：]/.test(t)){ inAct=true; var rest=t.replace(/^액션\s*[:：]/,"").trim(); if(rest) out.push(rest); return; }
    if(/^(결론|결정사항|종합|핵심)\s*[:：]/.test(t)) inAct=false;
    if(inAct && t){ var c=t.replace(/^[-·•\d\.\)\s]+/,"").trim(); if(c) out.push(c); }
  });
  return out;
}
function ensureActions(m){
  if(!m.actions){
    var src=m.summary||""; (m.agendaSummaries||[]).forEach(function(a){ src+="\n"+a.summary; });
    m.actions=parseActions(src).slice(0,12).map(function(t){ return { text:t, done:false }; });
  }
  return m.actions;
}
function toggleAction(id, idx){

// 회의 발언 음성 재생
var MSPEAK={ on:false };
function stopMeetingSpeak(){ MSPEAK.on=false; try{ window.speechSynthesis.cancel(); }catch(e){} if(SPEECH.audio){ try{ SPEECH.audio.pause(); }catch(e){} SPEECH.audio=null; } }
function speakMeeting(id){
  if(MSPEAK.on){ stopMeetingSpeak(); if(STATE.view==="meeting") render(); return; }
  var m=(STATE.meetings||[]).filter(function(x){return x.id===id;})[0]; if(!m) return;
  // 진짜 성우 모드: 발언별로 Gemini TTS 순차 재생
  if(studioVoice()){
    stopAllSpeech();
    var items=[];
    (m.transcript||[]).forEach(function(t){ if(AGENTS[t.dept] && t.text) items.push({ d:t.dept, x:t.text }); });
    if(m.summary) items.push({ d:(m.chair||m.depts[0]), x:m.summary });
    MSPEAK.on=true; MSPEAK.sid=(MSPEAK.sid||0)+1; var sid=MSPEAK.sid; var k=0;
    (function nextStudio(){
      if(!MSPEAK.on||MSPEAK.sid!==sid||k>=items.length){ if(MSPEAK.sid===sid) MSPEAK.on=false; if(STATE.view==="meeting") render(); return; }
      var it=items[k++];
      studioSay(it.x, it.d).then(function(){ nextStudio(); });
    })();
    if(STATE.view==="meeting") render();
    return;
  }
  if(!window.speechSynthesis) return;
  if(!VOICES_KO.length) loadVoices();
  var synth=window.speechSynthesis; synth.cancel();
  var queue=[];
  (m.transcript||[]).forEach(function(t){
    if(!AGENTS[t.dept]) return;
    var ss=splitSentences(t.text);
    if(ss.length){ ss[0]=AGENTS[t.dept].kr+", "+ss[0]; ss.forEach(function(x){ queue.push({ d:t.dept, x:x }); }); }
  });
  if(m.summary){ var cs=splitSentences(m.summary); if(cs.length){ cs[0]="의장 결론. "+cs[0]; cs.forEach(function(x){ queue.push({ d:(m.chair||m.depts[0]), x:x }); }); } }
  MSPEAK.on=true; MSPEAK.sid=(MSPEAK.sid||0)+1; var sid=MSPEAK.sid; var i=0;
  function next(){
    if(!MSPEAK.on||MSPEAK.sid!==sid||i>=queue.length){ if(MSPEAK.sid===sid) MSPEAK.on=false; if(STATE.view==="meeting") render(); return; }
    var it=queue[i++]; var u=makeUtter(it.x, it.d); u.onend=next; u.onerror=next; synth.speak(u);
  }
  next();
  if(STATE.view==="meeting") render();
}

function meetingToText(m){
  var L=[];
  L.push("════════════════════════════════");
  L.push("  회의록 — "+(m.topic||""));
  L.push("  일시: "+new Date(m.at).toLocaleString("ko-KR"));
  L.push("  참여: "+(m.depts||[]).map(function(d){return AGENTS[d]?(AGENTS[d].kr+(typeof DEPT_MEMBERS!=="undefined"&&DEPT_MEMBERS[d]?"("+DEPT_MEMBERS[d]+")":"")):d;}).join(", "));
  L.push("════════════════════════════════\n");
  (m.transcript||[]).forEach(function(t){ if(t.dept==="client") L.push("[클라이언트 발언]\n"+(t.text||"")+"\n"); else if(AGENTS[t.dept]) L.push("["+t.round+"R] "+AGENTS[t.dept].kr+(t.member?"("+t.member+")":"")+"\n"+(t.text||"")+"\n"); });
  if(m.summary){ L.push("──────── 의장 결론 ────────"); L.push(m.summary); }
  return L.join("\n");
}

async function runRoomMeeting(idx){
  var r=STATE.meetingRooms[idx]; if(!r||r.status==="running") return;
  if(!useBackend()){ alert("회의 진행에는 AI 백엔드 연결이 필요해요. 설정 → AI 백엔드 연결에서 주소를 등록하세요."); return; }
  var noteInp=viewEl.querySelector('[data-mnote="'+idx+'"]'); if(noteInp) r.note=noteInp.value;
  r.status="running"; r.open=true; saveState(); render();
  (async function(){
    try{
      var always=(STATE.meetingAlways||[]).filter(function(d){return AGENTS[d];});
      var mdepts=(r.depts||[]).slice(); always.forEach(function(d){ if(mdepts.indexOf(d)<0) mdepts.push(d); });
      var mchair=r.chair||(always.indexOf("ops")>=0?"ops":(always[0]||""));
      var body={ topic:r.topic, depts:mdepts, rounds:r.rounds||2, mode:r.mode||"discuss", chair:mchair, agenda:r.agenda||[], clientNote:r.note||"", prevSummary:r.prevSummary||"", room:r.topic, alwaysJoin:always, engine:(STATE.meetingEngine==="gemini"?"gemini":"claude") };
      var res=await fetch(backendOrigin()+"/api/meeting",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      var d=await res.json();
      if(d.error) throw new Error(d.error);
      r.lastMeetingId=d.id; saveState();
      // 자리표시 회의를 만들어 즉시 표시 + 폴링 시작
      if(!(STATE.meetings||[]).some(function(x){return x.id===d.id;})){
        STATE.meetings.push({ id:d.id, type:"meeting", status:"running", topic:r.topic, depts:r.depts.slice(), mode:r.mode||"discuss", chair:r.chair||"", agenda:(r.agenda&&r.agenda.length?r.agenda.slice():[r.topic]), transcript:[], agendaSummaries:[], summary:"", at:Date.now() });
      }
      if(STATE.view==="meeting") render();
      pollMeeting(d.id, r.id);
    }catch(e){ r.status="idle"; saveState(); alert("회의 시작 실패: "+(e.message||e)); if(STATE.view==="meeting") render(); }
  })();
}
var MPOLLS={};
function pollMeeting(meetingId, roomId){
  if(MPOLLS[meetingId]) return; // 중복 폴링 방지
  MPOLLS[meetingId]={ started:Date.now() };
  (function tick(){
    var p=MPOLLS[meetingId]; if(!p) return;
    if(Date.now()-p.started > 20*60000){ delete MPOLLS[meetingId]; return; } // 20분 안전 정지
    fetch(backendOrigin()+"/api/meeting/"+meetingId).then(function(rs){ return rs.json(); }).then(function(m){
      if(m && !m.error){
        var idx=-1; (STATE.meetings||[]).forEach(function(x,k){ if(x.id===m.id) idx=k; });
        var prevLen = idx>=0 ? ((STATE.meetings[idx].transcript||[]).length + (STATE.meetings[idx].status==="done"?1:0)) : -1;
        if(idx>=0) STATE.meetings[idx]=m; else STATE.meetings.push(m);
        var newLen=(m.transcript||[]).length + (m.status==="done"?1:0);
        var room=(STATE.meetingRooms||[]).filter(function(x){return x.id===roomId;})[0];
        if(m.status==="done"){
          if(room){ room.status="done"; room.open=false; } // 완료 → 접어서 주제만 보이게 (펼치면 실행·이어하기·마무리)
          saveState(); delete MPOLLS[meetingId];
          try{ logAct("meeting","회의 완료: "+m.topic, true, (MODE_LABELS[m.mode]||"협의")+" · "+(m.depts||[]).length+"개 부서"); }catch(e){}
          if(STATE.view==="meeting") render();
          return;
        }
        if(m.status==="error"){
          if(room) room.status="idle";
          saveState(); delete MPOLLS[meetingId];
          alert("회의 실패: "+(m.error||"원인 미상"));
          if(STATE.view==="meeting") render();
          return;
        }
        if(newLen!==prevLen && STATE.view==="meeting"){
          // 진행 중에는 화면 전체를 다시 그리지 않고 발언 영역·상태배지만 갱신 → 버튼 탭이 먹히지 않게
          var ri=-1; (STATE.meetingRooms||[]).forEach(function(x,k){ if(x.id===roomId) ri=k; });
          var tr = ri>=0 ? document.querySelector('[data-mtr="'+ri+'"]') : null;
          var rr = (STATE.meetingRooms||[]).filter(function(x){return x.id===roomId;})[0];
          if(tr && rr){
            tr.innerHTML = roomTranscriptHtml(rr);
            var st = document.querySelector('[data-room="'+roomId+'"] .mr-stat');
            if(st) st.innerHTML = mIcon('live',11)+' 진행 중 · 발언 '+((m.transcript||[]).length);
          } else { render(); } // 해당 노드를 못 찾으면(접힘 등) 전체 렌더
        }
      }
      setTimeout(tick, 4000);
    }).catch(function(){ setTimeout(tick, 6000); });
  })();
}
function resumeMeetingPolls(){
  (STATE.meetingRooms||[]).forEach(function(r){
    if(r.status==="running" && r.lastMeetingId && useBackend()) pollMeeting(r.lastMeetingId, r.id);

}

function capTrendHtml(curAvg){
  var hist=(STATE.capHistory||[]).slice();
  if(!hist.length) return '<div class="note" style="margin:2px 0 8px">📈 일간·주간·누적 비교는 내일부터 쌓여요 (매일 자동 기록). "역량 평가 새로고침"을 누르면 오늘 첫 기록이 남아요.</div>';
  var now=Date.now();
  function nearest(msAgo){ var t=now-msAgo, best=null, bd=1e15; hist.forEach(function(s){ var d=Math.abs(s.at-t); if(s.at<=now-msAgo*0.5 && d<bd){bd=d;best=s;} }); return best; }
  var first=hist[0];
  var dayAgo=nearest(86400000), weekAgo=nearest(7*86400000);
  function cell(label, base){
    if(!base) return '<div class="captr-c"><div class="captr-l">'+label+'</div><div class="captr-v">–</div></div>';
    var delta=curAvg-(base.avg||0);

function bindMsgFold(){
  var a=document.getElementById("showAllMsgs");
  if(a) a.addEventListener("click", function(){ STATE.showAllMsgs=true; render(); });

  viewEl.querySelectorAll(".dayfold").forEach(function(b){
    b.addEventListener("click", function(){
      var k=b.getAttribute("data-day");
      if(!STATE.dayOpen) STATE.dayOpen={};
      var groups=groupByDay(STATE.messages);
      var newest=groups.length?groups[groups.length-1].key:null;
      var cur=(k in STATE.dayOpen)?STATE.dayOpen[k]:(k===newest);
      STATE.dayOpen[k]=!cur; saveState(); render();
    });
  });

  viewEl.querySelectorAll(".daydel").forEach(function(b){
    b.addEventListener("click", function(){
      var k=b.getAttribute("data-day");
      var n=STATE.messages.filter(function(m){ return dayKey(m.ts)===k; }).length;
      if(!confirm(dayLabel(k)+" 화면 기록 "+n+"개를 지울까요?\n\n지시·응답 원문은 서버에 따로 보관되어 있어 사라지지 않습니다.\n화면에서만 치우는 것입니다.")) return;
      STATE.messages=STATE.messages.filter(function(m){ return dayKey(m.ts)!==k; });
      saveState(); render();
    });
  });
}

function bindComposer(){
  document.querySelectorAll("[data-dept]").forEach(function(b){
    b.addEventListener("click", function(){ openDeptModal(b.getAttribute("data-dept")); });
  });
  var inp=document.getElementById("inp"), snd=document.getElementById("snd");
  if(!inp||!snd) return;
  var attBtn=document.getElementById("attBtn"), attInput=document.getElementById("attInput");
  if(attBtn&&attInput){
    attBtn.addEventListener("click", function(){ attInput.click(); });
    attInput.addEventListener("change", function(){ if(attInput.files&&attInput.files.length){ addAttachments(attInput.files); attInput.value=""; } });
  }
  renderAttachBar();
  snd.disabled = STATE.busy;
  inp.addEventListener("input", function(){ this.style.height="auto"; this.style.height=Math.min(110,this.scrollHeight)+"px"; });
  inp.addEventListener("keydown", function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); go(); } });
  snd.addEventListener("click", go);
  function go(){ var v=inp.value; if(v.trim() && !STATE.busy){ submit(v, STATE.view); } }
}
function bindPublish(){
  // 수행 중 패널 접기/펼치기
  document.querySelectorAll("[data-progtoggle]").forEach(function(b){
    b.addEventListener("click", function(){ var i=+b.getAttribute("data-progtoggle"); var m=STATE.messages[i]; if(!m) return; m._collapsed=!m._collapsed; saveState(); render(); });
  });
  // 긴 결과 메시지 접기/펼치기
  document.querySelectorAll("[data-msgfold]").forEach(function(b){
    b.addEventListener("click", function(){ var i=+b.getAttribute("data-msgfold"); var m=STATE.messages[i]; if(!m) return; m._collapsed=!m._collapsed; saveState(); render(); });
  });
  // 멈춘 '수행 중' 취소 — placeholder 제거 + 폴링 중단 + 서버에 취소 알림
  document.querySelectorAll("[data-jobcancel]").forEach(function(b){
    b.addEventListener("click", function(e){ e.stopPropagation(); var i=+b.getAttribute("data-jobcancel"); var m=STATE.messages[i]; if(!m) return;
      var jid=m._waitJob;
      if(jid){ delete IPOLLS[jid]; STATE.pendingJobs=(STATE.pendingJobs||[]).filter(function(x){return x!==jid;});
        if(useBackend()){ try{ fetch(backendOrigin()+"/api/instruct/"+jid+"/cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}); }catch(err){} } }
      STATE.messages=STATE.messages.filter(function(ms){ return ms!==m; });
      saveState(); render();
    });
  });
  // 멈춘 '수행 중' 다시 시도 — placeholder 제거 후 같은 지시 재전송
  document.querySelectorAll("[data-jobretry]").forEach(function(b){
    b.addEventListener("click", function(e){ e.stopPropagation(); var i=+b.getAttribute("data-jobretry"); var m=STATE.messages[i]; if(!m) return;
      var inst=m._inst||"", jid=m._waitJob;
      if(jid){ delete IPOLLS[jid]; STATE.pendingJobs=(STATE.pendingJobs||[]).filter(function(x){return x!==jid;});
        if(useBackend()){ try{ fetch(backendOrigin()+"/api/instruct/"+jid+"/cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}); }catch(err){} } }
      STATE.messages=STATE.messages.filter(function(ms){ return ms!==m; });

    });

      STATE.replyTarget={ dept:m.deptId, snippet:String(m.text||"").replace(/\s+/g," ").slice(0,40) }; saveState(); render();
      var inp=document.getElementById("inp"); if(inp){ inp.focus(); } });
  });
  var rcx=document.getElementById("replyChipX");
  if(rcx) rcx.addEventListener("click", function(){ STATE.replyTarget=null; saveState(); render(); });
  // 팀장(오세라) 평가 — 그 부서 답변을 평가·의견 제시
  document.querySelectorAll("[data-leadeval]").forEach(function(b){
    b.addEventListener("click", async function(){ var i=+b.getAttribute("data-leadeval"); var m=STATE.messages[i]; if(!m||!m.deptId) return;
      if(!useBackend()){ alert("팀장 평가에는 AI 백엔드 연결이 필요해요."); return; }
      var ob=b.textContent; b.disabled=true; b.textContent="오세라 평가 중…";
      try{ await wakeServer(50000);
        var r=await fetch(backendOrigin()+"/api/ops/evaluate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ content:(m.text||""), dept:m.deptId })});
        var d=await r.json(); if(d.error) throw new Error(d.error);
        m._leadEval={ text:d.evaluation||"" }; saveState();
        try{ logAct("ops","팀장 평가: "+(AGENTS[m.deptId]?AGENTS[m.deptId].kr:""), true, ""); }catch(e){}
        render();
      }catch(err){ alert("팀장 평가 실패: "+(err.message||err)); b.disabled=false; b.textContent=ob; }
    });
  });
  // 팀장 평가를 반영해 그 부서에 수정 요청(이어 대화 타깃 + 평가 프리필)

    b.addEventListener("click", function(){ var i=+b.getAttribute("data-evalreply"); var m=STATE.messages[i]; if(!m||!m.deptId||!m._leadEval) return;
      STATE.replyTarget={ dept:m.deptId, snippet:"팀장 평가 반영" }; saveState(); render();

    });

      }catch(e){ b.textContent="실패"; logAct("image","이미지 생성",false,"오류: "+(e.message||e),(STATE.messages[mi]&&STATE.messages[mi]._inst)||""); alert("이미지 생성 오류: "+(e.message||e)); }

    });
  });
  document.querySelectorAll("[data-genvid]").forEach(function(b){
    b.addEventListener("click", async function(){
      var mi=+b.getAttribute("data-genvid");
      if(!useBackend()){ alert("영상 생성은 백엔드 연결 시 사용할 수 있어요 (설정 > AI 백엔드)."); return; }

async function devRefreshList(){
  var el=document.getElementById("devList"); if(!el) return;
  if(!useBackend()){ el.innerHTML='<div class="note">백엔드 연결 시 개발실을 쓸 수 있어요.</div>'; return; }
  var list=[];
  try{ var r=await fetch(backendOrigin()+"/api/dev/patches"); list=await r.json(); }catch(e){ el.innerHTML='<div class="note">패치 목록을 불러오지 못했어요.</div>'; return; }
  if(!list.length){ el.innerHTML='<div class="note">아직 개발된 패치가 없어요.</div>'; return; }
  el.innerHTML=list.slice().reverse().map(function(p){
    return '<div class="schedrow"><span>'+(p.enabled?'🟢':'⚪')+'</span>'
      +'<span style="flex:1"><b>'+escapeHtml(p.title)+'</b><br><span style="font-size:11px;color:#9aa3b5">'+escapeHtml(p.desc||"")+'</span></span>'
      +'<button class="cbtn" data-ptg="'+p.id+'" data-en="'+(p.enabled?0:1)+'">'+(p.enabled?'끄기':'켜기')+'</button>'
      +'<button class="cbtn disc" data-pdel="'+p.id+'">삭제</button></div>';
  }).join("");

async function runSelfCheck(){
  var out=[], fixed=0;
  function add(n,ok,v){ out.push({n:n,ok:ok,v:v||""}); }
  // 1) 상태 구조 자가 보완
  var defaults={ meetingRooms:[], meetings:[], deptMemory:{}, deptExp:{}, collections:[], activityLog:[], seenJobIds:[], customTargets:[], deptDirective:{}, deptClips:{} };
  Object.keys(defaults).forEach(function(k){ if(STATE[k]===undefined||STATE[k]===null){ STATE[k]=defaults[k]; fixed++; } });
  if((STATE.meetingRooms||[]).length>5){ STATE.meetingRooms=STATE.meetingRooms.slice(0,5); fixed++; }
  add("앱 데이터 구조", true, fixed? ("누락 "+fixed+"개 자동 복구") : "정상");
  // 2) 저장소
  var mainOk=false, bakOk=false;
  try{ JSON.parse(localStorage.getItem(STORE_KEY)||"null"); mainOk=!!localStorage.getItem(STORE_KEY); }catch(e){}
  try{ JSON.parse(localStorage.getItem(STORE_KEY_BAK)||"null"); bakOk=!!localStorage.getItem(STORE_KEY_BAK); }catch(e){}
  if(!mainOk && bakOk){ try{ localStorage.setItem(STORE_KEY, localStorage.getItem(STORE_KEY_BAK)); mainOk=true; }catch(e){} }
  await saveState();
  add("로컬 저장소", mainOk||bakOk, (mainOk?"메인 정상":"메인 복구 시도")+(bakOk?" · 보조백업 있음":" · 보조백업 없음"));
  // 3) 용량
  try{ var est=await navigator.storage.estimate(); add("저장 공간", true, Math.round((est.usage||0)/1024/1024*10)/10+"MB 사용 / "+Math.round((est.quota||0)/1024/1024)+"MB"); }catch(e){}
  // 4) 오프라인 지원
  add("오프라인 지원(SW)", !!(navigator.serviceWorker&&navigator.serviceWorker.controller), navigator.serviceWorker&&navigator.serviceWorker.controller?"서비스워커 작동":"홈 화면 설치 후 활성화돼요");
  // 4.5) 플랫폼 패치 상태
  var ps=window.__patchStatus||{applied:[],failed:[]};
  add("플랫폼 패치", ps.failed.length===0, ps.skipped?"안전모드(미적용)":(ps.applied.length+"개 적용"+(ps.failed.length?(" · 실패 "+ps.failed.length+"개: "+ps.failed.join(" / ").slice(0,120)):"")));
  // 5) 백엔드
  if(useBackend()){
    try{
      var r=await fetch(backendOrigin()+"/api/selfcheck");
      var d=await r.json();
      (d.checks||[]).forEach(function(c){ add("백엔드 · "+c.name, c.ok, c.note); });
    }catch(e){ add("백엔드 연결", false, "응답 없음 — Render 서비스가 잠들었거나 주소가 잘못됐어요. 잠시 후 다시 시도하세요."); }
  } else {
    add("백엔드 연결", false, "미연결 — 설정의 \'AI 백엔드 연결\'에 주소를 등록하면 실제 AI 작업이 가능해요.");
  }
  try{ logAct("check","자체 점검", out.every(function(x){return x.ok;}), fixed? ("자동 복구 "+fixed+"건") : "이상 없음"); }catch(e){}
  return out;
}

async function loadAndApplyPatches(){
  if (/[?&]safe=1/.test(location.search)){ window.__patchStatus.skipped = true; return; } // 안전모드
  var list = null;
  if (useBackend()){
    try{ var r=await fetch(backendOrigin()+"/api/dev/patches?full=1"); list=await r.json();
      try{ localStorage.setItem(PATCH_KEY, JSON.stringify(list)); }catch(e){}
    }catch(e){}
  }
  if (!list){ try{ list=JSON.parse(localStorage.getItem(PATCH_KEY)||"null"); }catch(e){} }
  if (!Array.isArray(list)) return;
  window.__appliedPatchIds = window.__appliedPatchIds || {};
  list.filter(function(p){ return p.enabled && p.js && !window.__appliedPatchIds[p.id]; }).forEach(function(p){
    window.__appliedPatchIds[p.id]=1;
    try{
      if (p.css){ var st=document.createElement("style"); st.setAttribute("data-patch", p.id); st.textContent=p.css; document.head.appendChild(st); }
      new Function(p.js)();
      window.__patchStatus.applied.push(p.title||String(p.id));
    }catch(e){
      window.__patchStatus.failed.push((p.title||p.id)+": "+e.message);
    }
  });
  if (window.__patchStatus.applied.length){ try{ render(); }catch(e){} }
}

if("serviceWorker" in navigator){
  // 새 버전 활성화되면 자동 새로고침(캐시 갇힘 근본 차단) — 단, 무한 새로고침 방지 가드
  /* v271: 가드가 일반 변수라 새로고침되면 같이 초기화됐다.
     그래서 SW 가 다시 알림을 보내면 또 새로고침되는 반복이 생긴다.
     캐시 이름별로 세션에 기록해 '이 버전은 이미 새로고침했다'를 기억한다.
     또한 입력 중일 때는 새로고침을 미룬다 — 쓰던 글이 날아가면 안 된다. */
  var _swReloaded = false;
  function _swAlreadyReloaded(cache){
    try{ return sessionStorage.getItem("sw_reloaded") === String(cache||"1"); }catch(_){ return false; }
  }
  function _swMarkReloaded(cache){
    try{ sessionStorage.setItem("sw_reloaded", String(cache||"1")); }catch(_){}
  }
  navigator.serviceWorker.addEventListener("message", function(ev){
    if(!(ev.data && ev.data.type==="SW_UPDATED")) return;
    if(_swReloaded || _swAlreadyReloaded(ev.data.cache)) return;
    _swReloaded = true;
    _swMarkReloaded(ev.data.cache);

    // 입력 중이거나 작업 중이면 새로고침하지 않는다 (쓰던 내용 보호)
    var typing = false;
    try{
      var el = document.activeElement;
      typing = !!(el && (el.tagName==="TEXTAREA" || el.tagName==="INPUT") && String(el.value||"").trim());
    }catch(_){}
    if(typing || STATE.busy){
      try{ if(typeof toast==="function") toast("새 버전이 준비됐어요. 작업을 마치면 새로고침해 주세요."); }catch(_){}
      return;
    }
    try{ if(typeof saveState==="function") saveState(); }catch(_){}
    setTimeout(function(){ location.reload(); }, 300);
  });
  // 새 SW로 제어가 바뀌면(첫 설치 제외) 새로고침
  var _hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(_hadController && !_swReloaded){ _swReloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    // 주기적으로 새 버전 확인(앱이 열려있는 동안 30분마다)
    try{ setInterval(function(){ reg.update().catch(function(){}); }, 30*60000); }catch(_){}
    // 페이지 열릴 때도 즉시 한 번 확인
    try{ reg.update().catch(function(){}); }catch(_){}
  }).catch(function(){});
}

function ago(iso){

  if(m<60) return m+"분";

try{ TOKEN = localStorage.getItem("authToken") || ""; }catch(e){}
async function unlock(){
  const pw = window.prompt("비밀번호를 입력해 주세요");
  if(!pw) return false;
  try{
    const r = await fetch(API+"/api/login",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
    const d = await r.json().catch(()=>null);
    if(d && d.token){ TOKEN = d.token; try{ localStorage.setItem("authToken",TOKEN); }catch(e){} return true; }
  }catch(e){}
  toast("비밀번호가 맞지 않습니다");
  return false;
}
async function api(path, opts, _retried){
  let r;
  const opt = Object.assign({}, opts||{});
  opt.headers = Object.assign({"Content-Type":"application/json"},
    TOKEN ? {"Authorization":"Bearer "+TOKEN} : {}, opt.headers||{});
  try{ r = await fetch(API+path, opt); }
  catch(e){ return { ok:false, error:"서버에 닿지 못했습니다 — "+(e.message||"연결 실패") }; }
  let d=null; try{ d = await r.json(); }catch(e){ d=null; }
  if(r.status===401 && !_retried){                     // 잠겨 있다 — 한 번만 열어 보고 다시 시도
    if(await unlock()) return api(path, opts, true);
    return { ok:false, status:401, error:"잠겨 있습니다" };
  }
  if(!r.ok) return { ok:false, status:r.status, error:(d&&d.error)||("서버 오류 "+r.status) };
  if(!d) return { ok:false, error:"빈 응답" };
  if(d.ok===undefined) d.ok = true;
  return d;
}

/* ── 사진 (v305) ──
   원본은 서버에 쌓지 않는다. 1024px·JPEG 로 줄여 한 번만 보내고,
   AI가 본 내용을 글로 적어 그것만 남긴다. 예전 대역폭 사고를 되풀이하지 않기 위해. */
let ATTACH = [];   // 첨부한 사진 [{data(base64), media_type, url(미리보기)}]
function shrinkPhoto(file){
  return new Promise(resolve=>{
    if(!/^image\//.test(file.type||"")) return resolve(null);
    const img = new Image();
    img.onload = ()=>{
      const max=1024; let w=img.width, h=img.height;
      if(w>max||h>max){ if(w>=h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const url=c.toDataURL("image/jpeg",0.8);
      resolve({ data:url.split(",")[1], media_type:"image/jpeg", url:url });
    };
    img.onerror = ()=>resolve(null);
    img.src = URL.createObjectURL(file);
  });
}
async function addPhotos(files){
  for(let i=0; i<files.length && ATTACH.length<3; i++){
    const p = await shrinkPhoto(files[i]);
    if(p) ATTACH.push(p);
  }
  paintPhotos();
}

  const bar = ROOT.querySelector("#njPhotoBar");

     </span>`).join("");
  bar.querySelectorAll("[data-px]").forEach(b=>{

  });
}

/* ══ 결과물 조각내기 (v313) ══
   설계서 같은 긴 결과물이 통째로 흘러내려 아무것도 못 찾았다.
   ## 제목으로 잘라 접고, 코드는 따로 떼어 조각마다 복사 버튼을 붙인다.
   — 통째 복사만 있으면 필요한 한 조각을 쓰려고 전부를 긁어야 한다. */
function cutDoc(text){
  const src = String(text||"");
  const parts = [];
  let buf = [], title = "", fence = null, code = [];
  const flush = ()=>{ if(buf.join("\n").trim()){ parts.push({kind:"text", title, body:buf.join("\n")}); } buf=[]; };
  for (const line of src.split("\n")){
    const f = line.match(/^\s*```+\s*([A-Za-z0-9+#-]*)\s*$/);
    if (f){
      if (fence === null){ flush(); fence = f[1] || "코드"; code = []; }
      else { parts.push({kind:"code", lang:fence, title:title, body:code.join("\n")}); fence = null; }
      continue;
    }
    if (fence !== null){ code.push(line); continue; }
    const h = line.match(/^(#{1,4})\s+(.+)$/);
    if (h){ flush(); title = h[2].replace(/[*`]/g,"").trim(); continue; }
    buf.push(line);
  }
  if (fence !== null && code.length) parts.push({kind:"code", lang:fence||"코드", title:title, body:code.join("\n")});
  flush();
  return parts;
}
window.__DOCPARTS = [];
window.__DOCID = "";
/* ══ 대조해 보여주기 (v318) ══
   AI 결과를 곧바로 덮어쓰면 무엇이 바뀌었는지 모르고, 잘못돼도 되돌릴 수 없다.
   업계 표준은 '덮어쓰지 말고 제안으로 보여라'다. 사람이 받아들일지 정한다.
   지운 데는 분홍, 새로 든 데는 초록으로 칠한다. */
function diffWords(a, b){
  const A = String(a||"").split(/(\s+)/), B = String(b||"").split(/(\s+)/);
  // 앞뒤로 같은 부분을 걷어내고 가운데만 다른 것으로 본다 — 가볍고 충분히 정확하다
  let h = 0;
  while (h < A.length && h < B.length && A[h] === B[h]) h++;
  let t = 0;
  while (t < A.length-h && t < B.length-h && A[A.length-1-t] === B[B.length-1-t]) t++;
  return {
    same1: A.slice(0, h).join(""),
    del:   A.slice(h, A.length-t).join(""),
    ins:   B.slice(h, B.length-t).join(""),
    same2: A.slice(A.length-t).join("")
  };
}
function diffHtml(a, b){
  const d = diffWords(a, b);
  if (!d.del && !d.ins) return '<span class="dfsame">' + esc(String(b||"")) + "</span>";
  return '<span class="dfsame">' + esc(d.same1) + "</span>"
       + (d.del ? '<span class="dfdel">' + esc(d.del) + "</span>" : "")
       + (d.ins ? '<span class="dfins">' + esc(d.ins) + "</span>" : "")
       + '<span class="dfsame">' + esc(d.same2) + "</span>";
}

/* ══ 집어서 고치기 (v317) ══
   본문이나 코드에서 마음에 안 드는 데를 손가락으로 긁으면,
   그 자리만 다시 쓴다. 글자를 찾아 바꾸지 않고 '몇 번째 글자부터 몇 번째까지'를
   기억한다 — 같은 문구가 두 번 나와도 엉뚱한 데가 바뀌지 않는다. */
window.__SEL = null;      // {n, start, end, text}
function selOffset(root, node, off){
  let n = 0, done = false;
  (function walk(el){
    if (done) return;
    if (el.nodeType === 3){
      if (el === node){ n += off; done = true; return; }
      n += el.nodeValue.length; return;
    }
    for (const c of el.childNodes){ walk(c); if (done) return; }
  })(root);
  return n;
}
function catchSelection(){
  if (window.__WORK === false) return;      // 읽는 중에는 방해하지 않는다
  const sel = window.getSelection();
  const bar = document.getElementById("selBar");
  if (!sel || sel.isCollapsed || !sel.rangeCount){ if(bar) bar.remove(); window.__SEL=null; return; }
  const r = sel.getRangeAt(0);
  const host = r.startContainer.parentElement &&
               r.startContainer.parentElement.closest(".dcode, .dbody");
  if (!host || !host.id){ if(bar) bar.remove(); window.__SEL=null; return; }
  const m = host.id.match(/^dp-(?:b-)?(\d+)$/);
  if (!m){ if(bar) bar.remove(); window.__SEL=null; return; }
  const text = String(sel.toString());
  if (text.trim().length < 2){ if(bar) bar.remove(); window.__SEL=null; return; }
  const start = selOffset(host, r.startContainer, r.startOffset);
  window.__SEL = { n:+m[1], start:start, end:start+text.length, text:text };
  if (bar) bar.remove();
  const b = document.createElement("div");
  b.id = "selBar";
  b.innerHTML = `<span>집어낸 ${text.trim().length}자</span>
    <button data-selredo="1">↩ 이 부분만 다시</button>`;
  document.body.appendChild(b);
}
document.addEventListener("selectionchange", ()=>{ setTimeout(catchSelection, 60); });
/* 조각을 원래 모양으로 되붙인다. 고친 코드가 그대로 문서에 들어가야 한다. */
function joinDoc(parts){
  let last = null;                       // 같은 절 제목을 두 번 쓰지 않는다
  const out = [];
  for (const p of (parts||[])){
    if (p.title && p.title !== last){ out.push("## " + p.title); last = p.title; }
    out.push(p.kind==="code"
      ? "```" + (p.lang==="코드"?"":p.lang) + "\n" + p.body + "\n```"
      : p.body);
  }
  return out.join("\n\n").replace(/\n{4,}/g,"\n\n\n");
}
/* ══ 그려 보기 (v315) ══
   예전에는 새 창을 띄웠다. PC 에서는 두 화면을 나란히 볼 수 있지만
   폰에서는 창이 갈리면 코드와 결과를 오갈 수 없고, 팝업이 막히기도 한다.
   그래서 화면 안에서 그린다. 기기마다 놓는 자리를 달리한다.

     📱 폰    — 화면을 덮는 판. 코드↔화면을 단추로 오간다
     📲 태블릿 — 아래에서 올라오는 판. 위로 코드가 보인다
     💻 PC    — 오른쪽에 나란히. 고치면서 바로 본다  */
function devNow(){

  if (!html) return null;

    + "<meta name=viewport content='width=device-width,initial-scale=1'>"
    + "<style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo',sans-serif}"
    + css + "</style></head><body>" + html + "</body></html>";
}

function docHtml(text, idBase){

  window.__DOCPARTS = parts;
  setTimeout(paintWork, 0);

  const codeN = parts.filter(p=>p.kind==="code").length;
  const nav = parts.map((p,i)=> p.kind==="code"
      ? `<span class="dchip code" data-djump="${i}">&lt;/&gt; ${esc(p.title? p.title.slice(0,12)+" · " : "")}${esc(p.lang)}</span>`
      : (p.title ? `<span class="dchip" data-djump="${i}">${esc(p.title.slice(0,18))}</span>` : "")

          <span class="dmeta">${lines}줄</span>

        <pre class="dcode" id="${idBase}-c-${i}">${esc(p.body)}</pre></div>`;
    }
    const chars = p.body.replace(/\s/g,"").length;
    const long = chars > 260;
    return `<div class="dpart" id="${idBase}-${i}">
      <div class="dhead"><b data-dtoggle="${i}" style="cursor:pointer">${esc(p.title||"본문")}</b>

        <button class="dcopy" data-dcopy="${i}">복사</button></div>
      <div class="dbody${long?" fold":""}" id="${idBase}-b-${i}">${esc(p.body.trim())}</div>
      ${long?`<span class="cmore" data-unfold="${idBase}-b-${i}">… 더 보기</span>`:""}</div>`;
  }).join("");
  const hasHtml = parts.some(p=>p.kind==="code" && /html/i.test(p.lang));

}

/* 총괄석은 새로고침을 견뎌야 한다. 서버는 계속 일하고 있는데 화면만 비면
   사람은 일이 사라진 줄 안다. 대화와 진행 중인 작업 번호를 기기에 남긴다. */
const CHIEF_KEY = "chief-v1";
function saveChief(){
  try{ localStorage.setItem(CHIEF_KEY, JSON.stringify({
    msgs: CHIEF.msgs.slice(-14), running: CHIEF.running,
    jobId: CHIEF.jobId, since: CHIEF.since })); }catch(e){}
}
function loadChief(){
  try{
    const d = JSON.parse(localStorage.getItem(CHIEF_KEY)||"null");
    if(d && Array.isArray(d.msgs)) CHIEF = {
      msgs:d.msgs, running:!!d.running, jobId:d.jobId||null, since:d.since||0 };
  }catch(e){}
}

/* 총괄에게 시킨다 → 서버의 총괄이 분담해 부서들이 순서대로 수행한다.
   이름을 붙이지 않는 것이 핵심 — 이름을 붙이면 그 사람에게 직행한다. */
async function chiefSay(v){
  CHIEF.msgs.push({me:true, t:v});
  CHIEF.msgs.push({t:"받았습니다. 누구에게 줄지 정하겠습니다…", pending:true});
  CHIEF.running = true; CHIEF.since = Date.now(); CHIEF.jobId = null;
  saveChief(); renderChief();

  const d = await api("/api/instruct",{method:"POST",
    body:JSON.stringify({ instruction:v, source:"manager" })});
  if(!d.ok || !d.id){ chiefDone(d.error||"전달하지 못했습니다."); return; }
  CHIEF.jobId = d.id; saveChief();
  await watchChief(d.id);
}

function chiefSet(txt){
  const i = CHIEF.msgs.findIndex(m=>m.pending);
  if(i>=0) CHIEF.msgs[i].t = txt;
  renderChief();
}
function chiefDone(txt){
  const i = CHIEF.msgs.findIndex(m=>m.pending);
  if(i>=0) CHIEF.msgs[i] = { t:txt }; else CHIEF.msgs.push({ t:txt });
  CHIEF.running = false; CHIEF.jobId = null;
  if(CHIEF.msgs.length > 14) CHIEF.msgs = CHIEF.msgs.slice(-14);
  saveChief(); renderChief(); load();
}

/* 진행 중인 분담을 지켜본다. 새로고침 뒤에도 이 함수만 다시 붙이면 이어진다. */
async function watchChief(id){
  CHIEF.running = true; renderChief();
  const MAX = 150;                    // 2.5초 x 150 ≈ 6분
  for(let n=0; n<MAX; n++){
    await new Promise(r=>setTimeout(r, 2500));
    const j = await api("/api/instruct/"+id);
    if(j.status===404 || (!j.ok && j.status===404)){
      chiefDone("총괄이 그 일을 기억하지 못합니다 — 서버가 다시 시작된 듯합니다. 다시 시켜 주세요.");
      return;
    }
    if(!j.ok) continue;
    if(j.status==="error"){ chiefDone("하다가 막혔습니다 — "+(j.error||"원인 불명")); return; }
    if(j.status==="done"){
      const ds = (j.depts||[]).filter(k=>TEAM[k]);
      const head = (ds.length ? ds.map(k=>TEAM[k].nm).join(" · ")+"에게 넘겼습니다." : "제가 처리했습니다.")
                 + (j.plan ? "\n\n"+String(j.plan).trim() : "");
      const i = CHIEF.msgs.findIndex(m=>m.pending);
      if(i>=0) CHIEF.msgs[i] = { t:head }; else CHIEF.msgs.push({ t:head });
      (j.results||[]).forEach(r=>{
        const t = String(r.text||"").trim();
        if(t) CHIEF.msgs.push({ who:r.dept, t:t });
      });
      CHIEF.running = false; CHIEF.jobId = null;
      if(CHIEF.msgs.length > 14) CHIEF.msgs = CHIEF.msgs.slice(-14);
      saveChief(); renderChief(); load();
      return;
    }
    chiefSet(j.progress ? String(j.progress) : "부서에 나누는 중…");
    if(n % 4 === 0) saveChief();
  }
  chiefDone("아직 끝나지 않았습니다. 잠시 뒤 새로고침하면 이어서 보여 드리겠습니다.");
}

             ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }

  }
  if(t.dataset.reject){

    const d = await api("/api/content/approve",{method:"POST",body:JSON.stringify({
      generation_id:id, action:"reject", reason:why })});

  }
  if(t.dataset.approve){

    if(d.ok){
      const pct = d.edit_distance!=null ? Math.round(d.edit_distance*100) : 0;
      toast(pct>=5 ? `결재했습니다 · ${pct}% 고침 — 배움으로 올립니다`
                   : (pct>0 ? `결재했습니다 · ${pct}% 고침 (5% 미만은 배움으로 안 올라갑니다)`
                            : "결재했습니다 · 고친 데 없음"));
      VIEW=null; await load(true);

  if(t.dataset.answer){

  if(t.dataset.call){

  }
  if(t.dataset.say){

    /* 서버는 지시문 안의 이름으로 담당을 고른다 — 이름을 앞에 붙인다 */
    const d = await api("/api/instruct",{method:"POST",body:JSON.stringify({

    if(!d.ok || !d.id){ say(d.error||"전달하지 못했습니다."); return; }
    let out="";
    for(let n=0; n<60; n++){

      body:JSON.stringify({ generation_id: window.__DOCID, text: full })});
    if(d.ok){
      toast("고친 내용을 저장했습니다" + (d.edit_distance!=null?` · 수정률 ${Math.round(d.edit_distance*100)}%`:""));
      const host = ROOT.querySelector("#dp-"+n);
      if(host){ const old = host.querySelector(".dcode, .dbody");
                if(old){ old.textContent = p.body; old.style.display=""; }
                const box = host.querySelector("[data-dbox]"); if(box) box.parentElement.remove(); }
    } else { toast(d.error||"실패"); t.disabled = false; }
    return;
  }
  if(t.dataset.dcopy != null){
    const p = (window.__DOCPARTS||[])[+t.dataset.dcopy];
    if(p){ try{ await navigator.clipboard.writeText(p.body); toast("이 조각을 복사했습니다"); }
           catch(e){ toast("복사 실패"); } }
    return;
  }
  if(t.dataset.djump != null){
    const el = ROOT.querySelector("#dp-"+t.dataset.djump);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"start"});
            el.classList.add("hi"); setTimeout(()=>el.classList.remove("hi"), 1200); }
    return;
  }
  if(t.dataset.dtoggle != null){
    const b = ROOT.querySelector("#dp-b-"+t.dataset.dtoggle);
    if(b) b.classList.toggle("fold");
    return;
  }
  if(t.dataset.unfold){
    const el = ROOT.querySelector("#"+t.dataset.unfold);
    if(el){ el.classList.remove("fold"); t.remove(); }
    return;
  }
  if(t.dataset.cfold){
    const k = t.dataset.cfold;
    if (CHIEF_OPEN.has(k)) CHIEF_OPEN.delete(k); else CHIEF_OPEN.add(k);
    renderChief(); return;
  }
  if(t.id==="splitBtn"){ toggleSplit(); return; }
  if(t.id==="rpHead" || (t.closest && t.closest("#rpHead"))){
    RP_OPEN = !RP_OPEN; paintReports(); return;
  }
  if(t.id==="rtHead" || (t.closest && t.closest("#rtHead"))){
    RT_OPEN = !RT_OPEN; paintRoutines(); return;
  }
  if(t.dataset.rttoggle){
    t.disabled=true;
    const d = await api("/api/routines/toggle",{method:"POST",
      body:JSON.stringify({routine_id:t.dataset.rttoggle})});
    if(d.ok){ toast(d.enabled?"켰습니다":"껐습니다"); await loadRoutines(); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }
  if(t.dataset.rtrun){
    if(!confirm("기다리지 않고 지금 한 번 돌릴까요?")) return;
    t.disabled=true; toast("시작합니다…");
    const d = await api("/api/routines/run",{method:"POST",
      body:JSON.stringify({routine_id:t.dataset.rtrun})});
    if(d.ok){ toast("일감을 넘겼습니다"); await loadRoutines(); await load(true); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }

  /* v305: 하던 일을 멈춘다 — 다음 단계 경계에서 실제로 선다 */
  if(t.dataset.pcancel){
    if(!confirm("이 일을 멈출까요? 나중에 '다시'로 이어서 할 수 있어요.")) return;
    t.disabled=true; toast("멈추는 중…");
    const d = await api("/api/pipeline/cancel",{method:"POST",
      body:JSON.stringify({generation_id:t.dataset.pcancel})});
    if(d.ok){ toast("멈췄습니다"); await load(true); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }
  /* v305: 목록에서 지운다 — 되돌릴 수 없다 */
  if(t.dataset.pdel){
    if(!confirm("이 기록을 아주 지울까요? 되돌릴 수 없어요.")) return;
    t.disabled=true; toast("지우는 중…");
    const d = await api("/api/pipeline/delete",{method:"POST",
      body:JSON.stringify({generation_id:t.dataset.pdel})});
    if(d.ok){ toast("지웠습니다"); await load(true); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }

  if(t.id==="njPhotoBtn"){
    if(ATTACH.length>=3){ toast("사진은 3장까지예요"); return; }
    const f=$("#njPhoto"); if(f) f.click();
    return;
  }

  if(t.id==="njGo"){
    const topic=$("#njTopic").value.trim();
    if(!topic){ toast("무엇을 만들지 적어 주세요"); return; }
    const chans=[...ROOT.querySelectorAll("#njChans .chn.on")].map(x=>x.dataset.chn);
    if(!chans.length){ toast("만들 것을 하나 이상 고르세요"); return; }
    const refs=$("#njRef").value.split("\n").map(s=>s.trim()).filter(s=>/^https?:\/\//.test(s)).slice(0,3);
    t.disabled=true; toast("시작합니다…");
    const d = await api("/api/pipeline/run",{method:"POST",
      body:JSON.stringify({topic, channels:chans, refUrls:refs,
        photos: ATTACH.map(p=>({data:p.data, media_type:p.media_type}))})});
    if(d.ok){ const np=ATTACH.length;
      $("#njTopic").value=""; $("#njRef").value=""; ATTACH=[]; paintPhotos();
      toast(np?("사진 "+np+"장과 함께 시작했습니다"):"작업이 시작되었습니다"); await load(); }
    else { toast(d.error||"실패"); }
    t.disabled=false;
    return;
  }
});
ROOT.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && e.target && e.target.id==="talkin"){
    const b=ROOT.querySelector("[data-say]"); if(b) b.click();
  }
  if(e.key==="Enter" && e.target && e.target.id==="cfin"){
    const b=ROOT.querySelector("#cfGo"); if(b) b.click();
  }
});

tick(); setInterval(()=>{ if(!ROOT.hidden) tick(); }, 20000);
loadChief();
renderChief();
load();
loadRoutines();
loadReports();
/* 새로고침 전에 돌리던 분담이 있으면 다시 붙는다 */
if(CHIEF.running && CHIEF.jobId) watchChief(CHIEF.jobId);
else if(CHIEF.running){ CHIEF.running=false; saveChief(); renderChief(); }
/* 진행 중인 일이 있을 때만 갱신 — 없으면 화면이 조용하다 */
setInterval(()=>{
  if(ROOT.hidden) return;               // 다른 탭을 보고 있으면 쉬게 둔다
  if(CHIEF.running || VIEW) return;
  const running = BOARD.live.some(r=>r.approval_status==="processing");
  if(typingNow()) return;          // 손이 자판에 있으면 건드리지 않는다
  if(running) load();
}, 20000);

/* ── 오늘 보고 (v307) ──
   무엇을 했든 여기에 남는다. 성공도 실패도.
   조용한 것이 "잘 돌아간다"인지 "죽었다"인지 알 수 있어야 한다. */
let RPS = [], RP_CNT = {}, RP_OPEN = false;
const RP_MARK = { ok:"✅", fixed:"🔧", failed:"⚠️", skipped:"·" };
let DUTY_ST = null;
async function loadReports(){
  try{
    const d = await api("/api/reports");
    RPS = (d && d.reports) || []; RP_CNT = (d && d.count) || {};
  }catch(e){ RPS = []; RP_CNT = {}; }
  try{ DUTY_ST = await api("/api/duty"); }catch(e){ DUTY_ST = null; }
  paintReports();
}
function paintReports(){
  const sum = ROOT.querySelector("#rpSum"), box = ROOT.querySelector("#rpBox"), car = ROOT.querySelector("#rpCaret");
  if(!box) return;
  const c = RP_CNT || {};
  if (sum) sum.textContent = RPS.length
    ? ("· 한 일 " + (c.한일||0) + (c.처리 ? " · 처리 " + c.처리 : "") + (c.남음 ? " · 남음 " + c.남음 : ""))
    : "· 아직 없음";
  if (car) car.textContent = RP_OPEN ? "▴" : "▾";
  box.hidden = !RP_OPEN;
  if (!RP_OPEN) return;
  /* 아무도 안 하고 있는 일이 있으면 무엇보다 먼저 보여야 한다 */
  let head = "";
  if (DUTY_ST && DUTY_ST.ok){
    const 급 = (DUTY_ST.빈몫||[]).concat(DUTY_ST.꺼짐||[]);
    const 밀 = DUTY_ST.밀림||[];
    if (급.length){
      head = `<div class="slip" style="padding:11px 13px;margin-bottom:8px;border-left:3px solid var(--seal)">
        <b style="font-size:12px;color:var(--seal)">⛔ 아무도 안 하고 있는 일 ${급.length}건</b>
        ${급.slice(0,4).map(x=>`<div style="font-size:11px;margin-top:4px">· ${esc(x.이름)} — ${esc(x.몫)}</div>`).join("")}
      </div>`;
    } else if (밀.length){
      head = `<div class="slip" style="padding:11px 13px;margin-bottom:8px;border-left:3px solid #C9A227">
        <b style="font-size:12px;color:#C9A227">⏰ 밀린 일 ${밀.length}건</b>
        ${밀.slice(0,4).map(x=>`<div style="font-size:11px;margin-top:4px">· ${esc(x.이름)} — ${esc(x.몫)} (${esc(x.지남)})</div>`).join("")}
      </div>`;
    } else {
      head = `<div style="font-size:11px;color:#2E7D5B;padding:6px 2px 10px">✅ 맡은 일 ${DUTY_ST.전체몫||0}개가 전부 굴러가고 있습니다</div>`;
    }
  }
  if (!RPS.length){
    box.innerHTML = head + '<div class="empty">오늘은 아직 기록이 없어요.<br><span style="font-size:10.5px">정기 일감이 전부 꺼져 있는지 확인해 보세요.</span></div>';
    return;
  }
  box.innerHTML = head + RPS.slice(0,20).map(r=>{
    const who = (TEAM[r.dept] && TEAM[r.dept].nm) || r.dept || "";
    const t = String(r.created_at||"").slice(11,16);
    const col = r.status==="failed" ? "var(--seal)" : (r.status==="fixed" ? "#C9A227" : "var(--ink3)");
    const det = r.detail && r.detail.시도 ? String(r.detail.시도.join(" / ")).slice(0,120) : "";
    return `<div class="slip" style="padding:10px 13px;margin-bottom:6px">
      <div style="display:flex;gap:7px;align-items:baseline">
        <span>${RP_MARK[r.status]||"·"}</span>
        <span style="flex:1;min-width:0">
          <b style="font-size:12px">${esc(r.title)}</b>
          <span style="display:block;font-size:10.5px;color:${col};margin-top:2px">${esc(r.summary||"")}</span>
          ${det?`<span style="display:block;font-size:10px;color:var(--ink3);margin-top:3px">↳ ${esc(det)}</span>`:""}
        </span>
        <span style="font-size:9.5px;color:var(--ink3);white-space:nowrap">${esc(who)} ${esc(t)}</span>
      </div></div>`;
  }).join("")
  ;   /* v324: 앱 안에서 '카톡으로 받기'는 앞뒤가 안 맞는다.
         이미 여기서 다 보고 있는데 같은 것을 다시 보낼 이유가 없다.
         카톡은 앱 밖에 있을 때 불러들이는 용도다. */
}

/* ── 정기 일감 (v306) ──
   정해진 시각에 부서로 일이 떨어진다. 여기서는 켜고 끄고, 시각만 바꾼다.
   새벽(0~5시)은 렌더 무료 서버가 자느라 조용히 건너뛰므로 아예 고를 수 없게 했다. */
let RTS = [], RT_OPEN = false;
const FREQ_KR = { daily:"매일", weekly:"매주", monthly:"매월" };
const DOW_KR = ["일","월","화","수","목","금","토"];
function rtWhen(r){
  const h = String(r.at_hour).padStart(2,"0") + "시";
  if (r.freq === "weekly")  return "매주 " + (r.days||[]).map(d=>DOW_KR[d]).join("·") + " " + h;
  if (r.freq === "monthly") return "매월 " + (r.days||[]).join("·") + "일 " + h;
  return "매일 " + h;
}
async function loadRoutines(){
  try{
    const d = await api("/api/routines");
    RTS = (d && d.routines) || [];
  }catch(e){ RTS = []; }
  paintRoutines();
}
function paintRoutines(){
  const sum = ROOT.querySelector("#rtSum"), box = ROOT.querySelector("#rtBox"), car = ROOT.querySelector("#rtCaret");
  if(!box) return;
  const on = RTS.filter(r=>r.enabled).length;
  if (sum) sum.textContent = RTS.length ? ("· 켜짐 " + on + " / " + RTS.length) : "· 없음";
  if (car) car.textContent = RT_OPEN ? "▴" : "▾";
  box.hidden = !RT_OPEN;
  if (!RT_OPEN) return;
  if (!RTS.length){ box.innerHTML = '<div class="empty">아직 정기 일감이 없어요.</div>'; return; }
  box.innerHTML = RTS.map(r=>{
    const who = (TEAM[r.dept] && TEAM[r.dept].nm) || r.dept;
    const bad = Number(r.fail_count) > 0;
    return `<div class="slip" style="padding:12px 14px;margin-bottom:8px;opacity:${r.enabled?1:.5}">
      <div style="display:flex;align-items:center;gap:9px">
        ${faceOf(r.dept,"s32")}
        <span style="flex:1;min-width:0">
          <b style="font-size:13px">${esc(r.name)}</b>
          <span style="display:block;font-size:10.5px;color:var(--ink3)">${esc(who)} · ${esc(rtWhen(r))}</span>
        </span>
        <button class="press" style="padding:5px 10px;font-size:10.5px;background:${r.enabled?'#DDEAE2':'#EDE3D6'};color:${r.enabled?'#2E7D5B':'#8A5A44'}"
          data-rttoggle="${r.routine_id}">${r.enabled?"켜짐":"꺼짐"}</button>
        <button class="press p-blue" style="padding:5px 10px;font-size:10.5px" data-rtrun="${r.routine_id}">지금</button>
      </div>
      <div style="margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span style="font-size:10.5px;color:var(--ink3)">시각</span>
        <select data-rthour="${r.routine_id}" style="font-family:inherit;font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid rgba(0,0,0,.15)">
          ${Array.from({length:18},(_,i)=>i+6).map(h=>`<option value="${h}"${h===r.at_hour?" selected":""}>${String(h).padStart(2,"0")}시</option>`).join("")}
        </select>
        ${r.last_run_day?`<span style="font-size:10px;color:var(--ink3)">· 마지막 ${esc(r.last_run_day)}</span>`:""}
        ${bad?`<span style="font-size:10px;color:var(--seal)">· 실패 ${r.fail_count}회</span>`:""}
      </div>
      ${bad&&r.last_error?`<div style="margin-top:6px;font-size:10px;color:var(--seal);opacity:.85">${esc(String(r.last_error).slice(0,110))}</div>`:""}
    </div>`;
  }).join("");
}
ROOT.addEventListener("change", async (e)=>{
  const sel = e.target.closest && e.target.closest("[data-rthour]");
  if(!sel) return;
  const d = await api("/api/routines/save",{method:"POST",
    body:JSON.stringify({routine_id:sel.dataset.rthour, at_hour:Number(sel.value)})});
  toast(d.ok ? "시각을 바꿨습니다" : (d.error||"실패"));
  if(d.ok) loadRoutines();
});

/* 판 번호는 본체가 표시한다 — 여기서는 손대지 않는다 */

}
</script>
</body>
