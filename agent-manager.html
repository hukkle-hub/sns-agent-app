<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="app-version" content="v305">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12211E">
<title>에이전트 매니저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#12211E; --paper:#EDE9DF; --paper3:#F4EFE2;
  --ink:#1C2B27; --ink3:#6B7A74;
  --seal:#B23A32; --done:#2E7D5B; --wait:#C9A227; --idle:#5B93B4;
  --line:rgba(255,255,255,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 40px;
  background:radial-gradient(1100px 460px at 50% -8%,#1A2E29 0%,transparent 62%),var(--desk);
  color:var(--paper);font-family:'IBM Plex Sans KR',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:0 13px}

/* 머리 */
.hd{padding:20px 0 13px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hd .eb{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#7E9A90}
.hd h1{font-family:'Gowun Batang',serif;font-size:23px;margin:5px 0 0}
.hd .now{margin-left:auto;text-align:right;font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;color:#A9C0B7;line-height:1.5}
.summary{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}
.chip{font-size:10.5px;padding:5px 11px;border-radius:20px}
.c-seal{background:rgba(178,58,50,.18);color:#E39189}
.c-wait{background:rgba(201,162,39,.16);color:#E0CB7A}
.c-run{background:rgba(255,255,255,.07);color:#A9C0B7}
.c-done{background:rgba(46,125,91,.18);color:#7FC7A5}
.c-idle{background:rgba(91,147,180,.16);color:#9FCBE4}

.ph{border-radius:8px;overflow:hidden;flex:0 0 auto;display:block;
  border:1.5px solid rgba(255,255,255,.7);background:#2A3A35}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.hd{position:relative}
.ver{position:absolute;right:0;top:-3px;font-family:'IBM Plex Mono',monospace;
  font-size:9px;color:#6F8B82;letter-spacing:.02em}
.gear{position:absolute;right:0;bottom:-13px;font-size:16px;text-decoration:none;opacity:.5}
.gear:active{opacity:1}
.ph .ini{display:flex;width:100%;height:100%;align-items:center;justify-content:center;
  font-weight:700;color:#CFE3DA;font-size:.8em;letter-spacing:0}
.s26{width:26px;height:26px;border-radius:6px}.s32{width:32px;height:32px;border-radius:6px}
.s36{width:36px;height:36px}.s44{width:44px;height:44px}.s56{width:56px;height:56px}
.s60{width:60px;height:72px}

.press{font-family:inherit;font-weight:600;cursor:pointer;border:0;
  transition:transform .06s ease, box-shadow .06s ease}
.p-ink{position:relative;background:transparent;color:#B23A32;border-radius:5px;
  padding:10px 18px;font-size:12.5px;border:1.6px solid rgba(178,58,50,.6);overflow:hidden}
.p-ink:before{content:"";position:absolute;inset:0;background:var(--seal);
  transform:scale(.2);opacity:0;border-radius:50%;transition:transform .2s ease,opacity .2s ease}
.p-ink:active{color:#fff;border-color:var(--seal)}
.p-ink:active:before{transform:scale(1.7);opacity:1}
.p-ink.sm{padding:6px 12px;font-size:11px;border-width:1.3px}
.p-ink span{position:relative}
.p-blue{background:#3E7A9B;color:#fff;border-radius:5px;padding:8px 14px;font-size:11.5px;
  box-shadow:0 3px 0 #27536B,0 5px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.p-blue:active{transform:translateY(3px);box-shadow:0 0 0 #27536B}
.p-plain{background:transparent;color:#5B6C66;border:1px solid rgba(28,43,39,.2);
  border-radius:5px;padding:9px 14px;font-size:11.5px}
/* 어두운 카드 위에 놓는 버튼. p-plain 을 여기 쓰면 글자와 테두리가 배경에 묻힌다 */
.p-ghost{background:rgba(255,255,255,.06);color:#CFE3DA;border:1px solid rgba(255,255,255,.22);
  border-radius:5px;padding:9px 14px;font-size:11.5px}
.p-ghost:active{background:rgba(255,255,255,.13)}

.sect{font-size:10px;color:#6F8B82;letter-spacing:.1em;margin:20px 0 9px;
  display:flex;align-items:center;gap:9px}
.sect b{color:#A9C0B7;font-weight:500}
.sect:after{content:"";flex:1;height:1px;background:var(--line)}

.big-seal{background:var(--paper);color:var(--ink);border-radius:9px;padding:13px;
  box-shadow:0 11px 24px rgba(0,0,0,.38),0 0 0 2px var(--seal),inset 0 1px 0 #fff}
.row{display:flex;align-items:center;gap:10px}
.nm{font-size:12.5px;font-weight:600;line-height:1.25}
.rl{font-size:9.5px;color:var(--ink3);margin-top:2px}
.tt{font-family:'Gowun Batang',serif;font-size:18px;font-weight:700;line-height:1.35;margin:12px 0 0}
.meta{font-size:10.5px;color:var(--ink3);margin-top:7px}
.waitfor{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--seal)}

.fold{display:flex;align-items:center;gap:10px;background:rgba(237,233,223,.92);color:var(--ink);
  border-radius:6px;padding:8px 10px;margin-top:7px;cursor:pointer;
  box-shadow:0 3px 9px rgba(0,0,0,.24);transition:transform .07s,box-shadow .07s}
.fold:active{transform:translateY(2px);box-shadow:0 1px 4px rgba(0,0,0,.22)}
.fold .t{flex:1;font-size:12px;font-weight:600;line-height:1.3;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .w{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink3);white-space:nowrap}

.ask{background:var(--paper3);color:var(--ink);border-radius:9px;padding:13px;
  box-shadow:0 8px 18px rgba(0,0,0,.3),0 0 0 1.5px rgba(201,162,39,.55)}
.say{background:#fff;border-radius:4px 13px 13px 13px;padding:10px 12px;font-size:12.5px;
  line-height:1.65;margin-top:11px;box-shadow:0 2px 5px rgba(0,0,0,.06)}
.quick{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.qb{font-size:10.5px;padding:6px 11px;border-radius:20px;border:1px solid rgba(28,43,39,.2);
  background:#fff;color:#3E504A;cursor:pointer;font-family:inherit;font-weight:500;
  box-shadow:0 2px 0 rgba(28,43,39,.1);transition:transform .06s,box-shadow .06s}
.qb:active{transform:translateY(2px);box-shadow:0 0 0}
.rest{font-size:9.5px;color:var(--ink3);margin-top:8px}
.ansin{display:flex;gap:8px;margin-top:10px;align-items:center;
  border-top:1px solid rgba(28,43,39,.12);padding-top:10px}
.ansin input{flex:1;border:0;background:transparent;font-size:12.5px;font-family:inherit;
  color:var(--ink);padding:5px 2px}
.ansin input:focus{outline:0}

.run{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;
  padding:10px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  margin-top:7px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--wait);
  animation:pl 1.6s ease-in-out infinite;flex:0 0 6px}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.pips{display:flex;gap:3px;width:64px;flex:0 0 64px}
.pip{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,.15)}
.pip.d{background:var(--done)}.pip.c{background:var(--wait)}

/* 결과물 보기 */
.sheet{background:var(--paper3);color:var(--ink);border-radius:9px;padding:15px;margin-top:10px;
  box-shadow:0 3px 0 rgba(0,0,0,.28),0 10px 22px rgba(0,0,0,.3)}
.sheet h4{margin:0 0 9px;font-size:11px;color:var(--ink3);font-weight:600;
  display:flex;align-items:center;gap:8px}
.sheet h4 .cp{margin-left:auto;font-size:10.5px;color:#3E7A9B;border:1px solid rgba(62,122,155,.4);
  border-radius:5px;padding:4px 10px;cursor:pointer;background:transparent;font-family:inherit}
.sheet .body{font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.vhd{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.vback{border:1px solid var(--line);background:transparent;color:#A9C0B7;border-radius:5px;
  padding:8px 13px;font-size:11.5px;font-family:inherit;cursor:pointer}
.vmeta{font-size:10px;color:#7E9A90;margin-top:5px}
.cardn{border-top:1px dashed rgba(28,43,39,.2);padding-top:9px;margin-top:9px;font-size:12.5px;
  line-height:1.7;white-space:pre-wrap}
.cardn:first-of-type{border-top:0;padding-top:0;margin-top:0}
.donebig{border:1px solid rgba(46,125,91,.32);background:rgba(46,125,91,.09);
  border-radius:8px;padding:11px;position:relative}
.stmp{position:absolute;right:11px;top:11px;width:36px;height:36px;border-radius:50%;
  border:1.6px solid var(--done);color:var(--done);display:grid;place-items:center;
  font-size:10px;font-weight:700;transform:rotate(-13deg);opacity:.92}
.donestrip{display:flex;align-items:center;gap:7px;margin-top:7px;padding:8px 10px;
  border:1px solid rgba(46,125,91,.22);border-radius:8px;background:rgba(46,125,91,.05);
  cursor:pointer;overflow-x:auto}
.donestrip .lbl{font-size:9.5px;color:#7FC7A5;white-space:nowrap;flex:0 0 auto}
.dfaces{display:flex;flex:1}
.dfaces .ph{margin-left:-7px;border-color:#17302A}
.dfaces .ph:first-child{margin-left:0}
.morec{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#7FC7A5;flex:0 0 auto}

.bench{border:1px dashed rgba(91,147,180,.4);background:rgba(91,147,180,.06);
  border-radius:9px;padding:12px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 5px;align-items:stretch}
.pcard{flex:0 0 160px;border-radius:9px;padding:10px;cursor:pointer;
  display:flex;flex-direction:column;            /* 버튼을 바닥에 붙이기 위해 */
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.04));
  border:1px solid var(--line);box-shadow:0 5px 13px rgba(0,0,0,.28);
  transition:transform .1s,box-shadow .1s}
.pcard .rl{min-height:2.6em}                     /* 역할이 한 줄이든 두 줄이든 자리를 같게 */
.pcard .tags{margin-top:6px;min-height:2.2em}    /* 태그가 두 개든 세 개든 자리를 같게 */
.pcard .call{margin-top:auto;padding-top:9px}    /* 남는 공간을 위로 밀어 버튼을 바닥에 */
.pcard:active{transform:translateY(3px);box-shadow:0 1px 4px rgba(0,0,0,.26)}
.tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:20px;
  background:rgba(255,255,255,.09);color:#9FB5AC;margin:4px 3px 0 0}

/* 총괄석 — 늘 맨 위. 여기서 시키면 총괄이 부서에 나눠 준다 */
.chief{background:var(--paper);color:var(--ink);border-radius:10px;padding:13px;margin:0 0 16px;
  border-top:3px solid var(--seal);
  box-shadow:0 12px 26px rgba(0,0,0,.42),inset 0 1px 0 #fff}
.chief .th{display:flex;align-items:center;gap:11px;padding-bottom:11px;
  border-bottom:1px solid rgba(28,43,39,.13)}
.chief .rl{font-size:10px;color:var(--ink3)}
.chief .nm{font-weight:700;font-size:14px}
.chief .badge{margin-left:auto;font-size:9.5px;color:var(--seal);
  border:1px solid rgba(178,58,50,.35);border-radius:20px;padding:4px 10px}
.cwho{display:flex;align-items:center;gap:7px;margin:0 0 7px;font-size:10.5px;color:var(--ink3)}
.cwho .ph{width:22px;height:22px;border-radius:5px}
.talk{background:var(--paper);color:var(--ink);border-radius:9px;padding:13px;
  box-shadow:0 12px 26px rgba(0,0,0,.4),inset 0 1px 0 #fff}
.th{display:flex;align-items:center;gap:11px;padding-bottom:11px;
  border-bottom:1px solid rgba(28,43,39,.13)}
.live{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:9.5px;color:var(--done)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--done);display:block;animation:pl 1.8s infinite}
.oldfold{display:flex;align-items:center;gap:8px;margin-top:11px;padding:8px 11px;
  border-radius:20px;background:rgba(28,43,39,.05);font-size:11px;color:#5B6C66;cursor:pointer;
  border:1px solid rgba(28,43,39,.1)}
.bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:12.5px;
  line-height:1.68;margin-top:10px;box-shadow:0 2px 5px rgba(0,0,0,.06);white-space:pre-wrap}
.bubble.me{background:#DDE7E3;border-radius:14px 4px 14px 14px;margin-left:36px}
.tstamp{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink3);margin:9px 0 0;text-align:center}
.tin{display:flex;gap:9px;margin-top:12px;align-items:center;
  border-top:1px solid rgba(28,43,39,.13);padding-top:12px}
.tin input{flex:1;border:0;background:transparent;font-size:13px;font-family:inherit;
  color:var(--ink);padding:6px 2px}
.tin input:focus{outline:0}
.send{width:38px;height:38px;border-radius:50%;background:#3E7A9B;color:#fff;border:0;
  font-size:14px;cursor:pointer;box-shadow:0 3px 0 #27536B,0 5px 10px rgba(0,0,0,.3);flex:0 0 38px}
.send:active{transform:translateY(3px);box-shadow:0 0 0 #27536B}

/* 새 일 시작 */
.newjob{border:1px solid var(--line);border-radius:9px;padding:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03))}
.newjob input,.newjob textarea{width:100%;border:1px solid var(--line);border-radius:6px;
  background:rgba(0,0,0,.18);color:var(--paper);font-family:inherit;font-size:12.5px;
  padding:9px 10px;margin-top:7px}
.newjob input:focus,.newjob textarea:focus{outline:0;border-color:rgba(91,147,180,.55)}
.chans{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chn{font-size:10.5px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:#9FB5AC;cursor:pointer;user-select:none}
.chn.on{background:rgba(91,147,180,.22);border-color:rgba(91,147,180,.55);color:#BBD7E6}

.empty{font-size:11.5px;color:#6F8B82;padding:14px 2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:rgba(18,33,30,.96);border:1px solid var(--line);color:var(--paper);
  padding:11px 18px;border-radius:22px;font-size:12px;z-index:99;
  box-shadow:0 8px 22px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══ 화면 크기 구분 ═══
   모바일: 한 손. 한 줄로 흐른다.
   태블릿: 두 손. 폭을 넓히고 손가락에 맞게 키운다.
   PC: 마우스. 두 단으로 벌리고 글자를 줄인다. */

/* 태블릿 — 600px 이상 */
@media (min-width:600px){
  .wrap{max-width:860px;padding:0 20px}
  body{font-size:15px}
  .press{min-height:44px}                 /* 손가락 기준 최소 크기 */
  .hd h1{font-size:27px}
  .hscroll{display:grid;grid-template-columns:repeat(2,1fr);overflow:visible}
  .pcard{flex:auto;width:auto}
  .sheet,.slip{padding:17px}
}

/* PC — 1024px 이상 */
@media (min-width:1024px){
  .wrap{max-width:1140px;padding:0 26px}
  body{font-size:14px}
  .hscroll{grid-template-columns:repeat(3,1fr)}
  .press{min-height:38px}                 /* 마우스는 정확하다. 클 필요가 없다 */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .two > *{min-width:0}
}

/* 아주 넓은 화면 — 1500px 이상 */
@media (min-width:1500px){
  .wrap{max-width:1320px}
  .hscroll{grid-template-columns:repeat(4,1fr)}
}

/* 마우스가 있는 기기에서만 hover 를 준다 (터치에서 hover 는 눌린 채로 남는다) */
@media (hover:hover) and (pointer:fine){
  .press:hover{filter:brightness(1.06)}
  .drawer .dh:hover{background:rgba(255,255,255,.04)}
}

/* 새 판이 올라왔을 때 알리는 띠 */
.newver{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#EDE9DF;color:#1C2B27;padding:13px 16px;display:none;
  align-items:center;gap:12px;font-size:12.5px;
  box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.newver.on{display:flex}
.newver b{flex:1}
.newver button{font-family:inherit;font-weight:700;font-size:12px;border:0;border-radius:6px;
  padding:9px 15px;background:#3E7A9B;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div><div class="eb">AGENT MANAGER</div><h1>에이전트 매니저</h1></div>
    <div class="now" id="clock"></div>
    <div class="ver" id="vertag"></div>
    <a class="gear" href="./settings.html" title="설정">⚙️</a>
  </div>
  <div class="summary" id="summary"></div>
  <div class="chief" id="chief">
    <div class="th" id="chiefhead"></div>
    <div id="cmsgs"></div>
    <div class="tin"><span style="font-size:15px;opacity:.35">✎</span>
      <input id="cfin" placeholder="총괄에게 시킬 일" autocomplete="off">
      <button class="send press" id="cfGo">▶</button></div>
  </div>
  <div id="board"><div class="empty">불러오는 중…</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="./photos.js"></script>
<script>
/* ─────────────────────────────────────────────
   에이전트 매니저 — 백엔드에 물린 실제 화면
   규칙: 하나만 크게, 나머지는 접는다.
   ───────────────────────────────────────────── */
const API = (location.hostname.endsWith("github.io"))
  ? "https://sns-agent-backend.onrender.com"
  : (localStorage.getItem("backendUrl") || "https://sns-agent-backend.onrender.com");

const TEAM = {
  ops:         { nm:"오세라", rl:"총괄실 · 비서",            tags:["조율","일정","발행"] },
  creation:    { nm:"이서연", rl:"글1 이야기팀 · 콘텐츠 디렉터", tags:["주제","톤","총괄"] },
  strategy:    { nm:"한지우", rl:"글2 이야기팀 · 카피라이터",   tags:["후킹","캡션","해시태그"] },
  advisory:    { nm:"정유진", rl:"고1 고객팀 · CS 매니저",      tags:["카톡 응대","친구 관리","재구매"] },
  publishing:  { nm:"임채원", rl:"필1 필름팀 · 영상 PD",       tags:["영상기획","연출"] },
  scout:       { nm:"서다은", rl:"필2 필름팀 · 대본 작가",      tags:["대본","트렌드"] },
  editing:     { nm:"노아라", rl:"디3 디자인팀 · 웹 퍼블리셔",    tags:["구현","반응형","검수"] },

function ago(iso){

  if(h<24) return h+"시간 "+(m%60)+"분";
  return Math.floor(h/24)+"일";
}

async function unlock(){
  const pw = window.prompt("비밀번호를 입력해 주세요");
  if(!pw) return false;
  try{
    const r = await fetch(API+"/api/login",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
    const d = await r.json().catch(()=>null);
    if(d && d.token){ TOKEN = d.token; try{ localStorage.setItem("authToken",TOKEN); }catch(e){} return true; }
  }catch(e){}
  toast("비밀번호가 맞지 않습니다");
  return false;
}
async function api(path, opts, _retried){
  let r;
  const opt = Object.assign({}, opts||{});
  opt.headers = Object.assign({"Content-Type":"application/json"},
    TOKEN ? {"Authorization":"Bearer "+TOKEN} : {}, opt.headers||{});
  try{ r = await fetch(API+path, opt); }
  catch(e){ return { ok:false, error:"서버에 닿지 못했습니다 — "+(e.message||"연결 실패") }; }
  let d=null; try{ d = await r.json(); }catch(e){ d=null; }
  if(r.status===401 && !_retried){                     // 잠겨 있다 — 한 번만 열어 보고 다시 시도
    if(await unlock()) return api(path, opts, true);
    return { ok:false, status:401, error:"잠겨 있습니다" };
  }
  if(!r.ok) return { ok:false, status:r.status, error:(d&&d.error)||("서버 오류 "+r.status) };
  if(!d) return { ok:false, error:"빈 응답" };
  if(d.ok===undefined) d.ok = true;
  return d;
}

/* ── 사진 (v305) ──
   원본은 서버에 쌓지 않는다. 1024px·JPEG 로 줄여 한 번만 보내고,
   AI가 본 내용을 글로 적어 그것만 남긴다. 예전 대역폭 사고를 되풀이하지 않기 위해. */
let PHOTOS = [];   // [{data(base64), media_type, url(미리보기)}]
function shrinkPhoto(file){
  return new Promise(resolve=>{
    if(!/^image\//.test(file.type||"")) return resolve(null);
    const img = new Image();
    img.onload = ()=>{
      const max=1024; let w=img.width, h=img.height;
      if(w>max||h>max){ if(w>=h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const url=c.toDataURL("image/jpeg",0.8);
      resolve({ data:url.split(",")[1], media_type:"image/jpeg", url:url });
    };
    img.onerror = ()=>resolve(null);
    img.src = URL.createObjectURL(file);
  });
}
async function addPhotos(files){
  for(let i=0; i<files.length && PHOTOS.length<3; i++){
    const p = await shrinkPhoto(files[i]);
    if(p) PHOTOS.push(p);
  }
  paintPhotos();
}
function paintPhotos(){
  const bar = document.getElementById("njPhotoBar");
  if(!bar) return;
  bar.innerHTML = PHOTOS.map((p,i)=>
    `<span style="position:relative;display:inline-block">
       <img src="${p.url}" style="width:52px;height:52px;object-fit:cover;border-radius:7px">
       <b data-px="${i}" style="position:absolute;top:-5px;right:-5px;background:#8A5A44;color:#fff;
         width:17px;height:17px;border-radius:50%;font-size:11px;line-height:17px;text-align:center;cursor:pointer">×</b>
     </span>`).join("");
  bar.querySelectorAll("[data-px]").forEach(b=>{
    b.onclick = ()=>{ PHOTOS.splice(+b.dataset.px,1); paintPhotos(); };
  });
}
document.addEventListener("change",(e)=>{
  if(e.target && e.target.id==="njPhoto"){ addPhotos(e.target.files||[]); e.target.value=""; }
});

   사람은 일이 사라진 줄 안다. 대화와 진행 중인 작업 번호를 기기에 남긴다. */
const CHIEF_KEY = "chief-v1";
function saveChief(){
  try{ localStorage.setItem(CHIEF_KEY, JSON.stringify({
    msgs: CHIEF.msgs.slice(-14), running: CHIEF.running,
    jobId: CHIEF.jobId, since: CHIEF.since })); }catch(e){}
}
function loadChief(){
  try{
    const d = JSON.parse(localStorage.getItem(CHIEF_KEY)||"null");
    if(d && Array.isArray(d.msgs)) CHIEF = {
      msgs:d.msgs, running:!!d.running, jobId:d.jobId||null, since:d.since||0 };
  }catch(e){}
}

/* 총괄에게 시킨다 → 서버의 총괄이 분담해 부서들이 순서대로 수행한다.
   이름을 붙이지 않는 것이 핵심 — 이름을 붙이면 그 사람에게 직행한다. */
async function chiefSay(v){
  CHIEF.msgs.push({me:true, t:v});
  CHIEF.msgs.push({t:"받았습니다. 누구에게 줄지 정하겠습니다…", pending:true});
  CHIEF.running = true; CHIEF.since = Date.now(); CHIEF.jobId = null;
  saveChief(); renderChief();

  const d = await api("/api/instruct",{method:"POST",
    body:JSON.stringify({ instruction:v, source:"manager" })});
  if(!d.ok || !d.id){ chiefDone(d.error||"전달하지 못했습니다."); return; }
  CHIEF.jobId = d.id; saveChief();
  await watchChief(d.id);
}

function chiefSet(txt){
  const i = CHIEF.msgs.findIndex(m=>m.pending);
  if(i>=0) CHIEF.msgs[i].t = txt;
  renderChief();
}
function chiefDone(txt){
  const i = CHIEF.msgs.findIndex(m=>m.pending);
  if(i>=0) CHIEF.msgs[i] = { t:txt }; else CHIEF.msgs.push({ t:txt });
  CHIEF.running = false; CHIEF.jobId = null;
  if(CHIEF.msgs.length > 14) CHIEF.msgs = CHIEF.msgs.slice(-14);
  saveChief(); renderChief(); load();
}

/* 진행 중인 분담을 지켜본다. 새로고침 뒤에도 이 함수만 다시 붙이면 이어진다. */
async function watchChief(id){
  CHIEF.running = true; renderChief();
  const MAX = 150;                    // 2.5초 x 150 ≈ 6분
  for(let n=0; n<MAX; n++){
    await new Promise(r=>setTimeout(r, 2500));
    const j = await api("/api/instruct/"+id);
    if(j.status===404 || (!j.ok && j.status===404)){
      chiefDone("총괄이 그 일을 기억하지 못합니다 — 서버가 다시 시작된 듯합니다. 다시 시켜 주세요.");
      return;
    }
    if(!j.ok) continue;
    if(j.status==="error"){ chiefDone("하다가 막혔습니다 — "+(j.error||"원인 불명")); return; }
    if(j.status==="done"){
      const ds = (j.depts||[]).filter(k=>TEAM[k]);
      const head = (ds.length ? ds.map(k=>TEAM[k].nm).join(" · ")+"에게 넘겼습니다." : "제가 처리했습니다.")
                 + (j.plan ? "\n\n"+String(j.plan).trim() : "");
      const i = CHIEF.msgs.findIndex(m=>m.pending);
      if(i>=0) CHIEF.msgs[i] = { t:head }; else CHIEF.msgs.push({ t:head });
      (j.results||[]).forEach(r=>{
        const t = String(r.text||"").trim();
        if(t) CHIEF.msgs.push({ who:r.dept, t:t });
      });
      CHIEF.running = false; CHIEF.jobId = null;
      if(CHIEF.msgs.length > 14) CHIEF.msgs = CHIEF.msgs.slice(-14);
      saveChief(); renderChief(); load();
      return;
    }
    chiefSet(j.progress ? String(j.progress) : "부서에 나누는 중…");
    if(n % 4 === 0) saveChief();
  }
  chiefDone("아직 끝나지 않았습니다. 잠시 뒤 새로고침하면 이어서 보여 드리겠습니다.");
}

  if(pend){
    h += `<div class="sheet" style="background:rgba(237,233,223,.94)">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="press p-ink" data-appredit="${r.generation_id}"><span>결재</span></button>
      </div>
      <div class="vmeta" style="color:#6B7A74;margin-top:7px">위에서 고친 내용이 그대로 함께 넘어갑니다.</div>
      <input type="text" id="rejwhy" placeholder="반려 사유 — 이것도 배움이 된다"
        style="width:100%;margin-top:11px;font-size:12px;font-family:inherit;color:var(--ink);
        background:#fff;border:1px solid rgba(28,43,39,.2);border-radius:6px;padding:9px 10px">
      <div style="margin-top:9px"><button class="press p-plain" data-reject="${r.generation_id}">반려</button></div>
    </div>`;
  }

  const co = r.channel_outputs;
  if(co && typeof co === "object"){
    Object.keys(co).forEach((ch,i)=>{
      const t = String(co[ch]||"").trim(); if(!t) return;
      h += `<div class="sheet"><h4>${esc(ch)}
        <button class="cp" data-copy="ch${i}">복사</button></h4>
        <div class="body" id="cp-ch${i}">${esc(t)}</div></div>`;
    });
  }
  if(Array.isArray(r.threads_chain) && r.threads_chain.length){
    h += `<div class="sheet"><h4>스레드 ${r.threads_chain.length}편
      <button class="cp" data-copy="th">복사</button></h4>
      <div class="body" id="cp-th">${esc(r.threads_chain.map((t,i)=>(i+1)+". "+t).join("\n\n"))}</div></div>`;
  }
  if(Array.isArray(r.cards) && r.cards.length){
    h += `<div class="sheet"><h4>카드뉴스 ${r.cards.length}장
      <button class="cp" data-copy="cd">복사</button></h4>
      <div id="cp-cd">${r.cards.map((c,i)=>
        `<div class="cardn"><b style="font-size:10px;color:var(--ink3)">${i+1}</b>
         ${esc(cardText(c))}</div>`).join("")}</div></div>`;
  }
  if(r.page_spec && typeof r.page_spec === "object"){
    const secs = Array.isArray(r.page_spec.sections) ? r.page_spec.sections : null;
    const txt = secs
      ? secs.map((x,i)=>(i+1)+". "+(typeof x==="string"?x:[x.name||x.title, x.purpose||x.desc||x.copy].filter(Boolean).join(" — "))).join("\n")
      : JSON.stringify(r.page_spec, null, 2);
    h += `<div class="sheet"><h4>홈페이지 구성안
      <button class="cp" data-copy="pg">복사</button></h4>
      <div class="body" id="cp-pg">${esc(txt)}</div></div>`;
  }
  return h;
}

function render(){
  const live=BOARD.live, done=BOARD.done;
  const seal = live.filter(r=>r.approval_status==="pending");
  const ask  = live.filter(r=>r.approval_status==="needs_input");
  const run  = live.filter(r=>r.approval_status==="processing");
  const fail = live.filter(r=>r.approval_status==="failed"||r.approval_status==="cancelled");
  const busy = new Set([...seal,...ask,...run].map(whoOf));
  const free = BENCH.filter(k=>!busy.has(k));

  $("#summary").innerHTML =
    (seal.length?`<span class="chip c-seal">● 결재 ${seal.length}</span>`:"")
  + (ask.length ?`<span class="chip c-wait">● 확인 ${ask.length}</span>`:"")
  + (run.length ?`<span class="chip c-run">● 진행 ${run.length}</span>`:"")
  + (done.length?`<span class="chip c-done">✓ 완료 ${done.length}</span>`:"")
  + `<span class="chip c-idle">○ 여유 ${free.length}</span>`;

  if(VIEW){
    const all = BOARD.live.concat(BOARD.done);
    const row = all.find(r=>String(r.generation_id)===String(VIEW));
    if(row){ $("#board").innerHTML = viewSheet(row); return; }
    VIEW = null;
  }

  let h = "";

  if(seal.length){
    h += `<div class="sect"><b>결재</b> · ${seal.length}건 · 오래 기다린 순</div>`;
    h += sealBig(seal[0]);
    seal.slice(1).forEach(r=> h += sealFold(r));
  }
  if(ask.length){
    h += `<div class="sect"><b>확인 요청</b> · ${ask.length}건</div>`;
    h += askCard(ask[0]);
    ask.slice(1).forEach(r=>{
      const k=whoOf(r);
      h += `<div class="fold" style="background:rgba(244,239,226,.9)" data-open="${r.generation_id}">
        ${faceOf(k,"s32")}<span class="t">${esc((r.open_questions||[])[0]||r.topic)}</span>
        <span class="w">${ago(r.created_at)}</span><span style="font-size:15px;color:var(--ink3)">›</span></div>`;
    });
  }
  if(run.length){
    h += `<div class="sect"><b>진행 중</b> · ${run.length}건</div>`;
    run.forEach(r=> h += runRow(r));
  }
  if(fail.length){
    h += `<div class="sect"><b>중단됨</b> · ${fail.length}건</div>`;
    fail.forEach(r=> h += failRow(r));
  }
  if(done.length){
    h += `<div class="sect"><b>끝난 일</b> · ${done.length}건</div>`;
    const d0=done[0], k0=whoOf(d0), p0=TEAM[k0];
    h += `<div class="donebig"><span class="stmp">완료</span>
      <div class="row">${faceOf(k0,"s36")}
        <div><div class="nm">${p0.nm}</div><div class="rl" style="color:#7E9A90">${p0.rl}</div></div></div>
      <div style="font-size:12px;margin-top:9px">${esc(d0.topic)}</div>
      <div style="font-size:9.5px;color:#7FC7A5;margin-top:4px">${ago(d0.approved_at)} 전${
        d0.edit_distance!=null?` · 수정률 ${Math.round(d0.edit_distance*100)}%`:""}</div>
      <button class="press p-ghost" style="margin-top:10px;padding:9px 15px;font-size:11.5px"
        data-open="${d0.generation_id}">내용 보기 →</button></div>`;
    if(done.length>1){
      const rest=done.slice(1);
      h += `<div class="donestrip" data-toggle="done">
        <span class="lbl">이전 ${rest.length}건</span>
        <span class="dfaces">${rest.slice(0,7).map(r=>faceOf(whoOf(r),"s26")).join("")}</span>
        <span class="morec">${OPEN.done?"접기 ▴":"펼치기 ▾"}</span></div>`;
      if(OPEN.done){
        rest.forEach(r=>{
          h += `<div class="fold" style="background:rgba(46,125,91,.1);color:var(--paper);box-shadow:none;border:1px solid rgba(46,125,91,.22)">
            ${faceOf(whoOf(r),"s26")}<span class="t" style="font-weight:400">${esc(r.topic)}</span>
            <span class="w" style="color:#7FC7A5">${ago(r.approved_at)}</span></div>`;
        });
      }
    }
  }

  /* 부를 수 있는 자리 */
  h += `<div class="sect"><b>부를 수 있는 자리</b> · ${free.length}</div>
    <div class="bench"><div class="hscroll">`;
  (free.length?free:BENCH).forEach(k=>{
    const p=TEAM[k];
    h += `<div class="pcard" data-call="${k}">
      <div style="display:flex;gap:10px">${faceOf(k,"s60")}
        <div><div class="nm">${p.nm}</div><div class="rl" style="color:#7E9A90">${p.rl}</div></div></div>
      <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="call"><button class="press p-blue" style="width:100%;padding:9px 0">부르기</button></div></div>`;
  });
  h += `</div></div>`;

  /* 대화 또는 새 일 */
  if(TALK){
    const p=TEAM[TALK.key];
    h += `<div class="sect"><b>대화</b> · ${p.nm}</div>
      <div class="talk"><div class="th">${faceOf(TALK.key,"s56")}
        <div><div class="nm" style="font-size:14px">${p.nm}</div><div class="rl">${p.rl}</div></div>
        <span class="live"><i></i>지금 자리에</span></div>`;
    const ms=TALK.msgs;
    if(ms.length>4 && !OPEN.talk){
      h += `<div class="oldfold" data-toggle="talk">▸ 이전 대화 ${ms.length-2}개</div>`;
      ms.slice(-2).forEach(m=> h += `<div class="bubble ${m.me?"me":""}">${esc(m.t)}</div>`);
    } else {
      ms.forEach(m=> h += `<div class="bubble ${m.me?"me":""}">${esc(m.t)}</div>`);
    }
    h += `<div class="tin"><span style="font-size:15px;opacity:.35">✎</span>
      <input id="talkin" placeholder="편하게 말씀해 주세요">
      <button class="send press" data-say="1">▶</button></div></div>`;
  } else {
    h += `<div class="sect"><b>새 일 시작</b></div>
      <div class="newjob">
        <input id="njTopic" placeholder="무엇을 만들까요">
        <textarea id="njRef" rows="2" placeholder="참고 URL (선택 · 한 줄에 하나)"></textarea>
        <input type="file" id="njPhoto" accept="image/*" multiple style="display:none">
        <button class="press p-ghost" id="njPhotoBtn"
          style="margin-top:8px;width:100%;padding:9px 0;font-size:12px">📷 사진 넣기 (최대 3장)</button>
        <div id="njPhotoBar" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div>
        <div class="chans" id="njChans">
          ${["인스타그램","네이버 블로그/카페","유튜브","상품 상세페이지","스레드(Threads)","홈페이지"]
            .map((c,i)=>`<span class="chn${i===0?" on":""}" data-chn="${c}">${c}</span>`).join("")}
        </div>
        <button class="press p-blue" id="njGo" style="margin-top:11px;width:100%;padding:11px 0">시작</button>
      </div>`;
  }

  $("#board").innerHTML = h;
}

/* ── 조작 ── */
document.addEventListener("click", async (e)=>{
  const t = e.target.closest("[data-approve],[data-answer],[data-call],[data-toggle],[data-say],[data-retry],[data-pcancel],[data-pdel],[data-open],[data-copy],[data-appredit],[data-reject],#vback,#njGo,#njPhotoBtn,#cfGo,[data-chn]");
  if(!t) return;

  if(t.dataset.chn!=null){ t.classList.toggle("on"); return; }

  if(t.dataset.toggle){ OPEN[t.dataset.toggle]=!OPEN[t.dataset.toggle]; render(); return; }

  if(t.dataset.open){ VIEW = t.dataset.open; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(t.id==="vback"){ VIEW = null; render(); return; }
  if(t.dataset.copy){
    const el = $("#cp-"+t.dataset.copy);
    const txt = el ? (el.value != null ? el.value : (el.innerText || el.textContent || "")) : "";
    if(!txt){ toast("복사할 내용이 없습니다"); return; }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
      else { const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
             ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
      toast("복사했습니다");
    }catch(err){ toast("복사하지 못했습니다"); }
    return;
  }
  if(t.id==="cfGo"){
    const inp=$("#cfin"); const v=(inp&&inp.value||"").trim();
    if(!v){ toast("무엇을 시킬지 적어 주세요"); return; }
    inp.value="";
    await chiefSay(v);
    return;
  }
  if(t.dataset.appredit){
    const id=t.dataset.appredit, ta=$("#cp-main");
    const edited=(ta && ta.value || "").trim();
    if(!edited){ toast("원고가 비어 있습니다"); return; }
    t.disabled=true;
    const d = await api("/api/content/approve",{method:"POST",body:JSON.stringify({
      generation_id:id, action:"approve", edited })});
    if(d.ok){
      const pct = d.edit_distance!=null ? Math.round(d.edit_distance*100) : 0;
      toast(pct>=5 ? `결재했습니다 · ${pct}% 고침 — 배움으로 올립니다`
                   : (pct>0 ? `결재했습니다 · ${pct}% 고침 (5% 미만은 배움으로 안 올라갑니다)`
                            : "결재했습니다 · 고친 데 없음"));
      VIEW=null; await load(true);
    } else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }
  if(t.dataset.reject){
    const id=t.dataset.reject, why=($("#rejwhy") && $("#rejwhy").value || "").trim();
    if(!why){ toast("반려 사유를 적어 주세요 — 이유가 곧 다음 규칙입니다"); return; }
    t.disabled=true;
    const d = await api("/api/content/approve",{method:"POST",body:JSON.stringify({
      generation_id:id, action:"reject", reason:why })});
    if(d.ok){ toast("반려했습니다 · 사유는 학습 검토로 올라갑니다"); VIEW=null; await load(true); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }
  if(t.dataset.approve){
    const id=t.dataset.approve;
    // 편집칸이 열려 있으면 거기 적은 것을 반드시 함께 보낸다.
    // 예전에는 '그대로 결재'가 사람이 고친 글을 조용히 버렸다.
    const ta=$("#cp-main");
    const edited=(ta && ta.value!=null) ? String(ta.value).trim() : "";
    t.disabled=true;
    const d = await api("/api/content/approve",{method:"POST",
      body:JSON.stringify(edited ? {generation_id:id,action:"approve",edited}
                                 : {generation_id:id,action:"approve"})});
    if(d.ok){
      const pct = d.edit_distance!=null ? Math.round(d.edit_distance*100) : 0;
      toast(pct>=5 ? `결재했습니다 · ${pct}% 고침 — 배움으로 올립니다`
                   : (pct>0 ? `결재했습니다 · ${pct}% 고침 (5% 미만은 배움으로 안 올라갑니다)`
                            : "결재했습니다 · 고친 데 없음"));
      VIEW=null; await load(true);
    } else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }
  if(t.dataset.answer){
    const id=t.dataset.answer;
    const inp=document.querySelector(`[data-ansfor="${id}"]`);
    const v=(inp&&inp.value||"").trim();
    // 비워서 보내면 '알아서 진행' 이다. 모르는 걸 억지로 적게 하지 않는다.
    t.disabled=true;
    const d = await api("/api/pipeline/answer",{method:"POST",
      body:JSON.stringify({ generation_id:id, answers: v ? [v] : [] })});
    if(d.ok){ toast(v?"답변을 반영해 다시 만듭니다":"모르는 부분은 빼고 진행합니다"); if(inp) inp.blur(); await load(true); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }
  if(t.dataset.call){
    const k=t.dataset.call, p=TEAM[k];
    const recent = BOARD.done[0];
    TALK = { key:k, msgs:[{ t:`네, 부르셨네요.\n${recent?`방금 「${recent.topic}」이 끝났던데 — 이어서 뭘 해볼까요?`:"무엇을 도와드릴까요?"}` }] };
    render();
    window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
    return;
  }
  if(t.dataset.say){
    const inp=$("#talkin"); const v=(inp&&inp.value||"").trim();
    if(!v) return;
    const p = TEAM[TALK.key] || { nm:"", rl:"" };
    TALK.msgs.push({me:true, t:v}); inp.value="";
    TALK.msgs.push({ t:"…", pending:true }); render();
    const say = (txt)=>{ const i=TALK.msgs.findIndex(m=>m.pending);
      if(i>=0) TALK.msgs[i]={t:txt}; else TALK.msgs.push({t:txt});
      if(!typingNow()) render(); };
    /* 서버는 지시문 안의 이름으로 담당을 고른다 — 이름을 앞에 붙인다 */
    const d = await api("/api/instruct",{method:"POST",body:JSON.stringify({
      instruction: p.nm ? (p.nm+" "+v) : v, source:"manager" })});
    if(!d.ok || !d.id){ say(d.error||"전달하지 못했습니다."); return; }
    let out="";
    for(let n=0; n<60; n++){
      await new Promise(r=>setTimeout(r, 2000));
      const j = await api("/api/instruct/"+d.id);
      if(!j.ok) continue;
      if(j.status==="error"){ out = "하다가 막혔어요 — "+(j.error||"원인 불명"); break; }
      if(j.status==="done"){ out = replyOf(j) || "마쳤습니다."; break; }
    }
    say(out || "생각이 길어지네요. 끝나면 위 목록에 올라옵니다.");
    load();
    return;
  }
  if(t.dataset.retry){
    t.disabled=true; toast("다시 시작합니다…");
    const d = await api("/api/pipeline/retry",{method:"POST",
      body:JSON.stringify({generation_id:t.dataset.retry})});
    if(d.ok){ toast("다시 돌리는 중입니다"); await load(true); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }
  /* v305: 하던 일을 멈춘다 — 다음 단계 경계에서 실제로 선다 */
  if(t.dataset.pcancel){
    if(!confirm("이 일을 멈출까요? 나중에 '다시'로 이어서 할 수 있어요.")) return;
    t.disabled=true; toast("멈추는 중…");
    const d = await api("/api/pipeline/cancel",{method:"POST",
      body:JSON.stringify({generation_id:t.dataset.pcancel})});
    if(d.ok){ toast("멈췄습니다"); await load(true); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }
  /* v305: 목록에서 지운다 — 되돌릴 수 없다 */
  if(t.dataset.pdel){
    if(!confirm("이 기록을 아주 지울까요? 되돌릴 수 없어요.")) return;
    t.disabled=true; toast("지우는 중…");
    const d = await api("/api/pipeline/delete",{method:"POST",
      body:JSON.stringify({generation_id:t.dataset.pdel})});
    if(d.ok){ toast("지웠습니다"); await load(true); }
    else { toast(d.error||"실패"); t.disabled=false; }
    return;
  }

  if(t.id==="njPhotoBtn"){
    if(PHOTOS.length>=3){ toast("사진은 3장까지예요"); return; }
    const f=$("#njPhoto"); if(f) f.click();
    return;
  }

  if(t.id==="njGo"){
    const topic=$("#njTopic").value.trim();
    if(!topic){ toast("무엇을 만들지 적어 주세요"); return; }
    const chans=[...document.querySelectorAll("#njChans .chn.on")].map(x=>x.dataset.chn);
    if(!chans.length){ toast("만들 것을 하나 이상 고르세요"); return; }
    const refs=$("#njRef").value.split("\n").map(s=>s.trim()).filter(s=>/^https?:\/\//.test(s)).slice(0,3);
    t.disabled=true; toast("시작합니다…");
    const d = await api("/api/pipeline/run",{method:"POST",
      body:JSON.stringify({topic, channels:chans, refUrls:refs,
        photos: PHOTOS.map(p=>({data:p.data, media_type:p.media_type}))})});
    if(d.ok){ const np=PHOTOS.length;
      $("#njTopic").value=""; $("#njRef").value=""; PHOTOS=[]; paintPhotos();
      toast(np?("사진 "+np+"장과 함께 시작했습니다"):"작업이 시작되었습니다"); await load(); }
    else { toast(d.error||"실패"); }
    t.disabled=false;
    return;
  }
});

});

/* ═══ 판 번호 확인 ═══
   GitHub Pages 는 한 번 받은 화면을 오래 들고 있는다.
   그래서 새로 올려도 폰에서는 옛 화면이 계속 뜬다.
   자기 주소를 캐시 없이 다시 읽어 표식이 달라졌으면 알려준다. */
const APP_VER = (document.querySelector('meta[name="app-version"]')||{}).content || "";
let SRV_VER = "";

async function checkVersions(){
  // 서버 판 번호
  try{
    const r = await fetch(API+"/api/version", { cache:"no-store" });
    const d = await r.json();
    SRV_VER = d && d.version || "";
  }catch(e){}
  // 내 화면이 최신인지 — 자기 파일을 다시 읽어 표식만 본다
  try{
    const r = await fetch(location.pathname + "?_=" + Date.now(), { cache:"no-store" });
    const t = await r.text();
    const m = t.match(/name="app-version"\s+content="([^"]+)"/);
    if (m && m[1] && APP_VER && m[1] !== APP_VER){
      const el = document.getElementById("newver");
      if (el) el.classList.add("on");
    }
  }catch(e){}
  paintVersion();
}
function paintVersion(){
  const el = document.getElementById("vertag");
  if (!el) return;
  const same = !SRV_VER || !APP_VER || SRV_VER === APP_VER;
  el.innerHTML = APP_VER + (SRV_VER ? (" · 서버 " + SRV_VER) : "")
    + (same ? "" : ' <span style="color:#C9A227">· 앱과 다름</span>');
}
setTimeout(checkVersions, 3000);
setInterval(checkVersions, 10*60*1000);
</script>
<div class="newver" id="newver">
  <b>새 판이 올라왔습니다. 새로고침하면 반영됩니다.</b>
  <button onclick="location.reload(true)">새로고침</button>
</div>
</body>
</html>
